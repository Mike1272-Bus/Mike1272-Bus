<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Bricolage'; font-weight: 800; src: url('assets/fonts/bricolage-800.ttf') format('truetype'); }
      @font-face { font-family: 'Work Sans'; font-weight: 700; src: url('assets/fonts/worksans-700.ttf') format('truetype'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #071434; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Bricolage', sans-serif; color: #fff; background: #071434; }
      .ab { position: absolute; }
      .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .line { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
      .pill { position: absolute; left: 50%; transform: translateX(-50%); padding: 14px 44px; border-radius: 999px; font-size: 52px; letter-spacing: 0.04em; white-space: nowrap; }
      /* avant */
      #s1 { background: #d9d9de; }
      #s1 .feed { position: absolute; left: 60px; top: 330px; width: 960px; height: 1200px; border-radius: 36px; overflow: hidden; background: #bbb; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
      #s1 .feed img { width: 100%; height: 100%; object-fit: cover; }
      #s1 .meta { position: absolute; left: 60px; top: 1550px; width: 960px; font-family: 'Work Sans'; font-weight: 700; font-size: 34px; color: #6b6b75; }
      .gtxt { color: #2b2b33; font-size: 70px; letter-spacing: -0.02em; }
      /* après */
      #s2 { background: #071434; }
      .blur { position: absolute; left: -60px; top: -60px; width: 1200px; height: 2040px; object-fit: cover; filter: blur(34px) brightness(0.55) saturate(1.3); }
      #card { position: absolute; left: 60px; top: 330px; width: 960px; height: 1200px; border-radius: 40px; overflow: hidden; border: 6px solid #fff; box-shadow: 18px 20px 0 #2ec4ff, 0 40px 90px rgba(0,0,0,0.5); }
      #card video { width: 100%; height: 100%; object-fit: cover; }
      #shine { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0) 60%); background-size: 300% 100%; background-repeat: no-repeat; }
      #grad { position: absolute; left: 0; bottom: 0; width: 100%; height: 520px; background: linear-gradient(transparent, rgba(0,0,0,0.75)); }
      .kw { position: absolute; left: 0; width: 960px; bottom: 190px; text-align: center; font-size: 150px; letter-spacing: -0.045em; color: #fff; text-shadow: 8px 10px 0 #2ec4ff, 0 20px 50px rgba(0,0,0,0.5); white-space: nowrap; }
      .stk { position: absolute; width: 230px; height: 230px; filter: drop-shadow(0 20px 26px rgba(0,0,0,0.45)); }
      #badge { position: absolute; left: 760px; top: 290px; width: 240px; height: 240px; border-radius: 50%; background: #2ec4ff; color: #0b1e4a; font-size: 40px; line-height: 240px; text-align: center; white-space: nowrap; box-shadow: 0 16px 30px rgba(0,0,0,0.4); }
      #cta { left: 120px; top: 1600px; width: 840px; height: 140px; border-radius: 70px; background: #25d366; color: #fff; display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 54px; box-shadow: 10px 12px 0 #0b1e4a; white-space: nowrap; }
      #tag { left: 50%; top: 1790px; transform: translateX(-50%); font-family: 'Work Sans'; font-weight: 700; font-size: 26px; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,0.75); white-space: nowrap; }
      /* fin */
      #s3 { background: radial-gradient(circle at 30% 18%, #2a5bc4 0%, #123077 45%, #071434 100%); }
      .big { font-size: 112px; letter-spacing: -0.035em; line-height: 1; }
      .y { color: #ffd60a; }
      #btn { left: 120px; top: 1180px; width: 840px; height: 150px; border-radius: 75px; background: #ffd60a; color: #0b1e4a; display: flex; align-items: center; justify-content: center; gap: 22px; font-size: 64px; box-shadow: 12px 14px 0 #000; white-space: nowrap; }
      #num { top: 1390px; font-family: 'Work Sans'; font-weight: 700; font-size: 54px; }
      #wm { top: 1520px; font-size: 36px; letter-spacing: .06em; text-transform: uppercase; text-shadow: 3px 4px 0 #ffd60a; }
      #iris { left: 540px; top: 960px; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%; background: #ffd60a; z-index: 30; }
      #fade { left: 0; top: 0; width: 1080px; height: 1920px; background: #071434; z-index: 40; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">

      <!-- AVANT (0 - 4,2) -->
      <div class="scene" id="s1"><div class="cam" id="k1">
        <div class="pill" id="p1" style="top:120px; background:#ff4b3e; color:#fff">AVANT</div>
        <div class="line gtxt" id="t1" style="top:225px">Une simple photo…</div>
        <div class="feed" id="feed"><img src="assets/avant.jpg" alt="" /></div>
        <div class="meta" id="meta">♡ 0 &nbsp;&nbsp; 💬 0 &nbsp;&nbsp; ↗ 0</div>
        <div class="line gtxt" id="t2" style="top:1640px">…on passe sans s'arrêter</div>
        <img class="ab" id="zz" src="assets/icons/zzz_3d.png" style="left:850px; top:300px; width:170px; height:170px" />
      </div></div>

      <!-- APRÈS (4,2 - 12,4) -->
      <div class="scene" id="s2"><div class="cam" id="k2">
        <video id="vbg" class="blur clip" src="assets/apres.mp4" muted playsinline data-start="4.2" data-duration="8.2" data-track-index="2"></video>
        <div class="pill" id="p2" style="top:120px; background:#ffd60a; color:#0b1e4a">APRÈS</div>
        <div id="card">
          <video id="vcard" class="clip" src="assets/apres.mp4" muted playsinline data-start="4.2" data-duration="8.2" data-track-index="3"></video>
          <div id="grad"></div>
          <div class="kw" id="w1" style="font-size:150px">Précis.</div><div class="kw" id="w2" style="font-size:150px">Élégant.</div><div class="kw" id="w3" style="font-size:124px">Connecté.</div>
          <div id="shine"></div>
        </div>
        <div id="badge">NOUVEAU</div>
        <img class="stk" id="i1" src="assets/icons/watch_3d.png" style="left:10px; top:250px" />
        <img class="stk" id="i2" src="assets/icons/mobile_phone_3d.png" style="left:850px; top:1430px; width:180px; height:180px" />
        <img class="stk" id="i3" src="assets/icons/high_voltage_3d.png" style="left:40px; top:1440px; width:160px; height:160px" />
        <div class="ab" id="cta"><svg width="58" height="58" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.2 1.5z"/></svg>Commandez sur WhatsApp</div>
        <div class="ab" id="tag">Exemple de pub · Allegra · Gadgets</div>
      </div></div>

      <!-- FIN (12,4 - 16) -->
      <div class="scene" id="s3"><div class="cam" id="k3">
        <div class="ab" id="lg" style="left:485px; top:330px"><svg width="110" height="124" viewBox="0 0 120 120"><g transform="translate(6 7)" fill="none" stroke="#ffd60a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"><path d="M42 32v-8a16 16 0 0 1 32 0v8"/><path d="M18 32h80l-7 66a8 8 0 0 1-8 7H33a8 8 0 0 1-8-7z"/></g><g fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"><path d="M42 32v-8a16 16 0 0 1 32 0v8"/><path d="M18 32h80l-7 66a8 8 0 0 1-8 7H33a8 8 0 0 1-8-7z"/></g><path d="M50 52 L76 68 L50 84 Z" fill="#ffd60a" stroke="#ffd60a" stroke-width="6" stroke-linejoin="round"/></svg></div>
        <div class="line big" id="e1" style="top:560px">Vos produits</div>
        <div class="line big y" id="e2" style="top:690px">méritent ça.</div>
        <div class="line" id="e3" style="top:880px; font-family:'Work Sans'; font-weight:700; font-size:46px">Vidéo d'essai gratuite 🎁</div>
        <div class="ab" id="btn"><svg width="58" height="58" viewBox="0 0 24 24" fill="#0b1e4a"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.2 1.5z"/></svg>Écrivez ESSAI</div>
        <div class="line" id="num">+243 831 710 181</div>
        <div class="line" id="wm">Allegra Digital Ground</div>
      </div></div>

      <div class="ab" id="iris"></div>
      <div class="ab" id="fade"></div>
      <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="16" data-track-index="1" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const HIDE = [];
      const FT = (s, f, t, at) => tl.fromTo(s, f, { ...t, immediateRender: false }, at);
      const IN = (s, f, t, at) => { HIDE.push(s); return FT(s, { ...f, autoAlpha: 0 }, { ...t, autoAlpha: 1 }, at); };
      const OUT = (s, at) => FT(s, { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.01 }, at);
      const pop = (s, at) => IN(s, { scale: 0.2, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, at);
      const slam = (s, at) => IN(s, { scale: 2.3, filter: "blur(14px)" }, { scale: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, at);
      const float = (s, at, d, y) => FT(s, { y: 0 }, { y: y, duration: d / 2, yoyo: true, repeat: 1, ease: "sine.inOut" }, at);
      [["#s1", 0, 4.2], ["#s2", 4.2, 8.2], ["#s3", 12.4, 3.6]].forEach(([s, a, d], i) => {
        HIDE.push(s); tl.set(s, { autoAlpha: 1 }, a); if (i < 2) tl.set(s, { autoAlpha: 0 }, a + d);
      });
      // AVANT : une photo fixe que l'on fait défiler
      IN("#p1", { y: -80 }, { y: 0, duration: 0.35, ease: "back.out(2)" }, 0.1);
      IN("#t1", { y: 30 }, { y: 0, duration: 0.4, ease: "power2.out" }, 0.3);
      IN("#feed", { y: 400 }, { y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
      IN("#meta", { y: 20 }, { y: 0, duration: 0.3 }, 0.8);
      IN("#t2", { y: 30 }, { y: 0, duration: 0.4, ease: "power2.out" }, 1.8);
      pop("#zz", 2.2); float("#zz", 2.5, 1.2, -20);
      FT(["#feed", "#meta"], { y: 0 }, { y: -1500, duration: 0.7, ease: "power2.in" }, 3.0);
      // iris
      HIDE.push("#iris");
      FT("#iris", { autoAlpha: 1, scale: 0 }, { scale: 24, duration: 0.3, ease: "power2.in" }, 3.9);
      FT("#iris", { scale: 24 }, { scale: 0, duration: 0.35, ease: "power2.out" }, 4.2);
      tl.set("#iris", { autoAlpha: 0 }, 4.6);
      // APRÈS : la vidéo et les animations
      FT("#k2", { scale: 1.15 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 4.2);
      IN("#p2", { y: -80, scale: 1.5 }, { y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, 4.3);
      IN("#card", { y: 300, scale: 0.85, rotation: -4 }, { y: 0, scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.4)" }, 4.25);
      FT("#card", { rotation: 0 }, { rotation: 1.2, duration: 3.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 4.9);
      slam("#w1", 5.0); OUT("#w1", 6.6); slam("#w2", 6.6); OUT("#w2", 8.2); slam("#w3", 8.2);
      FT("#k2", { x: 0 }, { x: 12, duration: 0.05, yoyo: true, repeat: 5 }, 5.05);
      FT("#k2", { x: 0 }, { x: 12, duration: 0.05, yoyo: true, repeat: 5 }, 6.65);
      FT("#k2", { x: 0 }, { x: 12, duration: 0.05, yoyo: true, repeat: 5 }, 8.25);
      pop("#i1", 5.4); float("#i1", 5.8, 3.0, -24);
      pop("#i2", 6.9); float("#i2", 7.3, 3.0, -20);
      pop("#i3", 8.5); float("#i3", 8.9, 2.4, -18);
      IN("#badge", { scale: 0, rotation: -180 }, { scale: 1, rotation: 12, duration: 0.6, ease: "back.out(1.8)" }, 7.4);
      FT("#badge", { rotation: 12 }, { rotation: 372, duration: 4, ease: "none" }, 8.0);
      FT("#shine", { backgroundPosition: "100% 0%" }, { backgroundPosition: "-50% 0%", duration: 0.9, ease: "power2.inOut" }, 5.6);
      FT("#shine", { backgroundPosition: "100% 0%" }, { backgroundPosition: "-50% 0%", duration: 0.9, ease: "power2.inOut" }, 9.4);
      IN("#cta", { y: 200, scale: 0.6 }, { y: 0, scale: 1, duration: 0.5, ease: "back.out(2)" }, 9.8);
      FT("#cta", { scale: 1 }, { scale: 1.06, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 10.5);
      IN("#tag", { y: 20 }, { y: 0, duration: 0.4 }, 10.2);
      // FIN
      FT("#k3", { scale: 1.15 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 12.4);
      pop("#lg", 12.5);
      slam("#e1", 12.8); slam("#e2", 13.15);
      IN("#e3", { y: 30 }, { y: 0, duration: 0.4 }, 13.6);
      IN("#btn", { scale: 0.3 }, { scale: 1, duration: 0.45, ease: "back.out(2.5)" }, 13.9);
      FT("#btn", { scale: 1 }, { scale: 1.06, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 14.5);
      IN("#num", { y: 30 }, { y: 0, duration: 0.35 }, 14.2);
      IN("#wm", { y: 30 }, { y: 0, duration: 0.35 }, 14.4);
      FT("#fade", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 15.7);
      gsap.set(HIDE, { autoAlpha: 0 });
      gsap.set("#s1", { autoAlpha: 1 });
      gsap.set("#fade", { opacity: 0 });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
