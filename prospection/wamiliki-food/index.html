<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Oswald'; font-weight: 700; src: url('assets/fonts/Oswald-Bold.ttf') format('truetype'); }
      @font-face { font-family: 'Inter'; font-weight: 600; src: url('assets/fonts/inter-latin-600-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 900; src: url('assets/fonts/inter-latin-900-normal.woff2') format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #140b09; }
      /* l'esprit de leur logo : la flamme, le rouge du cercle, le noir du W */
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff;
        background: radial-gradient(ellipse at 50% 70%, #7a1f0c 0%, #3a0f08 38%, #140b09 75%); }
      #glow { left: 90px; top: 1100px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(255,150,30,0.45) 0%, rgba(255,90,0,0) 65%); }
      .emb { position: absolute; border-radius: 50%; background: radial-gradient(circle, #ffd27a 0%, #ff7a12 55%, rgba(255,80,0,0) 75%); opacity: 0; }
      .ab { position: absolute; }
      .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .line { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
      .w { display: inline-block; margin: 0 0.1em; }
      .sm { font-weight: 600; font-size: 56px; color: #fff; }
      .ttl { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 190px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase;
        background: linear-gradient(180deg, #ffe27a 0%, #ffae1f 45%, #ff5a0a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 6px 0 #6b1406) drop-shadow(0 24px 30px rgba(0,0,0,0.5)); }
      .tag { display: inline-block; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 50px; color: #fff; background: #c41d12; padding: 10px 36px; border-radius: 12px; box-shadow: 0 10px 0 #6b0d07; }
      .obj { position: absolute; filter: drop-shadow(0 34px 40px rgba(0,0,0,0.6)); }
      .photo { position: absolute; overflow: hidden; border-radius: 40px; border: 10px solid #fff; box-shadow: 0 0 0 6px #c41d12, 0 40px 60px rgba(0,0,0,0.55); }
      .photo div { width: 100%; height: 100%; background-size: cover; background-position: center; }
      .pill { position: absolute; border-radius: 999px; text-align: center; white-space: nowrap; font-weight: 900; }
      #fade { left: 0; top: 0; width: 1080px; height: 1920px; background: #140b09; z-index: 40; }
      #flash { left: 0; top: 0; width: 1080px; height: 1920px; background: #ff9a1f; z-index: 30; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div class="ab" id="glow"></div>
      <div class="emb" id="em0" style="left:468px; top:1535px; width:13px; height:13px"></div><div class="emb" id="em1" style="left:286px; top:1546px; width:10px; height:10px"></div><div class="emb" id="em2" style="left:604px; top:1717px; width:14px; height:14px"></div><div class="emb" id="em3" style="left:100px; top:1789px; width:18px; height:18px"></div><div class="emb" id="em4" style="left:166px; top:1614px; width:8px; height:8px"></div><div class="emb" id="em5" style="left:685px; top:1821px; width:9px; height:9px"></div><div class="emb" id="em6" style="left:636px; top:1531px; width:16px; height:16px"></div><div class="emb" id="em7" style="left:630px; top:1799px; width:9px; height:9px"></div><div class="emb" id="em8" style="left:446px; top:1525px; width:13px; height:13px"></div><div class="emb" id="em9" style="left:266px; top:1523px; width:17px; height:17px"></div><div class="emb" id="em10" style="left:610px; top:1568px; width:8px; height:8px"></div><div class="emb" id="em11" style="left:336px; top:1714px; width:16px; height:16px"></div><div class="emb" id="em12" style="left:187px; top:1776px; width:11px; height:11px"></div><div class="emb" id="em13" style="left:160px; top:1792px; width:8px; height:8px"></div><div class="emb" id="em14" style="left:355px; top:1786px; width:9px; height:9px"></div><div class="emb" id="em15" style="left:875px; top:1849px; width:14px; height:14px"></div>

      <!-- 1. Une petite faim ? (0 - 2,8) -->
      <div class="scene" id="s1"><div class="cam" id="k1">
        <img class="obj" id="lg1" src="assets/img/logo.png" style="left:300px; top:330px; width:480px; height:480px" />
        <div class="line" style="top:960px"><span class="w sm" id="a1">Kolwezi,</span></div>
        <div class="line" style="top:1050px" data-layout-allow-overlap><span class="w ttl" id="a2" style="font-size:150px">une petite</span></div>
        <div class="line" style="top:1220px" data-layout-allow-overlap><span class="w ttl" id="a3" style="font-size:210px">faim ?</span></div>
      </div></div>

      <!-- 2. Les tacos (2,8 - 7) -->
      <div class="scene" id="s2"><div class="cam" id="k2">
        <div class="line" style="top:230px"><span class="w sm" id="b1">Nos</span></div>
        <div class="line" style="top:320px" data-layout-allow-overlap><span class="w ttl" id="b2">tacos</span></div>
        <div class="line" style="top:560px"><span class="w tag" id="b3">grillés, avec leurs sauces</span></div>
        <img class="obj" id="b4" src="assets/img/tacos_tranches.png" style="left:50px; top:952px; width:980px; height:597px" />
        <img class="obj" id="b5" src="assets/img/sparkles_3d.png" style="left:840px; top:832px; width:180px; height:180px" />
      </div></div>

      <!-- 3. L'intérieur (7 - 10,4) -->
      <div class="scene" id="s3"><div class="cam" id="k3">
        <div class="ab photo" id="c1" style="left:140px; top:330px; width:800px; height:1230px"><div id="c2" style="background-image:url('assets/img/tacos_dedans.jpg')"></div></div>
        <div class="line" style="top:1630px"><span class="w ttl" id="c3" style="font-size:130px">bien garnis</span></div>
      </div></div>

      <!-- 4. Le poulet mayo (10,4 - 14,6) -->
      <div class="scene" id="s4"><div class="cam" id="k4">
        <div class="line" style="top:230px"><span class="w sm" id="d1">Le</span></div>
        <div class="line" style="top:320px" data-layout-allow-overlap><span class="w ttl" id="d2" style="font-size:170px">poulet mayo</span></div>
        <div class="line" style="top:540px"><span class="w tag" id="d3">authentique</span></div>
        <img class="obj" id="d4" src="assets/img/poulet_mayo.png" style="left:60px; top:995px; width:960px; height:510px" />
        <img class="obj" id="d5" src="assets/img/sparkles_3d.png" style="left:60px; top:885px; width:170px; height:170px" />
      </div></div>

      <!-- 5. Carte de fin (14,6 - 20) -->
      <div class="scene" id="s5"><div class="cam" id="k5">
        <img class="obj" id="e1" src="assets/img/logo.png" style="left:330px; top:170px; width:420px; height:420px" />
        <div class="line" style="top:640px" data-layout-allow-overlap><span class="w ttl" id="e2" style="font-size:150px">Wamiliki Food</span></div>
        <div class="line" style="top:820px"><span class="w sm" id="e3">Kolwezi</span></div>
        <img class="obj" id="e4" src="assets/img/tacos_coca.png" style="left:20px; top:1064px; width:620px; height:212px" />
        <img class="obj" id="e5" src="assets/img/poulet_mayo.png" style="left:500px; top:1032px; width:560px; height:297px" />
        <div class="ab pill" id="e6" style="left:140px; top:1450px; width:800px; height:120px; line-height:120px; font-size:58px; background:#c41d12; color:#fff; box-shadow: 0 10px 0 #6b0d07">Commandes &amp; livraison</div>
        <div class="ab pill" id="e7" style="left:160px; top:1620px; width:760px; height:110px; line-height:110px; font-size:44px; background:#25d366; color:#fff; box-shadow: 0 10px 0 #128c4a">Écrivez-nous sur WhatsApp</div>
      </div></div>

      <div class="ab" id="flash"></div>
      <div class="ab" id="fade"></div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="20" data-track-index="1" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const HIDE = [];
      const FT = (sel, from, to, at) => tl.fromTo(sel, from, { ...to, immediateRender: false }, at);
      const IN = (sel, from, to, at) => { HIDE.push(...[].concat(sel)); return FT(sel, { ...from, autoAlpha: 0 }, { ...to, autoAlpha: 1 }, at); };
      const word = (sel, at, d = 0.28) => IN(sel, { y: -50, scale: 1.3, filter: "blur(12px)" }, { y: 0, scale: 1, filter: "blur(0px)", duration: d, ease: "power3.out" }, at);
      const pop = (sel, at) => IN(sel, { scale: 0.3, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, at);
      const float = (sel, at, d, y = -16) => FT(sel, { y: 0 }, { y: y, duration: d / 2, yoyo: true, repeat: 1, ease: "sine.inOut" }, at);
      const slam = (sel, at) => IN(sel, { scale: 2.2, filter: "blur(16px)" }, { scale: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, at);
      const shake = (sel, at) => FT(sel, { x: 0 }, { x: 14, duration: 0.05, yoyo: true, repeat: 5 }, at);
      const flash = at => { HIDE.push("#flash"); FT("#flash", { autoAlpha: 0.55 }, { autoAlpha: 0, duration: 0.25, ease: "power2.out" }, at); };

      FT("#glow", { scale: 1, opacity: 0.8 }, { scale: 1.15, opacity: 1, duration: 1.2, yoyo: true, repeat: 15, ease: "sine.inOut" }, 0);
      FT("#em0", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 6.73 }], y: -1092, x: -25, duration: 7.33, ease: "none" }, 1.81);
      FT("#em1", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 7.25 }], y: -1477, x: -105, duration: 7.85, ease: "none" }, 0.97);
      FT("#em2", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 6.39 }], y: -1444, x: -11, duration: 6.99, ease: "none" }, 6.19);
      FT("#em3", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 6.26 }], y: -1364, x: -28, duration: 6.86, ease: "none" }, 7.77);
      FT("#em4", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 7.58 }], y: -1149, x: -100, duration: 8.18, ease: "none" }, 3.00);
      FT("#em5", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 6.50 }], y: -1251, x: 66, duration: 7.10, ease: "none" }, 5.74);
      FT("#em6", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 6.84 }], y: -974, x: -90, duration: 7.44, ease: "none" }, 4.49);
      FT("#em7", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 5.06 }], y: -1250, x: -82, duration: 5.66, ease: "none" }, 5.12);
      FT("#em8", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 6.09 }], y: -979, x: 75, duration: 6.69, ease: "none" }, 9.33);
      FT("#em9", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 7.56 }], y: -1221, x: -33, duration: 8.16, ease: "none" }, 5.58);
      FT("#em10", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 6.78 }], y: -1493, x: 84, duration: 7.38, ease: "none" }, 6.95);
      FT("#em11", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 7.76 }], y: -1176, x: 1, duration: 8.36, ease: "none" }, 4.56);
      FT("#em12", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 4.66 }], y: -1217, x: 45, duration: 5.26, ease: "none" }, 6.97);
      FT("#em13", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 7.12 }], y: -1356, x: -48, duration: 7.72, ease: "none" }, 5.78);
      FT("#em14", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 7.95 }], y: -1255, x: -115, duration: 8.55, ease: "none" }, 7.17);
      FT("#em15", { y: 0, x: 0, opacity: 0 }, { keyframes: [{ opacity: 0.9, duration: 0.6 }, { opacity: 0, duration: 5.82 }], y: -1019, x: 6, duration: 6.42, ease: "none" }, 9.41);
      const SC = [["#s1", "#k1", 0, 2.8], ["#s2", "#k2", 2.8, 4.2], ["#s3", "#k3", 7.0, 3.4], ["#s4", "#k4", 10.4, 4.2], ["#s5", "#k5", 14.6, 5.4]];
      SC.forEach(([s, c, a, d], i) => {
        HIDE.push(s);
        tl.set(s, { autoAlpha: 1 }, a);
        if (i !== SC.length - 1) tl.set(s, { autoAlpha: 0 }, a + d);
        FT(c, { scale: 1.14 }, { scale: 1.0, duration: 0.45, ease: "expo.out" }, a);
        FT(c, { rotation: 0, x: 0 }, { rotation: i % 2 ? 0.6 : -0.6, x: i % 2 ? -16 : 16, duration: d, ease: "sine.inOut" }, a);
        if (i) flash(a);
      });

      // 1
      IN("#lg1", { scale: 0.2, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" }, 0.1);
      float("#lg1", 0.7, 2.0, -14);
      word("#a1", 0.6); slam("#a2", 0.95);
      IN("#a3", { y: -300, scale: 1.4 }, { y: 0, scale: 1, duration: 0.5, ease: "bounce.out" }, 1.35);
      shake("#k1", 1.8);
      // 2
      word("#b1", 2.9); slam("#b2", 3.1);
      IN("#b4", { x: 1200, rotation: 12 }, { x: 0, rotation: -2, duration: 0.55, ease: "expo.out" }, 3.4);
      IN("#b3", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 3.9);
      shake("#k2", 3.95);
      FT("#b4", { scale: 1 }, { scale: 1.08, duration: 3.0, ease: "none" }, 4.0);
      pop("#b5", 4.3); float("#b5", 4.7, 2.2, -16);
      // 3
      IN("#c1", { y: 1300, rotation: 6 }, { y: 0, rotation: -1.5, duration: 0.55, ease: "expo.out" }, 7.05);
      FT("#c2", { scale: 1.25 }, { scale: 1.0, duration: 3.3, ease: "power1.out" }, 7.05);
      slam("#c3", 7.7); shake("#k3", 8.05);
      // 4
      word("#d1", 10.5); slam("#d2", 10.7);
      IN("#d4", { y: -1500, rotation: -10 }, { y: 0, rotation: 0, duration: 0.55, ease: "bounce.out" }, 11.0);
      IN("#d3", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 11.4);
      shake("#k4", 11.5);
      FT("#d4", { scale: 1 }, { scale: 1.07, duration: 3.0, ease: "none" }, 11.6);
      pop("#d5", 11.8); float("#d5", 12.2, 2.2, -16);
      // 5
      IN("#e1", { scale: 0.2, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" }, 14.7);
      slam("#e2", 15.1); word("#e3", 15.45);
      IN("#e4", { x: -900 }, { x: 0, duration: 0.5, ease: "expo.out" }, 15.7);
      IN("#e5", { x: 900 }, { x: 0, duration: 0.5, ease: "expo.out" }, 15.85);
      IN("#e6", { scale: 0.3 }, { scale: 1, duration: 0.45, ease: "back.out(2.5)" }, 16.3);
      IN("#e7", { y: 120 }, { y: 0, duration: 0.45, ease: "back.out(1.6)" }, 16.7);
      FT("#e7", { scale: 1 }, { scale: 1.05, duration: 0.25, yoyo: true, repeat: 5, ease: "sine.inOut" }, 17.3);
      float("#e1", 15.3, 3.6, -14);
      FT("#fade", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 19.65);

      gsap.set(HIDE, { autoAlpha: 0 });
      gsap.set("#s1", { autoAlpha: 1 });
      gsap.set("#fade", { opacity: 0 });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
