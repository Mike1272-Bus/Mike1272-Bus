<!doctype html>
<html lang="fr"><head><meta charset="UTF-8" />
<style>
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('fonts/inter-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 900; src: url('fonts/inter-latin-900-normal.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: transparent; }
  .board { position: relative; overflow: hidden; display: none; }
  body[data-p="profil"] #profil, body[data-p="horiz"] #horiz, body[data-p="horiz-creme"] #horiz, body[data-p="cover"] #cover { display: block; }
  body[data-p="horiz-creme"] #horiz { background: radial-gradient(ellipse at 50% 45%, #fffaf0 0%, #f6eddc 70%, #ecdfc6 100%); }
  .creme { background: radial-gradient(ellipse at 50% 42%, #ffffff 0%, #f8f3ea 60%, #ecdfc6 100%); }
  .sw { position: absolute; border-radius: 999px; background: #efe6d6; transform: rotate(-32deg); }
  #profil { width: 1080px; height: 1080px; }
  #profil .disc { position: absolute; left: 140px; top: 140px; width: 800px; height: 800px; border-radius: 50%; background: #fff; box-shadow: 0 40px 80px rgba(60,30,0,0.18); }
  #profil img { position: absolute; left: 290px; top: 250px; width: 500px; }
  #horiz { width: 1600px; height: 600px; }
  #horiz .disc { position: absolute; left: 90px; top: 100px; width: 400px; height: 400px; border-radius: 50%; background: #fff; box-shadow: 0 30px 60px rgba(60,30,0,0.18); }
  #horiz .disc img { position: absolute; left: 85px; top: 70px; width: 230px; }
  .name { position: absolute; font-weight: 900; letter-spacing: -0.045em; line-height: 0.92; color: #1c1206; }
  .name i { font-style: normal; color: #f29a0e; text-shadow: 0 3px 0 #d47c00, 0 6px 0 #b86600, 0 9px 0 #9c5200, 0 20px 30px rgba(60,30,0,0.25); }
  .tag { position: absolute; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #c66f00; }
  #cover { width: 1640px; height: 624px; }
  #cover .disc { position: absolute; left: 150px; top: 112px; width: 400px; height: 400px; border-radius: 50%; background: #fff; box-shadow: 0 30px 60px rgba(60,30,0,0.18); }
  #cover .disc img { position: absolute; left: 85px; top: 70px; width: 230px; }
  .pill { position: absolute; height: 96px; border-radius: 48px; padding: 0 44px; font-weight: 900; font-size: 44px; line-height: 96px; background: linear-gradient(180deg, #ffe14d, #ffcc00); color: #2a1a00; box-shadow: 0 10px 0 #c99a00, 0 22px 34px rgba(60,30,0,0.22); white-space: nowrap; }
</style></head>
<body>
  <!-- Photo de profil 1080×1080 (Facebook, TikTok, WhatsApp) -->
  <div class="board creme" id="profil">
    <div class="sw" style="left:-200px; top:420px; width:1600px; height:200px"></div>
    <div class="disc"></div><img src="logo-icone-v2.svg" alt="" />
  </div>
  <!-- Logo horizontal 1600×600 (fond transparent ou crème) -->
  <div class="board" id="horiz">
    <div class="disc"><img src="logo-icone-v2.svg" alt="" /></div>
    <div class="name" style="left:560px; top:130px; font-size:170px">Allegra<br /><i>Digital</i></div>
    <div class="tag" style="left:566px; top:480px; font-size:36px">Vidéos qui font vendre</div>
  </div>
  <!-- Couverture Facebook 1640×624 -->
  <div class="board creme" id="cover">
    <div class="sw" style="left:300px; top:250px; width:1700px; height:180px"></div>
    <div class="disc"><img src="logo-icone-v2.svg" alt="" /></div>
    <div class="name" style="left:620px; top:120px; font-size:150px">Allegra <i>Digital</i></div>
    <div class="tag" style="left:626px; top:300px; font-size:34px">Vidéos qui font vendre</div>
    <div class="pill" style="left:620px; top:390px">Vidéo d'essai gratuite : écrivez ESSAI</div>
  </div>
</body></html>
