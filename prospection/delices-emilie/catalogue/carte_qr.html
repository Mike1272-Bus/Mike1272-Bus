<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Baloo'; font-weight: 800; src: url('fonts/Baloo2-ExtraBold.ttf'); }
@font-face { font-family: 'Work Sans'; font-weight: 700; src: url('fonts/worksans-700.ttf'); }
@font-face { font-family: 'Script'; src: url('fonts/NothingYouCouldDo-Regular.ttf'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
#card { width: 1240px; height: 1748px; position: relative; overflow: hidden; text-align: center; color: #4a1f45; font-family: 'Baloo';
  background: radial-gradient(circle at 50% 0%, #f6e3f1 0%, #fffafd 55%); border: 26px solid #cf86c4; }
.logo { width: 300px; height: 300px; border-radius: 50%; margin-top: 70px; box-shadow: 0 10px 30px rgba(74,31,69,.25); }
h1 { font-size: 92px; line-height: 1; margin-top: 40px; }
.hand { font-family: 'Script'; font-size: 64px; color: #c9973a; -webkit-text-stroke: 1.5px #c9973a; margin-top: 12px; }
.qr { width: 620px; height: 620px; margin: 44px auto 0; padding: 26px; background: #fff; border-radius: 40px; box-shadow: 0 14px 40px rgba(74,31,69,.18); }
.qr img { width: 100%; height: 100%; }
.cta { display: inline-block; margin-top: 44px; background: #25d366; color: #fff; font-size: 64px; padding: 18px 60px 6px; border-radius: 80px; }
.small { font-family: 'Work Sans'; font-weight: 700; font-size: 38px; margin-top: 34px; line-height: 1.4; }
</style></head><body><div id="card">
<img class="logo" src="img/logo.png">
<h1>Les Délices d'Émilie</h1>
<div class="hand">Gâteaux personnalisés</div>
<div class="qr"><img src="img/qr_whatsapp.png"></div>
<div class="cta">Scannez pour commander</div>
<div class="small">ou WhatsApp : +243 825 553 856<br>Commandez au plus tard 48 h avant</div>
</div></body></html>
