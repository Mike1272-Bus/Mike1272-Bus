<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:#f6efe9;width:390px;color:#2b2220}
header{background:#7a3e57;color:#fff;padding:20px 18px}header h1{font-size:19px}header p{font-size:13px;opacity:.85;margin-top:4px}
main{padding:14px 16px 20px}label{display:block;font-size:13px;margin:12px 0 5px;font-weight:600}
.f{background:#fff;border:1px solid #e0d4cf;border-radius:10px;padding:12px;font-size:15px;display:flex;justify-content:space-between}
.f i{color:#7a6a66;font-style:normal}.btn{margin-top:18px;background:#25a35a;color:#fff;text-align:center;padding:14px;border-radius:12px;font-weight:700;font-size:16px}
</style></head><body><header><h1>Nouvelle vente</h1><p>À remplir par le vendeur, à chaque vente.</p></header><main>
<label>Nom de la cliente</label><div class="f">Maman Sarah</div>
<label>Téléphone de la cliente</label><div class="f">0812345678</div>
<label>Modèle</label><div class="f">Sac au crochet <i>▾</i></div>
<label>Couleur</label><div class="f">Rose <i>▾</i></div>
<label>Quantité</label><div class="f">1</div>
<label>Note</label><div class="f"><i>Livraison vendredi</i></div>
<div class="btn">Enregistrer la vente ✅</div></main></body></html>
