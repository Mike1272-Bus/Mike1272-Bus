<template>
  <style>
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --f-display: "Arial Black", "Helvetica Neue", Arial, sans-serif; --black:#000; --offwhite:#fffdf5; }
    #root * { box-sizing: border-box; }
    .sc01-bg { position: absolute; inset: 0; background-color: #c0f7fe; }
    .sc01-bg::before { content: ""; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(0,0,0,0.08) 1.2px, transparent 1.6px); background-size: 24px 24px; }
    .sc01-counter { position: absolute; left: 60px; top: 90px; width: 84px; height: 84px; border-radius: 50%;
      background: #fff; border: 4px solid var(--black); box-shadow: 6px 6px 0 var(--black);
      display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 800; font-size: 26px; }
    .sc01-img { position: absolute; left: 50%; top: 620px; width: 900px; height: 900px;
      transform: translateX(-50%); transform-origin: 50% 50%; opacity: 0; will-change: transform, opacity; }
    .sc01-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  </style>
  <div id="root" data-composition-id="01" data-duration="7.8" data-width="1080" data-height="1920">
    <div class="sc01-bg clip" data-start="0" data-duration="7.8" data-track-index="0"></div>
    <div class="sc01-counter clip" data-start="0" data-duration="7.8" data-track-index="1">01</div>
      <div class="sc01-img clip" data-start="0.3" data-duration="1.875" data-track-index="2" id="sc01-img1">
        <img src="assets/s1-1.jpg" alt="" />
      </div>
      <div class="sc01-img clip" data-start="2.175" data-duration="1.875" data-track-index="2" id="sc01-img2">
        <img src="assets/s1-2.jpg" alt="" />
      </div>
      <div class="sc01-img clip" data-start="4.05" data-duration="1.875" data-track-index="2" id="sc01-img3">
        <img src="assets/s1-3.jpg" alt="" />
      </div>
      <div class="sc01-img clip" data-start="5.925" data-duration="1.875" data-track-index="2" id="sc01-img4">
        <img src="assets/s1-4.png" alt="" />
      </div>
  </div>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      function beat(id, start) {
        var el = document.getElementById(id);
        tl.fromTo(el, { scale: 0.55, opacity: 0, rotation: -4 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.22, ease: "back.out(2.2)" }, start);
      }
      beat("sc01-img1", 0.3);
      beat("sc01-img2", 2.175);
      beat("sc01-img3", 4.05);
      beat("sc01-img4", 5.925);

      var phase = { p: 0 };
      var IDLE_START = 6.325;
      var IDLE_DUR = 7.8 - IDLE_START;
      if (IDLE_DUR > 0.3) {
        tl.to(phase, { p: Math.PI * 2 * (IDLE_DUR / 2.5), duration: IDLE_DUR, ease: "none",
          onUpdate: function () {
            var s = Math.sin(phase.p);
            document.getElementById("sc01-img4").style.transform = "translateX(-50%) translateY(" + (s * 6).toFixed(2) + "px)";
          } }, IDLE_START);
      }
      window.__timelines["01"] = tl;
    })();
  </script>
