<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap">
<style>
  html,body{margin:0;padding:0;background:#E9EAEC;width:1100px;height:1000px;}
  .wrap{width:1100px;height:1000px;display:flex;align-items:center;justify-content:center;background:#E9EAEC;}
  .card{
    width:840px;height:760px;background:#FFFFFF;border-radius:60px;
    box-shadow:0 24px 60px rgba(20,20,40,0.16);
    display:flex;align-items:center;justify-content:center;padding:60px;box-sizing:border-box;
  }
  .row{display:flex;align-items:center;gap:36px;}
  svg{width:280px;height:280px;flex-shrink:0;}
  .text{display:flex;flex-direction:column;}
  .l1{font-family:"Poppins",sans-serif;font-weight:900;font-size:76px;color:#1F93D6;line-height:1.02;letter-spacing:0em;}
  .l2{font-family:"Poppins",sans-serif;font-weight:900;font-size:76px;color:#2A2560;line-height:1.02;letter-spacing:0em;margin-top:2px;}
  .tag{font-family:"Poppins",sans-serif;font-weight:500;font-size:26px;color:#8A8D95;letter-spacing:0.34em;margin-top:22px;}
</style></head>
<body>
<div class="wrap">
  <div class="card">
    <div class="row">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <polygon points="100,10 95,80 10,90" fill="#6FCBEC"/>
        <polygon points="100,10 180,70 95,80" fill="#1F93D6"/>
        <polygon points="10,90 95,80 60,190" fill="#2A2560"/>
        <polygon points="95,80 180,70 60,190" fill="#3C2E72"/>
      </svg>
      <div class="text">
        <div class="l1">Digital</div>
        <div class="l2">Mikaelson</div>
        <div class="tag">PRODUITS DIGITAUX</div>
      </div>
    </div>
  </div>
</div>
</body></html>
