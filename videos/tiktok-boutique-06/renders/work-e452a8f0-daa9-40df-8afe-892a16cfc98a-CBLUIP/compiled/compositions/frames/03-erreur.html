<template>
  <style>
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --f-display: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      --black: #000000;
      --white: #ffffff;
      --offwhite: #fffdf5;
      --blue: #c0f7fe;
      --pink: #fe90e8;
      --yellow: #f7cb46;
      --cream: #ffdc8b;
      --green: #99e885;
    }
    #root * { box-sizing: border-box; }

    /* ---- full-bleed ground (own clip layer, never on #root) ---- */
    .err03-bg {
      position: absolute;
      inset: 0;
      background-color: var(--cream);
      will-change: transform, filter, opacity;
    }
    .err03-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0, 0, 0, 0.1) 1.2px, transparent 1.6px);
      background-size: 24px 24px;
      opacity: 0.5;
    }

    /* ---- decorations nested in the ground: no separate clip/track needed ---- */
    .err03-rect {
      position: absolute;
      left: -36px;
      top: -18px;
      width: 150px;
      height: 96px;
      background: var(--blue);
      border: 3px solid var(--black);
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .err03-star-wrap {
      position: absolute;

      transform-origin: 50% 50%;
      will-change: transform, opacity;

    .err03-star-inner {
      position: absolute;
      clip-path: polygon(
        50% 0%, 61.8% 35.3%, 97.6% 35.3%, 68.8% 57.4%, 79.4% 91.8%,
        50% 70.5%, 20.6% 91.8%, 31.2% 57.4%, 2.4% 35.3%, 38.2% 35.3%
      );
    }
    .err03-star-outer { inset: 0; background: var(--black); }
    .err03-star-inner { inset: 9%; background: var(--green); }

    .err03-counter {
      position: absolute;
      left: 850px;
      top: 870px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--white);
      border: 3px solid var(--black);
      box-shadow: 4px 4px 0 var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--f-display);
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.05em;
      color: var(--black);
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    /* ---- label-pill: opens the region ---- */
    .err03-pill-wrap {
      position: absolute;
      inset: 0;

    .err03-pill {
      font-family: var(--f-display);

      color: var(--black);

      border-radius: 9999px;
      padding: 16px 36px;
      white-space: nowrap;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    /* ---- image cards (top / bottom, never overlapping — 140px gap) ---- */
    .err03-card {
      position: absolute;

      will-change: transform, opacity;

    .err03-card-inner {
      position: relative;

    .err03-card-inner img {
      width: 100%;

      object-fit: contain;

    .err03-tab {
      position: absolute;
      top: -14px;
      left: 34px;
      width: 32px;

      border: 3px solid var(--black);
      z-index: 1;
    }
    .err03-card--top {
      left: 90px;
      top: 120px;
      width: 900px;
      height: 720px;
    }
    .err03-card--bottom {
      left: 90px;
      top: 980px;
      width: 900px;
      height: 610px;
    }
  </style>

  <div id="root" data-composition-id="03-erreur" data-duration="9.7" data-width="1080" data-height="1920">
    <div class="err03-bg clip" data-start="0" data-duration="9.7" data-track-index="0">
      <div class="err03-rect" id="err03-rect"></div>
      <div class="err03-star-wrap" id="err03-star">
        <div class="err03-star-outer"></div>
        <div class="err03-star-inner"></div>
      </div>
      <div class="err03-counter" id="err03-counter">03</div>
    </div>

    <div class="err03-pill-wrap clip" data-start="0" data-duration="9.7" data-track-index="1">
      <div class="err03-pill" id="err03-pill">L'IMPATIENCE</div>
    </div>

    <div class="err03-card err03-card--top clip" data-start="0" data-duration="9.7" data-track-index="2" id="err03-top">
      <div class="err03-tab" style="background: var(--blue);"></div>
      <div class="err03-card-inner">
        <img src="assets/erreur-impatience.jpg" alt="" />
      </div>
    </div>

    <div class="err03-card err03-card--bottom clip" data-start="0" data-duration="9.7" data-track-index="3" id="err03-bottom">
      <div class="err03-tab" style="background: var(--yellow);"></div>
      <div class="err03-card-inner">
        <img src="assets/erreur-reflexion.jpg" alt="" />
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var bg = ".err03-bg";
      var rect = "#err03-rect";
      var star = "#err03-star";
      var counter = "#err03-counter";
      var pill = "#err03-pill";
      var topCard = document.getElementById("err03-top");
      var bottomCard = document.getElementById("err03-bottom");

      var TOP_ROT = -2;
      var BOTTOM_ROT = 2;

      // ---- Scene 1 (0.0-0.5s): cream canvas wash zoom-through-cuts in
      // (Z-scale + blur + opacity, per the cut catalog). ----
      tl.fromTo(
        bg,
        { scale: 1.08, opacity: 0.5, filter: "blur(10px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power2.out" },
        0
      );
      tl.fromTo(rect, { scale: 0, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: -8, duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo(star, { scale: 0, opacity: 0, rotation: 12 }, { scale: 1, opacity: 1, rotation: 5, duration: 0.4, ease: "power3.out" }, 0.1);
      tl.fromTo(pill, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.15);

      // ---- Scene 2 (0.3-1.0s): erreur-impatience.jpg spring-pops in
      // from above, settling in the TOP half (~44% height, tilted -2deg). ----
      tl.fromTo(
        topCard,
        { scale: 0, opacity: 0, y: -460, rotation: -9 },
        { scale: 1, opacity: 1, y: 0, rotation: TOP_ROT, duration: 0.55, ease: "power3.out" },
        0.3
      );

      // ---- Scene 3 (1.0-1.7s): erreur-reflexion.jpg spring-pops in
      // from below, settling in the BOTTOM half (~44% height, tilted +2deg) —
      // clear vertical gap preserved, neither card ever crosses the other's half. ----
      tl.fromTo(
        bottomCard,
        { scale: 0, opacity: 0, y: 460, rotation: 9 },
        { scale: 1, opacity: 1, y: 0, rotation: BOTTOM_ROT, duration: 0.55, ease: "power3.out" },
        1.0
      );

      // corner counter chip settles into the gap once both cards have landed
      tl.fromTo(counter, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, 1.55);

      // ---- Scene 4 (1.7-9.2s): both cards keep independent-phase
      // sine-wave-loop idle drift for the rest of the hold. Idle window
      // (7.5s) exceeds the 6s long-idle threshold -> halved amplitude,
      // slowed period (>=3s), settle-and-fade tail, and the two cards run
      // different periods with a quarter-cycle phase offset so they never
      // move in lockstep and never approach each other's half. ----
      var TOTAL = 9.2;
      var IDLE_START = 1.7;
      var IDLE_DUR = TOTAL - IDLE_START; // 7.5s
      var FADE_FRAC = 0.2;

      var topPeriod = 3.3;
      var topCycles = IDLE_DUR / topPeriod;
      var topPhase = { p: 0 };
      var TOP_Y_AMP = 1.2;
      var TOP_ROT_AMP = 0.3;

      tl.to(
        topPhase,
        {
          p: Math.PI * 2 * topCycles,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var t = topPhase.p / (Math.PI * 2 * topCycles);
            var env = t < 1 - FADE_FRAC ? 1 : Math.max(0, (1 - t) / FADE_FRAC);
            var s = Math.sin(topPhase.p);
            var y = s * TOP_Y_AMP * env;
            var rot = TOP_ROT + Math.sin(topPhase.p + Math.PI / 2) * TOP_ROT_AMP * env;
            topCard.style.transform = "translateY(" + y + "px) rotate(" + rot + "deg)";
          },
        },
        IDLE_START
      );

      var bottomPeriod = 2.9; // independent from the top card's period
      var bottomCycles = IDLE_DUR / bottomPeriod;
      var bottomPhase = { p: 0 };
      var BOTTOM_Y_AMP = 1.0;
      var BOTTOM_ROT_AMP = 0.3;

      tl.to(
        bottomPhase,
        {
          p: Math.PI * 2 * bottomCycles,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var t = bottomPhase.p / (Math.PI * 2 * bottomCycles);
            var env = t < 1 - FADE_FRAC ? 1 : Math.max(0, (1 - t) / FADE_FRAC);
            var s = Math.sin(bottomPhase.p + Math.PI / 2); // offset phase vs top card
            var y = s * BOTTOM_Y_AMP * env;
            var rot = BOTTOM_ROT + Math.sin(bottomPhase.p) * BOTTOM_ROT_AMP * env;
            bottomCard.style.transform = "translateY(" + y + "px) rotate(" + rot + "deg)";
          },
        },
        IDLE_START
      );

      window.__timelines["03-erreur"] = tl;
    })();
  </script>
