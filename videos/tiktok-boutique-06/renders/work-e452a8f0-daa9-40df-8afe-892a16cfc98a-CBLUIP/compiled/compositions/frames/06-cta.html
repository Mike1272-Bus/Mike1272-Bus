<template>
  <style>

      position: relative;

      background: transparent;
      font-family: "Arial Black", Arial, Helvetica, sans-serif;
    }

    .c06-ground {
      position: absolute;

    /* -- decorations -- */
    .c06-star-wrap {
      position: absolute;

    /* -- particle field (behind hero) -- */

  </style>

  <div id="root" data-composition-id="06-cta" data-width="1080" data-height="1920" data-duration="4.8">
    <div class="clip c06-ground" id="c06-ground" data-start="0" data-duration="4.8" data-track-index="0"></div>

    <div class="clip c06-star-wrap" id="c06-star" data-start="0" data-duration="4.8" data-track-index="1">
      <div class="c06-star-outer"></div>
      <div class="c06-star-inner"></div>
    </div>

    <div class="clip c06-tilt" id="c06-tilt" data-start="0" data-duration="4.8" data-track-index="2">
      <div class="c06-tilt-label">1 CLIC</div>
    </div>

    <div class="clip c06-particle-field" id="c06-particle-field" data-start="0" data-duration="4.8" data-track-index="3"></div>

    <div id="c06-hero" class="clip c06-hero" data-start="0" data-duration="4.8" data-track-index="4">
      <img class="c06-hero-img" src="assets/cta-sabonner.png" alt="" />
    </div>

    <div class="clip c06-eyebrow" id="c06-eyebrow" data-start="0" data-duration="4.8" data-track-index="5">
      <span>CHAQUE SEMAINE</span>
    </div>

    <div class="clip c06-pill" id="c06-pill" data-start="0" data-duration="4.8" data-track-index="6">
      <span>NE RATE RIEN</span>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var root = document.querySelector('[data-composition-id="06-cta"]');
      var ground = root.querySelector("#c06-ground");
      var star = root.querySelector("#c06-star");
      var tilt = root.querySelector("#c06-tilt");
      var eyebrow = root.querySelector("#c06-eyebrow");
      var pill = root.querySelector("#c06-pill");
      var hero = root.querySelector("#c06-hero");
      var field = root.querySelector("#c06-particle-field");

      var tl = gsap.timeline({ paused: true });

      // deterministic pure hash, no Math.random
      var prand = function (n) {
        var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };

      // Scene 1 (0.0-0.5s): pink/yellow split canvas wash zoom-through-cuts in.
      tl.fromTo(ground, { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(star, { opacity: 0, scale: 0, rotation: -16 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "power3.out" }, 0.12);
      tl.fromTo(tilt, { opacity: 0, scale: 0, rotation: 12 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.45, ease: "power3.out" }, 0.16);
      tl.fromTo(eyebrow, { opacity: 0, y: -16, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, 0.08);

      // Scene 2 (0.3-1.0s): hero spring-pops to center, scale 0.7->1.0, back.out(1.8) overshoot, tilted -2deg.
      var POP_AT = 0.3;
      var POP_DUR = 0.7;
      tl.fromTo(
        hero,
        { opacity: 0, scale: 0.7, rotation: 6 },
        { opacity: 1, scale: 1, rotation: -2, duration: POP_DUR, ease: "back.out(1.8)" },
        POP_AT
      );

      // particle-burst: seeded pool of 8 dots, created once at setup, fired on the hero's landing frame.
      var PARTICLE_COUNT = 8;
      var palette = ["#FE90E8", "#F7CB46", "#99E885", "#C0F7FE"];
      var parts = [];
      for (var i = 0; i < PARTICLE_COUNT; i++) {
        var el = document.createElement("div");
        el.className = "c06-particle";
        var size = 6 + prand(i * 3 + 1) * 5; // 6-11px dots
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.style.background = palette[i % palette.length];
        el.style.border = "2px solid #000";
        field.appendChild(el);

        var angle = prand(i * 5 + 2) * Math.PI * 2; // full radial burst
        var speed = 520 + prand(i * 7 + 3) * 300; // 520-820 px/s
        parts.push({
          el: el,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
        });
      }

      var BURST_AT = POP_AT + POP_DUR; // fires on the hero's settle frame (t=1.0)
      var FLIGHT_DUR = 0.85;
      var G = 60; // gentle downward drift, near-0 per the dot-burst variation
      var FADE_FRAC = 0.32;
      var drive = { T: 0 };
      tl.fromTo(
        drive,
        { T: 0 },
        {
          T: 1,
          duration: FLIGHT_DUR,
          ease: "none",
          onUpdate: function () {
            var t = drive.T * FLIGHT_DUR;
            var fade = Math.min(1, (1 - drive.T) / FADE_FRAC);
            for (var j = 0; j < parts.length; j++) {
              var p = parts[j];
              var x = p.vx * t;
              var y = p.vy * t + 0.5 * G * t * t;
              p.el.style.transform = "translate(" + x.toFixed(1) + "px, " + y.toFixed(1) + "px)";
              p.el.style.opacity = String(drive.T === 0 ? 0 : fade);
            }
          },
        },
        BURST_AT
      );

      // Scene 3 (1.0-4.8s): held final read - very subtle sine-wave-loop micro-bob, video ends on this frame.
      var TOTAL_DURATION = 4.8;
      var IDLE_START = 1.1;
      var IDLE_DUR = TOTAL_DURATION - IDLE_START; // 3.7s, short idle -> default (low) amplitude
      var Y_AMP = 2.2;
      var SCALE_AMP = 0.01;
      var PERIOD = 1.8;
      var CYCLES = IDLE_DUR / PERIOD;
      var FADE_FRAC_IDLE = 0.18;
      var phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var t = phase.p / (Math.PI * 2 * CYCLES);
            var env = t < 1 - FADE_FRAC_IDLE ? 1 : Math.max(0, (1 - t) / FADE_FRAC_IDLE);
            var s = Math.sin(phase.p);
            var yOff = s * Y_AMP * env;
            var scaleOff = 1 + s * SCALE_AMP * env;
            hero.style.transform = "translateY(" + yOff.toFixed(2) + "px) rotate(-2deg) scale(" + scaleOff.toFixed(4) + ")";
          },
        },
        IDLE_START
      );

      // pill lands slightly after the hero + burst settle
      tl.fromTo(pill, { opacity: 0, y: 24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, 1.15);

      window.__timelines["06-cta"] = tl;
    })();
  </script>
</template>
