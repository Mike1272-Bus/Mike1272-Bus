  <script>
    (function () {

      var root = document.querySelector('[data-composition-id="04-consequence"]');

      var star = root.querySelector("#c04-star");
      var tilt = root.querySelector("#c04-tilt");
      var eyebrow = root.querySelector("#c04-eyebrow");

      var cardBottom = root.querySelector("#c04-card-bottom");
      var tagTop = root.querySelector("#c04-tag-top");
      var tagBottom = root.querySelector("#c04-tag-bottom");
      var dotTop = root.querySelector("#c04-dot-top");

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-0.5s): yellow canvas wash push-slides in from the right.

      // Scene 2 (0.3-1.0s): top card spring-pops in from above, settling tilted -2deg.

        { opacity: 0, scale: 0, y: -560, rotation: 0 },
        { opacity: 1, scale: 1, y: 0, rotation: -2, duration: 0.7, ease: "power3.out" },

          duration: IDLE_DUR,
          ease: "none",

            var t = phaseTop.p / (Math.PI * 2 * CYCLES_TOP);

            var s = Math.sin(phaseTop.p);

        },
        IDLE_START
