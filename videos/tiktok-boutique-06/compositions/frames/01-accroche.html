<template>
  <style>
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --f-display: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      --black: #000000;
      --white: #ffffff;
      --offwhite: #fffdf5;
      --blue: #c0f7fe;
      --pink: #fe90e8;
      --yellow: #f7cb46;
      --cream: #ffdc8b;
      --green: #99e885;
    }
    #root * { box-sizing: border-box; }

    /* ---- full-bleed ground (own clip layer, never on #root) ---- */
    .acc01-bg {
      position: absolute;
      inset: 0;
      background-color: var(--blue);
      will-change: transform, filter, opacity;
    }
    .acc01-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0, 0, 0, 0.1) 1.2px, transparent 1.6px);
      background-size: 24px 24px;
      opacity: 0.5;
    }

    /* ---- decorations nested in the ground: no separate clip/track needed ---- */
    .acc01-rect {
      position: absolute;
      left: -36px;
      top: -18px;
      width: 150px;
      height: 96px;
      background: var(--yellow);
      border: 3px solid var(--black);
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .acc01-star-wrap {
      position: absolute;
      top: 60px;
      right: 56px;
      width: 130px;
      height: 130px;
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .acc01-star-outer,
    .acc01-star-inner {
      position: absolute;
      clip-path: polygon(
        50% 0%, 61.8% 35.3%, 97.6% 35.3%, 68.8% 57.4%, 79.4% 91.8%,
        50% 70.5%, 20.6% 91.8%, 31.2% 57.4%, 2.4% 35.3%, 38.2% 35.3%
      );
    }
    .acc01-star-outer { inset: 0; background: var(--black); }
    .acc01-star-inner { inset: 9%; background: var(--pink); }

    .acc01-counter {
      position: absolute;
      left: 850px;
      top: 870px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--white);
      border: 3px solid var(--black);
      box-shadow: 4px 4px 0 var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--f-display);
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.05em;
      color: var(--black);
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    /* ---- label-pill: opens the region ---- */
    .acc01-pill-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 60px;
    }
    .acc01-pill {
      font-family: var(--f-display);
      font-weight: 900;
      font-size: 30px;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: var(--black);
      background: var(--pink);
      border: 4px solid var(--black);
      box-shadow: 8px 8px 0 var(--black);
      border-radius: 9999px;
      padding: 16px 36px;
      white-space: nowrap;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    /* ---- image cards (top / bottom, never overlapping — 140px gap) ---- */
    .acc01-card {
      position: absolute;
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .acc01-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--white);
      border: 4px solid var(--black);
      box-shadow: 8px 8px 0 var(--black);
      padding: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .acc01-card-inner img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--offwhite);
      display: block;
    }
    .acc01-tab {
      position: absolute;
      top: -14px;
      left: 34px;
      width: 32px;
      height: 32px;
      border: 3px solid var(--black);
      z-index: 1;
    }
    .acc01-card--top {
      left: 90px;
      top: 120px;
      width: 900px;
      height: 720px;
    }
    .acc01-card--bottom {
      left: 90px;
      top: 980px;
      width: 900px;
      height: 610px;
    }
  </style>

  <div id="root" data-composition-id="01-accroche" data-duration="8.4" data-width="1080" data-height="1920">
    <div class="acc01-bg clip" data-start="0" data-duration="8.4" data-track-index="0">
      <div class="acc01-rect" id="acc01-rect"></div>
      <div class="acc01-star-wrap" id="acc01-star">
        <div class="acc01-star-outer"></div>
        <div class="acc01-star-inner"></div>
      </div>
      <div class="acc01-counter" id="acc01-counter">01</div>
    </div>

    <div class="acc01-pill-wrap clip" data-start="0" data-duration="8.4" data-track-index="1">
      <div class="acc01-pill" id="acc01-pill">L'ERREUR CACHÉE</div>
    </div>

    <div class="acc01-card acc01-card--top clip" data-start="0" data-duration="8.4" data-track-index="2" id="acc01-top">
      <div class="acc01-tab" style="background: var(--yellow);"></div>
      <div class="acc01-card-inner">
        <img src="assets/accroche-pub-explose.png" alt="" />
      </div>
    </div>

    <div class="acc01-card acc01-card--bottom clip" data-start="0" data-duration="8.4" data-track-index="3" id="acc01-bottom">
      <div class="acc01-tab" style="background: var(--green);"></div>
      <div class="acc01-card-inner">
        <img src="assets/accroche-erreur-alerte.jpg" alt="" />
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var bg = ".acc01-bg";
      var rect = "#acc01-rect";
      var star = "#acc01-star";
      var counter = "#acc01-counter";
      var pill = "#acc01-pill";
      var topCard = document.getElementById("acc01-top");
      var bottomCard = document.getElementById("acc01-bottom");

      var TOP_ROT = -2;
      var BOTTOM_ROT = 2;

      // ---- Scene 1 (0.0-0.5s): blue canvas wash zoom-through-cuts in
      // (Z-scale + blur + opacity, per the cut catalog). ----
      tl.fromTo(
        bg,
        { scale: 1.08, opacity: 0.5, filter: "blur(10px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power2.out" },
        0
      );
      tl.fromTo(rect, { scale: 0, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: -8, duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo(star, { scale: 0, opacity: 0, rotation: 12 }, { scale: 1, opacity: 1, rotation: 5, duration: 0.4, ease: "power3.out" }, 0.1);
      tl.fromTo(pill, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.15);

      // ---- Scene 2 (0.3-1.0s): accroche-pub-explose.png spring-pops in
      // from above, settling in the TOP half (~44% height, tilted -2deg). ----
      tl.fromTo(
        topCard,
        { scale: 0, opacity: 0, y: -460, rotation: -9 },
        { scale: 1, opacity: 1, y: 0, rotation: TOP_ROT, duration: 0.55, ease: "power3.out" },
        0.3
      );

      // ---- Scene 3 (1.1-BOT_START): top card idles alone while the scene holds
      // on it -- the bottom card intentionally does NOT land yet (per the
      // "second image lands late" rule). ----
      var TOTAL = 7.9;
      var IDLE_START = 1.1;
      var IDLE_DUR = TOTAL - IDLE_START;
      var FADE_FRAC = 0.15;

      var topPeriod = 3.1;
      var topCycles = IDLE_DUR / topPeriod;
      var topPhase = { p: 0 };
      var TOP_Y_AMP = 1.2;
      var TOP_ROT_AMP = 0.3;

      tl.to(
        topPhase,
        {
          p: Math.PI * 2 * topCycles,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var t = topPhase.p / (Math.PI * 2 * topCycles);
            var env = t < 1 - FADE_FRAC ? 1 : Math.max(0, (1 - t) / FADE_FRAC);
            var s = Math.sin(topPhase.p);
            var y = s * TOP_Y_AMP * env;
            var rot = TOP_ROT + Math.sin(topPhase.p + Math.PI / 2) * TOP_ROT_AMP * env;
            topCard.style.transform = "translateY(" + y + "px) rotate(" + rot + "deg)";
          },
        },
        IDLE_START
      );

      // ---- Scene 4 (BOT_START-7.9s): accroche-erreur-alerte.jpg spring-pops in
      // from below LATE, near the end of the hold, settling in the BOTTOM half
      // (~44% height, tilted +2deg) — clear vertical gap preserved. ----
      var BOT_START = TOTAL - 1.7; // 6.2s
      tl.fromTo(
        bottomCard,
        { scale: 0, opacity: 0, y: 460, rotation: 9 },
        { scale: 1, opacity: 1, y: 0, rotation: BOTTOM_ROT, duration: 0.55, ease: "power3.out" },
        BOT_START
      );

      // corner counter chip settles once the bottom card has landed
      tl.fromTo(counter, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, BOT_START + 0.55);

      // brief settle wobble on the bottom card (too little time left for a full idle loop)
      (function () {
        var bottomPhase = { p: 0 };
        var START = BOT_START + 0.65;
        var DUR = Math.max(TOTAL - START, 0.1);
        tl.to(
          bottomPhase,
          {
            p: Math.PI * 0.6,
            duration: DUR,
            ease: "sine.out",
            onUpdate: function () {
              var s = Math.sin(bottomPhase.p);
              bottomCard.style.transform = "translateY(" + s * 1.2 + "px) rotate(" + BOTTOM_ROT + "deg)";
            },
          },
          START
        );
      })();

      window.__timelines["01-accroche"] = tl;
    })();
  </script>
</template>
