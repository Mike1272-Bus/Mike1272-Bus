  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var root = document.querySelector('[data-composition-id="05-solution"]');
      var ground = root.querySelector("#c05-ground");
      var star = root.querySelector("#c05-star");
      var tilt = root.querySelector("#c05-tilt");
      var eyebrow = root.querySelector("#c05-eyebrow");
      var cardTop = root.querySelector("#c05-card-top");
      var cardBottom = root.querySelector("#c05-card-bottom");
      var tagTop = root.querySelector("#c05-tag-top");
      var tagBottom = root.querySelector("#c05-tag-bottom");
      var dotTop = root.querySelector("#c05-dot-top");
      var dotBottom = root.querySelector("#c05-dot-bottom");

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-0.5s): blue canvas wash zoom-through-cuts in.
      tl.fromTo(ground, { opacity: 0, scale: 1.18 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0);

      // decorations arrive alongside the wash
      tl.fromTo(star, { opacity: 0, scale: 0, rotation: -14 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "power3.out" }, 0.12);
      tl.fromTo(tilt, { opacity: 0, scale: 0, rotation: 10 }, { opacity: 1, scale: 1, rotation: 8, duration: 0.45, ease: "power3.out" }, 0.16);
      tl.fromTo(eyebrow, { opacity: 0, y: -18, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, 0.08);

      // Scene 2 (0.3-1.0s): top card spring-pops in from above, settling tilted -2deg.
      tl.fromTo(
        cardTop,
        { opacity: 0, scale: 0, y: -560, rotation: 0 },
        { opacity: 1, scale: 1, y: 0, rotation: -2, duration: 0.7, ease: "power3.out" },
        0.3
      );
      tl.fromTo(tagTop, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, 0.85);
      tl.fromTo(dotTop, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, 0.9);

      // Scene 3 (1.1-BOT_START): top card idles alone while the scene holds on it --
      // the bottom card intentionally does NOT land yet (per the "second image lands
      // late" rule).
      var TOTAL_DURATION = 11.0;
      var IDLE_START = 1.1;
      var IDLE_DUR = TOTAL_DURATION - IDLE_START;
      var Y_AMP = 1.4;
      var SCALE_AMP = 0.006;
      var FADE_FRAC = 0.1;

      var PERIOD_TOP = 3.1;
      var CYCLES_TOP = IDLE_DUR / PERIOD_TOP;
      var phaseTop = { p: 0 };
      tl.to(
        phaseTop,
        {
          p: Math.PI * 2 * CYCLES_TOP,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var t = phaseTop.p / (Math.PI * 2 * CYCLES_TOP);
            var env = t < 1 - FADE_FRAC ? 1 : Math.max(0, (1 - t) / FADE_FRAC);
            var s = Math.sin(phaseTop.p);
            var yOff = s * Y_AMP * env;
            var scaleOff = 1 + s * SCALE_AMP * env;
            cardTop.style.transform = "translateY(" + yOff.toFixed(2) + "px) rotate(-2deg) scale(" + scaleOff.toFixed(4) + ")";
          },
        },
        IDLE_START
      );

      // Scene 4 (BOT_START-11.0s): bottom card spring-pops in from below LATE, near the
      // end of the hold (this scene is 11s, so the bottom card also gets a proper idle
      // window of its own once it lands), settling tilted +2deg.
      var BOT_START = TOTAL_DURATION - 3.0; // 8.0s
      tl.fromTo(
        cardBottom,
        { opacity: 0, scale: 0, y: 560, rotation: 0 },
        { opacity: 1, scale: 1, y: 0, rotation: 2, duration: 0.7, ease: "power3.out" },
        BOT_START
      );
      tl.fromTo(tagBottom, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, BOT_START + 0.55);
      tl.fromTo(dotBottom, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, BOT_START + 0.6);

      (function () {
        var BOT_IDLE_START = BOT_START + 0.8;
        var BOT_IDLE_DUR = Math.max(TOTAL_DURATION - BOT_IDLE_START, 0.1); // ~2.2s
        var PERIOD_BOTTOM = 2.2;
        var CYCLES_BOTTOM = BOT_IDLE_DUR / PERIOD_BOTTOM;
        var phaseBottom = { p: 0 };
        tl.to(
          phaseBottom,
          {
            p: Math.PI * 2 * CYCLES_BOTTOM,
            duration: BOT_IDLE_DUR,
            ease: "none",
            onUpdate: function () {
              var t = phaseBottom.p / (Math.PI * 2 * CYCLES_BOTTOM);
              var env = t < 0.7 ? 1 : Math.max(0, (1 - t) / 0.3);
              var s = Math.sin(phaseBottom.p);
              var yOff = s * Y_AMP * env;
              var scaleOff = 1 + s * SCALE_AMP * env;
              cardBottom.style.transform = "translateY(" + yOff.toFixed(2) + "px) rotate(2deg) scale(" + scaleOff.toFixed(4) + ")";
            },
          },
          BOT_IDLE_START
        );
      })();

      window.__timelines["05-solution"] = tl;
    })();
  </script>
