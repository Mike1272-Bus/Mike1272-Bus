  <div id="root" data-composition-id="04-explication2" data-duration="7.4" data-width="1080" data-height="1920">

    <div class="fe2-card fe2-card-bottom clip" data-start="0" data-duration="7.4" data-track-index="4">
      <img src="assets/meta-logo-reactions.png" alt="" />
      <div class="fe2-tag fe2-tag-bottom">Meta decide</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene 1 (0-0.5s): green canvas wash push-slides in from the right.
    tl.fromTo(".fe2-bg, .fe2-dotgrid", { xPercent: 100 }, { xPercent: 0, duration: 0.5, ease: "power2.out" }, 0);

    // ambient decorations settle in alongside the wash
    tl.fromTo(
      ".fe2-star",
      { scale: 0, opacity: 0, rotation: 8 },
      { scale: 1, opacity: 1, rotation: 8, duration: 0.5, ease: "power3.out" },
      0.1,
    );
    tl.fromTo(
      ".fe2-stripe",
      { scale: 0, opacity: 0, rotation: -6 },
      { scale: 1, opacity: 1, rotation: -6, duration: 0.5, ease: "power3.out" },
      0.15,
    );
    tl.fromTo(".fe2-dot-deco", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.2);
    tl.fromTo(
      ".fe2-label",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.15,
    );

    // Scene 2 (0.3-1.0s): advantage-plus.jpg spring-pops in from above into the TOP half, tilted -2deg.
    tl.fromTo(
      ".fe2-card-top",
      { scale: 0, opacity: 0, y: -520, rotation: -2 },
      { scale: 1, opacity: 1, y: 0, rotation: -2, duration: 0.7, ease: "power3.out" },
      0.3,
    );

    // Scene 3 (1.0-1.7s): meta-logo-reactions.png spring-pops in from below into the BOTTOM half, tilted +2deg.
    tl.fromTo(
      ".fe2-card-bottom",
      { scale: 0, opacity: 0, y: 520, rotation: 2 },
      { scale: 1, opacity: 1, y: 0, rotation: 2, duration: 0.7, ease: "power3.out" },
      1.0,
    );

    // Scene 4 (1.7-7.0s): independent-phase sine-wave-loop idle drift on both cards, small amplitude,
    // each halved + settle-and-fade tail since the idle window covers most of the 7s duration.
    const TOTAL = 7.0;

    const topPhase = { p: 0 };
    const TOP_START = 1.1;
    const TOP_DUR = TOTAL - TOP_START; // 5.9s
    const TOP_CYCLES = 2.03; // period ~2.9s
    tl.to(
      topPhase,
      {
        p: Math.PI * 2 * TOP_CYCLES,
        duration: TOP_DUR,
        ease: "none",
        onUpdate: () => {
          const t = topPhase.p / (Math.PI * 2 * TOP_CYCLES);
          const env = t < 0.8 ? 1 : Math.max(0, (1 - t) / 0.2);
          const s = Math.sin(topPhase.p);
          const card = document.querySelector(".fe2-card-top");
          if (card) card.style.transform = `translateY(${s * 1.5 * env}px) scale(${1 + s * 0.006 * env}) rotate(-2deg)`;
        },
      },
      TOP_START,
    );

    const botPhase = { p: 0 };
    const BOT_START = 1.8;
    const BOT_DUR = TOTAL - BOT_START; // 5.2s
    const BOT_CYCLES = 2.0; // period ~2.6s, out of phase with top card
    tl.to(
      botPhase,
      {
        p: Math.PI * 2 * BOT_CYCLES,
        duration: BOT_DUR,
        ease: "none",
        onUpdate: () => {
          const t = botPhase.p / (Math.PI * 2 * BOT_CYCLES);
          const env = t < 0.8 ? 1 : Math.max(0, (1 - t) / 0.2);
          const s = Math.sin(botPhase.p + Math.PI / 2);
          const card = document.querySelector(".fe2-card-bottom");
          if (card) card.style.transform = `translateY(${s * 1.5 * env}px) scale(${1 + s * 0.006 * env}) rotate(2deg)`;
        },
      },
      BOT_START,
    );

    window.__timelines["04-explication2"] = tl;
  </script>
