  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var flashBlue = document.querySelector(".avis07-flash-blue");
      var flashPink = document.querySelector(".avis07-flash-pink");
      var decoRect = document.getElementById("avis07-deco-rect");
      var decoStar = document.getElementById("avis07-deco-star");
      var label = document.getElementById("avis07-label");
      var topCard = document.getElementById("avis07-top");
      var bottomCard = document.getElementById("avis07-bottom");
      var connector = document.getElementById("avis07-connector");

      // ---- deterministic initial states ----
      gsap.set(flashBlue, { scaleX: 1, scaleY: 1, filter: "blur(0px)" });
      gsap.set(flashPink, { scaleX: 1, scaleY: 1, filter: "blur(0px)" });
      gsap.set(decoRect, { scale: 0, opacity: 0, rotation: -14, transformOrigin: "50% 50%" });
      gsap.set(decoStar, { scale: 0, opacity: 0, rotation: 16, transformOrigin: "50% 50%" });
      gsap.set(label, { scale: 0.5, opacity: 0 });
      gsap.set(topCard, { scale: 0.82, opacity: 0, y: -520, rotation: -9 });
      gsap.set(bottomCard, { scale: 0.82, opacity: 0, y: 560, rotation: 9 });
      gsap.set(connector, { scale: 0, opacity: 0 });

      // ---------------- Scene 1 (0.0-0.5s): cream wash zoom-through-cuts in ----------------
      tl.fromTo(
        flashBlue,
        { scaleX: 1, scaleY: 1, filter: "blur(0px)" },
        { scaleX: 1.3, scaleY: 1.55, filter: "blur(18px)", duration: 0.25, ease: "power2.in" },
        0
      );
      tl.fromTo(
        flashPink,
        { scaleX: 1, scaleY: 1, filter: "blur(0px)" },
        { scaleX: 1.3, scaleY: 1.55, filter: "blur(18px)", duration: 0.25, ease: "power2.in" },
        0.25
      );

      // ground decorations punctuate the open
      tl.to(decoRect, { scale: 1, opacity: 1, rotation: -8, duration: 0.3, ease: "power3.out" }, 0.05);
      tl.to(decoStar, { scale: 1, opacity: 1, rotation: 8, duration: 0.3, ease: "power3.out" }, 0.15);

      // chrome label opens the region
      tl.to(label, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.15);

      var TOTAL = 6.5;

      // ---------------- Scene 2 (0.3-1.0s): top card spring-pops in from above ----------------
      tl.to(
        topCard,
        { scale: 1, opacity: 1, y: 0, rotation: -2, duration: 0.55, ease: "power3.out" },
        0.35
      );

      // ---------------- Scene 3 (1.1-BOT_START): top card idles alone while the scene
      // holds on it — the bottom card intentionally does NOT land yet (per the "second
      // image lands late" rule: images must not both arrive within the first 1-2s). ----------------
      (function () {
        var IDLE_START = 1.1;
        var IDLE_DUR = TOTAL - IDLE_START;
        var FADE_FRAC = 0.15;
        var TOP_PERIOD = 2.9;
        var TOP_CYCLES = IDLE_DUR / TOP_PERIOD;
        var topPhase = { p: 0 };
        var TOP_Y_AMP = 1.2;
        var TOP_ROT_AMP = 0.3;
        var TOP_BASE_ROT = -2;

        tl.to(
          topPhase,
          {
            p: Math.PI * 2 * TOP_CYCLES,
            duration: IDLE_DUR,
            ease: "none",
            onUpdate: function () {
              var t = topPhase.p / (Math.PI * 2 * TOP_CYCLES);
              var env = t < 1 - FADE_FRAC ? 1 : (1 - t) / FADE_FRAC;
              var s = Math.sin(topPhase.p);
              var y = s * TOP_Y_AMP * env;
              var rot = TOP_BASE_ROT + Math.sin(topPhase.p + Math.PI / 2) * TOP_ROT_AMP * env;
              topCard.style.transform = "translateY(" + y + "px) rotate(" + rot + "deg)";
            },
          },
          IDLE_START
        );
      })();

      // ---------------- Scene 4 (BOT_START-TOTAL): bottom card spring-pops in from below,
      // LATE, near the end of the hold — gives it its own beat instead of landing right
      // after the top card. Connector chip pops once both are visible. ----------------
      var BOT_START = TOTAL - 1.7; // 4.8s
      tl.to(
        bottomCard,
        { scale: 1, opacity: 1, y: 0, rotation: 2, duration: 0.55, ease: "power3.out" },
        BOT_START
      );
      tl.to(
        connector,
        { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" },
        BOT_START + 0.6
      );

      // brief settle wobble on the bottom card after landing (too little time left
      // for a full idle loop)
      (function () {
        var bottomPhase = { p: 0 };
        var START = BOT_START + 0.65;
        var DUR = Math.max(TOTAL - START, 0.1);
        tl.to(
          bottomPhase,
          {
            p: Math.PI * 0.6,
            duration: DUR,
            ease: "sine.out",
            onUpdate: function () {
              var s = Math.sin(bottomPhase.p);
              bottomCard.style.transform = "translateY(" + s * 1.2 + "px) rotate(2deg)";
            },
          },
          START
        );
      })();

      window.__timelines["07-avis"] = tl;
    })();
