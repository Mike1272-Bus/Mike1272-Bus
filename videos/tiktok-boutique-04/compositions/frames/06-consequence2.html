  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene 1 (0-0.5s): blue canvas wash push-slides in from the right.
    tl.fromTo(".c2-bg, .c2-dotgrid", { xPercent: 100 }, { xPercent: 0, duration: 0.5, ease: "power2.out" }, 0);

    // ambient decorations settle in alongside the wash
    tl.fromTo(
      ".c2-stripe",
      { scale: 0, opacity: 0, rotation: 8 },
      { scale: 1, opacity: 1, rotation: 8, duration: 0.5, ease: "power3.out" },
      0.1,
    );
    tl.fromTo(
      ".c2-star",
      { scale: 0, opacity: 0, rotation: 10 },
      { scale: 1, opacity: 1, rotation: 10, duration: 0.5, ease: "power3.out" },
      0.15,
    );
    tl.fromTo(".c2-dot-deco", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.2);
    tl.fromTo(".c2-label", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.15);

    // Scene 2 (0.3-1.0s): dashboard-earnings.jpg spring-pops in, tilted +2deg, ~72% of frame, centered.
    tl.fromTo(
      ".c2-card",
      { scale: 0, opacity: 0, y: 40, rotation: 2 },
      { scale: 1, opacity: 1, y: 0, rotation: 2, duration: 0.7, ease: "power3.out" },
      0.3,
    );

    // Scene 3 (1.0-6.5s): continuous sine-wave-loop idle drift for the rest of the hold.
    // Idle window (5.4s) is a large share of the 6.5s duration -> halved amplitude, slower period,
    // settle-and-fade tail so the frame is visibly still before the hand-off.
    const TOTAL = 5.804;
    const phase = { p: 0 };
    const IDLE_START = 1.1;
    const IDLE_DUR = TOTAL - IDLE_START; // 5.4s
    const CYCLES = 1.8; // period ~3s (slowed per long-idle rule)
    tl.to(
      phase,
      {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: () => {
          const t = phase.p / (Math.PI * 2 * CYCLES);
          const env = t < 0.8 ? 1 : Math.max(0, (1 - t) / 0.2);
          const s = Math.sin(phase.p);
          const card = document.querySelector(".c2-card");
          if (card) card.style.transform = `translateY(${s * 2.5 * env}px) scale(${1 + s * 0.007 * env}) rotate(2deg)`;
        },
      },
      IDLE_START,
    );

    window.__timelines["06-consequence2"] = tl;
