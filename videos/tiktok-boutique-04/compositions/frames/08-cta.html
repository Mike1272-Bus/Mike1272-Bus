<template>
<div id="root" data-composition-id="08-cta" data-duration="3.5" data-width="1080" data-height="1920">
  <style>
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      --black: #000000;
      --white: #ffffff;
      --offwhite: #fffdf5;
      --pink: #fe90e8;
      --blue: #c0f7fe;
      --green: #99e885;
      --yellow: #f7cb46;
      --cream: #ffdc8b;
      --font-display: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      --font-label: "Helvetica Neue", Arial, sans-serif;
    }
    #root * { box-sizing: border-box; }

    /* ---------- ground: pink/yellow split wash, full-bleed, full duration ---------- */
    .cta08-ground {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--pink) 0%, var(--pink) 50%, var(--yellow) 50%, var(--yellow) 100%);
    }
    .cta08-dotgrid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0, 0, 0, 0.09) 1.2px, transparent 1.3px);
      background-size: 24px 24px;
    }
    .cta08-deco {
      position: absolute;
      opacity: 0;
      will-change: transform, opacity;
    }
    .cta08-deco-rect {
      right: -34px;
      top: -16px;
      width: 150px;
      height: 92px;
      background: var(--blue);
      border: 3px solid var(--black);
    }
    .cta08-deco-star {
      left: 40px;
      top: 30px;
      width: 92px;
      height: 92px;
      background: var(--green);
      border: 3px solid var(--black);
      clip-path: polygon(
        50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%,
        21% 91%, 32% 57%, 2% 35%, 39% 35%
      );
    }

    /* ---------- Scene 1: zoom-through-cut wash flashes ---------- */
    .cta08-flash {
      position: absolute;
      inset: 0;
      will-change: transform, filter;
    }
    .cta08-flash-yellow { background: var(--yellow); }
    .cta08-flash-pink { background: var(--pink); }

    /* ---------- chrome label-pill ---------- */
    .cta08-label-wrap {
      position: absolute;
      top: 140px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .cta08-label {
      font-family: var(--font-label);
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--black);
      background: var(--white);
      border: 3px solid var(--black);
      border-radius: 9999px;
      box-shadow: 4px 4px 0 var(--black);
      padding: 15px 34px;
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    /* ---------- hero: the sticker card + its particle burst ---------- */
    .cta08-burst-stage {
      position: absolute;
      left: 540px;
      top: 905px;

      transform: translate(-50%, -50%);
    }
    .cta08-particle-field {
      position: absolute;
      left: 0;

    .cta08-particle {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
      opacity: 0;
      will-change: transform, opacity;
    }
    .cta08-sticker {
      position: absolute;
      left: 130px;
      top: 495px;
      width: 820px;
      height: 820px;
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
      z-index: 2;
    }
    .cta08-sticker-inner {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--white);
      border: 4px solid var(--black);
      box-shadow: 10px 10px 0 var(--black);
      padding: 24px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cta08-sticker-inner img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>

  <div class="clip cta08-ground" data-start="0" data-duration="3.5" data-track-index="0">
    <div class="cta08-dotgrid"></div>
    <div class="cta08-deco cta08-deco-rect" id="cta08-deco-rect"></div>
    <div class="cta08-deco cta08-deco-star" id="cta08-deco-star"></div>
  </div>

  <div class="clip cta08-flash cta08-flash-yellow" data-start="0" data-duration="0.25" data-track-index="1"></div>
  <div class="clip cta08-flash cta08-flash-pink" data-start="0.25" data-duration="0.25" data-track-index="1"></div>

  <div class="clip cta08-label-wrap" data-start="0.1" data-duration="3.4" data-track-index="2">
    <div class="cta08-label" id="cta08-label">DERNIERE ETAPE</div>
  </div>

  <div class="cta08-burst-stage">
    <div class="cta08-particle-field" id="cta08-particle-field"></div>
  </div>

  <div class="clip cta08-sticker" id="cta08-sticker" data-start="0.3" data-duration="3.2" data-track-index="3">
    <div class="cta08-sticker-inner">
      <img src="assets/abonne-toi-sticker.jpg" alt="" />
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var prand = function (n) {
        var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };

      var flashYellow = document.querySelector(".cta08-flash-yellow");
      var flashPink = document.querySelector(".cta08-flash-pink");
      var decoRect = document.getElementById("cta08-deco-rect");
      var decoStar = document.getElementById("cta08-deco-star");
      var label = document.getElementById("cta08-label");
      var sticker = document.getElementById("cta08-sticker");

      // ---- deterministic initial states ----
      gsap.set(flashYellow, { scaleX: 1, scaleY: 1, filter: "blur(0px)" });
      gsap.set(flashPink, { scaleX: 1, scaleY: 1, filter: "blur(0px)" });
      gsap.set(decoRect, { scale: 0, opacity: 0, rotation: 14, transformOrigin: "50% 50%" });
      gsap.set(decoStar, { scale: 0, opacity: 0, rotation: -16, transformOrigin: "50% 50%" });
      gsap.set(label, { scale: 0.5, opacity: 0 });
      gsap.set(sticker, { scale: 0.7, opacity: 0, rotation: -14 });

      // ---------------- Scene 1 (0.0-0.5s): pink/yellow split wash zoom-through-cuts in ----------------
      tl.fromTo(
        flashYellow,
        { scaleX: 1, scaleY: 1, filter: "blur(0px)" },
        { scaleX: 1.3, scaleY: 1.55, filter: "blur(18px)", duration: 0.25, ease: "power2.in" },
        0
      );
      tl.fromTo(
        flashPink,
        { scaleX: 1, scaleY: 1, filter: "blur(0px)" },
        { scaleX: 1.3, scaleY: 1.55, filter: "blur(18px)", duration: 0.25, ease: "power2.in" },
        0.25
      );

      tl.to(decoStar, { scale: 1, opacity: 1, rotation: -8, duration: 0.3, ease: "power3.out" }, 0.05);
      tl.to(decoRect, { scale: 1, opacity: 1, rotation: 8, duration: 0.3, ease: "power3.out" }, 0.15);
      tl.to(label, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.15);

      // ---------------- Scene 2 (0.3-1.0s): sticker spring-pops to center with overshoot ----------------
      var STICKER_START = 0.3;
      var STICKER_DUR = 0.5;
      tl.to(
        sticker,
        { scale: 1, opacity: 1, rotation: -3, duration: STICKER_DUR, ease: "back.out(1.8)" },
        STICKER_START
      );

      // particle-burst fires on the sticker's landing frame — deterministic dot burst,
      // fixed pool, pure ballistic function of T, z-indexed behind the sticker.
      (function () {
        var PARTICLE_COUNT = 8;
        var SIZE_MIN = 5,
          SIZE_MAX = 9;
        var SPEED_MIN = 240,
          SPEED_MAX = 440;
        var G = 40; // near-zero: radial dot drift, not confetti fall
        var FLIGHT_DUR = 0.6;
        var FADE_FRAC = 0.3;
        var BURST_AT = STICKER_START + STICKER_DUR - 0.02; // the sticker's landing frame

        var palette = ["var(--black)", "var(--pink)", "var(--blue)", "var(--green)", "var(--yellow)"];
        var field = document.getElementById("cta08-particle-field");
        var parts = [];
        for (var i = 0; i < PARTICLE_COUNT; i++) {
          var el = document.createElement("div");
          el.className = "cta08-particle";
          var size = SIZE_MIN + prand(i * 3 + 1) * (SIZE_MAX - SIZE_MIN);
          el.style.width = size + "px";
          el.style.height = size + "px";
          el.style.background = palette[i % palette.length];
          field.appendChild(el);

          var angle = prand(i * 5 + 2) * Math.PI * 2; // radial burst, all directions
          var speed = SPEED_MIN + prand(i * 7 + 3) * (SPEED_MAX - SPEED_MIN);
          parts.push({
            el: el,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
          });
        }

        var drive = { T: 0 };
        tl.fromTo(
          drive,
          { T: 0 },
          {
            T: 1,
            duration: FLIGHT_DUR,
            ease: "none",
            onUpdate: function () {
              var t = drive.T * FLIGHT_DUR;
              var fade = Math.min(1, (1 - drive.T) / FADE_FRAC);
              for (var j = 0; j < parts.length; j++) {
                var p = parts[j];
                var x = p.vx * t;
                var y = p.vy * t + 0.5 * G * t * t;
                p.el.style.transform = "translate(" + x + "px, " + y + "px)";
                p.el.style.opacity = String(drive.T === 0 ? 0 : fade);
              }
            },
          },
          BURST_AT
        );
      })();

      // ---------------- Scene 3 (1.0-3.5s): held final read — subtle micro-bob only ----------------
      // Final frame of the video: no exit tween, a quiet settle/hold is the correct close.
      (function () {
        var TOTAL = 3.5;
        var IDLE_START = 1.0;
        var IDLE_DUR = TOTAL - IDLE_START; // 2.5s
        var PERIOD = 2.2;
        var CYCLES = IDLE_DUR / PERIOD;
        var Y_AMP = 1.3;
        var ROT_AMP = 0.35;
        var BASE_ROT = -3;
        var phase = { p: 0 };

        tl.to(
          phase,
          {
            p: Math.PI * 2 * CYCLES,
            duration: IDLE_DUR,
            ease: "none",
            onUpdate: function () {
              var s = Math.sin(phase.p);
              var y = s * Y_AMP;
              var rot = BASE_ROT + Math.sin(phase.p + Math.PI / 2) * ROT_AMP;
              sticker.style.transform = "translateY(" + y + "px) rotate(" + rot + "deg) scale(1)";
            },
          },
          IDLE_START
        );
      })();

      window.__timelines["08-cta"] = tl;
    })();
  </script>
</div>
</template>
