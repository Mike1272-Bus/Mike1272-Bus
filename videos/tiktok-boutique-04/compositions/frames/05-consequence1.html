    // Scene 3 (1.6-6.5s): each card keeps its own low-amplitude sine-wave-loop idle drift,
    // offset phase per card so the three never move in lockstep.
    const TOTAL = 5.883;
    const IDLE_START = 1.6;
    const IDLE_DUR = TOTAL - IDLE_START; // 4.9s

    function idleDrift(selector, baseRotation, period, ampY, ampDeg, phaseOffset) {
      const cycles = IDLE_DUR / period;
      const phase = { p: phaseOffset };
      tl.to(
        phase,
        {
          p: phaseOffset + Math.PI * 2 * cycles,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: () => {
            const s = Math.sin(phase.p);
            const el = document.querySelector(selector);
            if (el) el.style.transform = `translateY(${s * ampY}px) rotate(${baseRotation + s * ampDeg}deg)`;
          },
        },
        IDLE_START,
      );
    }

    idleDrift(".c1-mini--1", -1, 2.6, 3, 0.8, 0);
