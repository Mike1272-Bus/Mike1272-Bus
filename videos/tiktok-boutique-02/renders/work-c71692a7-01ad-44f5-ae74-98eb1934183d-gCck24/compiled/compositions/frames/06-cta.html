      (function () {

          var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;

        };
        var field = document.querySelector('.cta06-particle-field');
        var palette = ['#FE90E8', '#99E885', '#C0F7FE'];
        var PARTICLE_COUNT = 7;
        var SIZE_MIN = 5, SIZE_MAX = 8;
        var SPEED_MIN = 160, SPEED_MAX = 260;
        var G = 40;
        var FLIGHT_DUR = 0.55;
        var FADE_FRAC = 0.3;
        var BURST_AT = 2.15;

        var parts = [];
        for (var i = 0; i < PARTICLE_COUNT; i++) {
          var el = document.createElement('div');
          el.className = 'cta06-particle';
          var size = SIZE_MIN + prand(i * 3 + 1) * (SIZE_MAX - SIZE_MIN);
          el.style.width = size + 'px';
          el.style.height = size + 'px';
          el.style.background = palette[i % palette.length];

          var angle = prand(i * 5 + 2) * Math.PI * 2;
          var speed = SPEED_MIN + prand(i * 7 + 3) * (SPEED_MAX - SPEED_MIN);
          parts.push({
            el: el,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed

              var y = p.vy * t + 0.5 * G * t * t;

              p.el.style.opacity = String(drive.T === 0 ? 0 : fade);
