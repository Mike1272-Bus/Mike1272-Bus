<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.4"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-hook-voice"
        src="audio/lines/01-hook.wav"
        data-start="0"
        data-duration="4"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-raison1"
        class="scene"
        data-composition-id="02-raison1"
        data-composition-src="compositions/frames/02-raison1.html"
        data-start="4"
        data-duration="5.6"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-raison1-voice"
        src="audio/lines/02-raison1.wav"
        data-start="4"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-raison2"
        class="scene"
        data-composition-id="03-raison2"
        data-composition-src="compositions/frames/03-raison2.html"
        data-start="9"
        data-duration="5.4"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-raison2-voice"
        src="audio/lines/03-raison2.wav"
        data-start="9"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-raison3"
        class="scene"
        data-composition-id="04-raison3"
        data-composition-src="compositions/frames/04-raison3.html"
        data-start="14"

        data-track-index="1"
      ></div>
      <audio
        id="el-04-raison3-voice"

      <audio

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="26"
        data-duration="5"
        data-track-index="1"
      ></div>
      <audio
        id="el-06-cta-voice"

        data-start="26"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 4);
        tl.fromTo("#el-02-raison1", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 4);
        tl.to("#el-02-raison1", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 9);
        tl.fromTo("#el-03-raison2", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 9);
        tl.to("#el-03-raison2", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 14);
        tl.fromTo("#el-04-raison3", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 14);
        tl.to("#el-04-raison3", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 20);
        tl.fromTo("#el-05-pivot-preuve", { x: 1080, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 20);
        tl.to({}, { duration: 31 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
