  <div id="root" data-composition-id="05-pivot-preuve" data-duration="5.71" data-width="1080" data-height="1920">

    <!-- Scene 1 (0-1.6s): the real nyara proof lands directly — no mock shell to
         crossfade from. This is the incoming half of the push-slide cut from Frame 4:

    <!-- Scene 2 (1.6-3.4s): confirming beat — particle field sits behind the pill -->

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // --- Scene 1 (0.0-1.6s) ---------------------------------------------------
      // Push-slide arrival, cut-the-curve style: the nyara screenshot continues
      // the rightward push from the Frame 4 cut — starts offset further right and
      // faded down, decelerates hard into its resting footprint (power4.out mirrors
      // a power4.in exit on the other side of the cut), landing on
      // "un site, c'est toujours la". A light directional blur on the way in sells
      // the speed of the arrival without smearing the real screenshot at rest.
      tl.fromTo(
        ".pp05-nyara",
        { x: 220, opacity: 0.35, filter: "blur(14px)" },
        { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power4.out" },
        0
      );

      // --- Scene 2 (1.6-3.4s): confirming label-pill, gentle spring-pop ---------
      tl.fromTo(
        ".pp05-pill",
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" },
        1.6
      );

      // Particle-burst accent: one small dot-burst fired on the pill's landing
      // frame — the video's confirming "yes" beat. Deterministic seeded pool,
      // pure ballistic function of driver time so any seek renders correctly.
      (function () {
        const field = document.getElementById("pp05-burst-field");
        const palette = ["#fe90e8", "#f7cb46", "#c0f7fe"];
        const PARTICLE_COUNT = 6;
        const SIZE_MIN = 5;
        const SIZE_MAX = 8;
        const SPEED_MIN = 180;
        const SPEED_MAX = 320;
        const G = 60; // light drift, not a confetti-heavy fall
        const FLIGHT_DUR = 0.6;
        const FADE_FRAC = 0.3;
        const BURST_AT = 2.05; // the pill's spring-pop settle frame

        const prand = function (n) {
          const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
          return x - Math.floor(x);
        };

        const parts = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const el = document.createElement("div");
          el.className = "pp05-particle";
          const size = SIZE_MIN + prand(i * 3 + 1) * (SIZE_MAX - SIZE_MIN);
          el.style.width = size + "px";
          el.style.height = size + "px";
          el.style.background = palette[i % palette.length];
          field.appendChild(el);

          const angle = prand(i * 5 + 2) * Math.PI * 2; // full radial dot burst
          const speed = SPEED_MIN + prand(i * 7 + 3) * (SPEED_MAX - SPEED_MIN);
          parts.push({
            el: el,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
          });
        }

        const drive = { T: 0 };
        tl.fromTo(
          drive,
          { T: 0 },
          {
            T: 1,
            duration: FLIGHT_DUR,
            ease: "none",
            onUpdate: function () {
              const t = drive.T * FLIGHT_DUR;
              const fade = Math.min(1, (1 - drive.T) / FADE_FRAC);
              parts.forEach(function (p) {
                const x = p.vx * t;
                const y = p.vy * t + 0.5 * G * t * t;
                p.el.style.transform = "translate(" + x + "px, " + y + "px)";
                p.el.style.opacity = String(drive.T === 0 ? 0 : fade);
              });
            },
          },
          BURST_AT
        );
      })();

      // --- Scene 3 (3.4-5.2s) -----------------------------------------------------
      // aura slides + fades in from the right edge, docking over nyara's
      // bottom-right corner, timed to "et ca fait plus serieux"
      tl.fromTo(
        ".pp05-aura",
        { opacity: 0, x: 220 },
        { opacity: 1, x: 0, duration: 0.9, ease: "power2.out" },
        3.4
      );

      // --- Scene 4 (5.2-6.0s): held read on both real screenshots — no further motion

      window.__timelines["05-pivot-preuve"] = tl;
    })();
  </script>
