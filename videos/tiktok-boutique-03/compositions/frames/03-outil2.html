<script>
  (function () {
    window.__timelines = window.__timelines || {};

    const bgWash = "#outil2-bgwash";
    const heroCard = "#outil2-hero-card";
    const supportCard = "#outil2-support-card";
    const decoTop = "#outil2-deco-top";
    const decoBottom = "#outil2-deco-bottom";

    const tl = gsap.timeline({ paused: true });

    // --- Scene 1 (0.0-2.2s): pink wash settles; hero push-slides in from the
    // right, decelerating to rest (cut-the-curve velocity match). ---
    tl.fromTo(
      bgWash,
      { opacity: 0.85, scale: 1.02 },
      { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" },
      0,
    );

    tl.fromTo(
      decoTop,
      { opacity: 0, y: -14, rotation: 4 },
      { opacity: 1, y: 0, rotation: 10, duration: 0.5, ease: "power2.out" },
      0.15,
    );

    // hero enters fully off-canvas right (x offset), rotation held constant
    // through the slide so GSAP owns the whole transform (no CSS conflict).
    tl.fromTo(
      heroCard,
      { x: 970, rotation: -2 },
      { x: 0, rotation: -2, duration: 2.2, ease: "power4.out" },
      0,
    );

    // --- Scene 2 (2.2-3.0s): supporting card spring-pops in behind/below,
    // smaller, offset bottom-left, back.out settle. ---
    tl.fromTo(
      supportCard,
      { opacity: 0, scale: 0.6, rotation: -6 },
      { opacity: 1, scale: 1, rotation: 5, duration: 0.8, ease: "back.out(1.6)" },
      2.2,
    );

    tl.fromTo(
      decoBottom,
      { opacity: 0, scale: 0.6, rotation: -18 },
      { opacity: 1, scale: 1, rotation: -8, duration: 0.5, ease: "back.out(2)" },
      2.4,
    );

    // --- Scene 3 (3.0-5.0s): both cards keep a continuous sine-wave-loop
    // idle drift for the rest of the hold — offset phase, 3 finite cycles.
    // Long-idle-window (idle = 40% of total duration) => halved amplitude
    // per the sine-wave-loop recipe's damping rule. Composes onto the
    // resting transform, never overwrites it. ---
    const IDLE_START = 3.0;
    const IDLE_DUR = 2.0; // 3.0 -> 5.0
    const CYCLES = 3;

    const heroPhase = { p: 0 };
    tl.to(
      heroPhase,
      {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: () => {
          const s = Math.sin(heroPhase.p);
          gsap.set(heroCard, { y: s * 1.3, rotation: -2 + s * 0.3 });
        },
      },
      IDLE_START,
    );

    const supportPhase = { p: 0 };
    tl.to(
      supportPhase,
      {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: () => {
          // offset phase (+ PI/2) so the two cards never drift in lockstep
          const s = Math.sin(supportPhase.p + Math.PI / 2);
          gsap.set(supportCard, { y: s * 1.1, rotation: 5 + s * 0.25 });
        },
      },
      IDLE_START,
    );

    window.__timelines["03-outil2"] = tl;
  })();
</script>
