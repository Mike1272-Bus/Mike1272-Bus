  <style>

  <script>
    (function () {
      const hero = document.getElementById("outil3-hero-card");
      const support = document.getElementById("outil3-support-card");
      const star = document.getElementById("outil3-star");
      const stripe = document.getElementById("outil3-stripe");

      const HERO_BASE_ROT = -2;
      const SUPPORT_BASE_ROT = 4;

      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-0.5s): hero lands as the incoming half of the zoom-through cut.
      tl.fromTo(
        hero,
        { scale: 0.75, opacity: 0.15, rotation: HERO_BASE_ROT, filter: "blur(10px)" },
        {
          scale: 1,
          opacity: 1,
          rotation: HERO_BASE_ROT,
          filter: "blur(0px)",
          duration: 0.5,
          ease: "expo.out",
        },
        0,
      );

      // decorative star-burst settles in alongside the hero's arrival.
      tl.fromTo(
        star,
        { scale: 0, opacity: 0, rotation: -14 },
        { scale: 1, opacity: 1, rotation: -8, duration: 0.45, ease: "back.out(2)" },
        0.15,
      );

      // Scene 2 (0.5-1.4s): supporting card spring-pops in behind/right of the hero.
      tl.fromTo(
        support,
        { scale: 0.4, opacity: 0, rotation: 22 },
        {
          scale: 1,
          opacity: 1,
          rotation: SUPPORT_BASE_ROT,
          duration: 0.9,
          ease: "back.out(1.6)",
        },
        0.5,
      );

      // stripe-block decoration settles in shortly after both cards land.
      tl.fromTo(
        stripe,
        { scale: 0.5, opacity: 0, rotation: 20 },
        { scale: 1, opacity: 1, rotation: 8, duration: 0.5, ease: "back.out(1.8)" },
        1.5,
      );

      // Scene 3 (1.4-5.0s): continuous sine-wave-loop idle drift, offset phase between cards.
      const IDLE_START = 1.4;
      const IDLE_DUR = 5.0 - IDLE_START; // 3.6s
      const CYCLES = 3; // 3 finite cycles per the frame's shot sequence
      const Y_AMP = 2.2; // px, low end of range
      const ROT_AMP = 0.4; // deg, low end of range
      const FADE_FRAC = 0.2; // settle-and-fade tail over the last 20% of the idle

      const phase = { p: 0 };

      tl.to(
        phase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: IDLE_DUR,
          ease: "none", // sine itself provides the curve
          onUpdate: () => {
            const t = phase.p / (Math.PI * 2 * CYCLES);
            const env = t < 1 - FADE_FRAC ? 1 : Math.max(0, (1 - t) / FADE_FRAC);
            const s1 = Math.sin(phase.p) * env;
            // offset by PI/2 so the two cards never drift in lockstep
            const s2 = Math.sin(phase.p + Math.PI / 2) * env;

            gsap.set(hero, { y: s1 * Y_AMP, rotation: HERO_BASE_ROT + s1 * ROT_AMP });
            gsap.set(support, { y: s2 * Y_AMP, rotation: SUPPORT_BASE_ROT + s2 * ROT_AMP });
          },
        },
        IDLE_START,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["04-outil3"] = tl;
    })();
  </script>
