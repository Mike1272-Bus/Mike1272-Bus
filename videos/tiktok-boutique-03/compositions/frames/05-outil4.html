  <script>
    window.__timelines = window.__timelines || {};

    (function build() {
      // Elements are resolved lazily by the runtime against this template's clone;
      // GSAP selector text targets classes/ids scoped within the cloned #root.
      const tl = gsap.timeline({ paused: true });

      const bg = '.outil4-bg';
      const hero = '.outil4-card--hero';
      const support = '.outil4-card--support';

      // --- Scene 1 (0.0-2.2s): cream wash settles, hero push-slides in from the right ---
      gsap.set(hero, { rotation: -3 });
      gsap.set(support, { rotation: 3, scale: 0.5, autoAlpha: 0, transformOrigin: '50% 50%' });

      tl.fromTo(bg, { scale: 1.025 }, { scale: 1, duration: 0.4, ease: 'power2.out' }, 0);

      // Cut-the-curve velocity match: enters from further right, decelerates hard into rest.
      tl.fromTo(
        hero,
        { x: 940 },
        { x: 0, duration: 1.3, ease: 'expo.out' },
        0.15,
      );

      // --- Scene 2 (2.2-3.0s): supporting card spring-pops in behind/above the hero ---
      tl.to(
        support,
        { scale: 1, autoAlpha: 1, duration: 0.6, ease: 'back.out(1.7)' },
        2.2,
      );

      // --- Scene 3 (3.0-5.0s): continuous sine-wave-loop idle drift, offset phase, ~3 cycles ---
      const HERO_IDLE_START = 3.0;
      const HERO_LEG = 1 / 3; // 6 legs of 0.333s => 3 full cycles across 2.0s
      const HERO_REPEAT = 5;

      tl.to(
        hero,
        { y: 3, duration: HERO_LEG, ease: 'sine.inOut', yoyo: true, repeat: HERO_REPEAT },
        HERO_IDLE_START,
      );
      tl.to(
        hero,
        { rotation: -3.4, duration: HERO_LEG, ease: 'sine.inOut', yoyo: true, repeat: HERO_REPEAT },
        HERO_IDLE_START,
      );

      const SUPPORT_IDLE_START = 3.15; // offset phase vs. hero
      const SUPPORT_LEG = 0.37; // 5 legs of 0.37s => ~2.5 cycles across the remaining 1.85s
      const SUPPORT_REPEAT = 4;

      tl.to(
        support,
        { y: -3, duration: SUPPORT_LEG, ease: 'sine.inOut', yoyo: true, repeat: SUPPORT_REPEAT },
        SUPPORT_IDLE_START,
      );
      tl.to(
        support,
        { rotation: 3.4, duration: SUPPORT_LEG, ease: 'sine.inOut', yoyo: true, repeat: SUPPORT_REPEAT },
        SUPPORT_IDLE_START,
      );

      window.__timelines['05-outil4'] = tl;
