<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    var prand = function (n) {
      var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
      return x - Math.floor(x);
    };

    // ---------------- Scene 1 (0.0-1.6s): yellow wash is already on screen;
    // label-pill pops, headline fades up line by line with a soft drift, and
    // the pink corner chip punctuates the open.
    tl.fromTo(
      "#cta06-label",
      { scale: 0.6, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      0.05
    );
    tl.fromTo(
      "#cta06-chip-pink",
      { scale: 0, opacity: 0, rotation: -16 },
      { scale: 1, opacity: 1, rotation: -8, duration: 0.4, ease: "power3.out" },
      0.15
    );
    tl.fromTo(
      "#cta06-h1",
      { y: 26, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      0.2
    );
    tl.fromTo(
      "#cta06-h2",
      { y: 26, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      0.48
    );

    // ---------------- Scene 2 (1.6-2.3s): the CTA button spring-pops to
    // center with a confident overshoot, then a dot-burst fires from its
    // landing point. The green corner chip lands a beat later so Scene 2
    // keeps building rather than front-loading.
    tl.fromTo(
      "#cta06-button",
      { scale: 0.7, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" },
      1.6
    );
    tl.fromTo(
      "#cta06-chip-green",
      { scale: 0, opacity: 0, rotation: 14 },
      { scale: 1, opacity: 1, rotation: 7, duration: 0.35, ease: "power3.out" },
      1.75
    );

    // Deterministic dot-burst — fixed pool, pure ballistic function of T.
    (function () {
      var PARTICLE_COUNT = 8;
      var SIZE_MIN = 5,
        SIZE_MAX = 9;
      var SPEED_MIN = 260,
        SPEED_MAX = 480;
      var G = 60; // gentle drift, not a confetti fall
      var FLIGHT_DUR = 0.6;
      var FADE_FRAC = 0.3;
      var BURST_AT = 2.05; // the button's landing frame
      var palette = ["#000000", "#fe90e8", "#c0f7fe", "#99e885"];

      var field = document.getElementById("cta06-particle-field");
      var parts = [];
      for (var i = 0; i < PARTICLE_COUNT; i++) {
        var el = document.createElement("div");
        el.className = "cta06-particle";
        var size = SIZE_MIN + prand(i * 3 + 1) * (SIZE_MAX - SIZE_MIN);
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.style.background = palette[i % palette.length];
        field.appendChild(el);

        var angle = prand(i * 5 + 2) * Math.PI * 2; // radial burst, all directions
        var speed = SPEED_MIN + prand(i * 7 + 3) * (SPEED_MAX - SPEED_MIN);
        parts.push({
          el: el,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
        });
      }

      var drive = { T: 0 };
      tl.fromTo(
        drive,
        { T: 0 },
        {
          T: 1,
          duration: FLIGHT_DUR,
          ease: "none",
          onUpdate: function () {
            var t = drive.T * FLIGHT_DUR;
            var fade = Math.min(1, (1 - drive.T) / FADE_FRAC);
            for (var j = 0; j < parts.length; j++) {
              var p = parts[j];
              var x = p.vx * t;
              var y = p.vy * t + 0.5 * G * t * t;
              p.el.style.transform = "translate(" + x + "px, " + y + "px)";
              p.el.style.opacity = String(drive.T === 0 ? 0 : fade);
            }
          },
        },
        BURST_AT
      );
    })();

    // ---------------- Scene 3 (2.3-3.1s): the shop-now-button.jpg cursor
    // graphic (cropped to just the hand/cursor) slides in from bottom-right
    // and settles pointing at the real CTA button, as if about to click it.
    tl.fromTo(
      "#cta06-cursor",
      { x: 250, y: 180, rotation: -26, opacity: 0 },
      { x: 0, y: 0, rotation: -9, opacity: 1, duration: 0.55, ease: "power3.out" },
      2.3
    );
    tl.fromTo(
      "#cta06-star",
      { scale: 0, opacity: 0, rotation: -18 },
      { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "back.out(1.8)" },
      2.35
    );

    // ---------------- Scene 4 (3.1-6.0s): held final read. Button, cursor
    // accent and question sit still — only the cursor keeps a very subtle
    // sine-wave-loop micro-bob. This is the last frame of the video: no exit.
    (function () {
      var cursor = document.getElementById("cta06-cursor");
      var BASE_ROT = -9;
      var Y_AMP_PX = 3;
      var IDLE_START = 2.95; // settle (2.85) + ~0.1s
      var IDLE_DUR = 6.0 - IDLE_START;
      var CYCLES = IDLE_DUR / 2.5;
      var phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(phase.p);
            cursor.style.transform =
              "translate(0px, " + (s * Y_AMP_PX) + "px) rotate(" + BASE_ROT + "deg)";
          },
        },
        IDLE_START
      );
    })();

    window.__timelines["06-cta"] = tl;
  })();
</script>
