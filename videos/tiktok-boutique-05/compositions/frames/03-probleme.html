  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var bg = ".prb03-bg";
      var rect = "#prb03-rect";
      var star = "#prb03-star";
      var square = "#prb03-square";
      var counter = "#prb03-counter";
      var pill = "#prb03-pill";
      var hero = document.getElementById("prb03-hero");

      var HERO_ROT = 3;
      gsap.set(hero, { rotation: HERO_ROT });

      // ---- Scene 1 (0.0-0.5s): cream canvas wash zoom-through-cuts in
      // (Z-scale + blur + opacity, per the cut catalog). ----
      tl.fromTo(
        bg,
        { scale: 1.08, opacity: 0.5, filter: "blur(10px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power2.out" },
        0
      );
      tl.fromTo(rect, { scale: 0, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: -8, duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo(star, { scale: 0, opacity: 0, rotation: 12 }, { scale: 1, opacity: 1, rotation: 5, duration: 0.4, ease: "power3.out" }, 0.1);
      tl.fromTo(pill, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.15);

      // ---- Scene 2 (0.3-1.0s): probleme-occupee-dm.jpg spring-pops in,
      // tilted +3deg, ~72% of frame, centered. ----
      tl.fromTo(
        hero,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, rotation: HERO_ROT, duration: 0.55, ease: "power3.out" },
        0.3
      );

      // lower-corner trinkets trickle through the tail of the hero's beat,
      // never front-loaded alongside it at t=0.
      tl.fromTo(counter, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.9);
      tl.fromTo(square, { scale: 0, opacity: 0, rotation: 10 }, { scale: 1, opacity: 1, rotation: 6, duration: 0.4, ease: "power3.out" }, 1.05);

      // ---- Scene 3 (1.0-7.4s): continuous sine-wave-loop idle drift for the
      // rest of the hold. Idle window (6.4s) exceeds the 6s long-idle
      // threshold -> halved amplitude, slowed period (>=3s), and a
      // settle-and-fade tail so the frame is visibly still by the last
      // frame, ahead of the hand-off to the next scene. ----
      var TOTAL = 7.4;
      var IDLE_START = 1.0;
      var IDLE_DUR = TOTAL - IDLE_START; // 6.4s
      var FADE_FRAC = 0.2;
      var PERIOD = 3.0; // >=3s per the long-idle rule
      var CYCLES = IDLE_DUR / PERIOD; // ~2.13, within IDLE_DUR/3..IDLE_DUR/1.5
      var phase = { p: 0 };
      var Y_AMP = 1.5; // halved from the 2-3px default (long idle window)
      var ROT_AMP = 0.35;

      tl.to(
        phase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var t = phase.p / (Math.PI * 2 * CYCLES);
            var env = t < 1 - FADE_FRAC ? 1 : Math.max(0, (1 - t) / FADE_FRAC);
            var s = Math.sin(phase.p);
            var y = s * Y_AMP * env;
            var rot = HERO_ROT + Math.sin(phase.p + Math.PI / 2) * ROT_AMP * env;
            hero.style.transform = "translateY(" + y + "px) rotate(" + rot + "deg)";
          },
        },
        IDLE_START
      );

      // ---- Extra motion-design accents so no stretch of the hold ever goes
      // more than ~1.8s without a new image landing. ----
      tl.fromTo("#prb03-md1", { scale: 0, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: -4, duration: 0.4, ease: "back.out(1.8)" }, 2.8);
      tl.fromTo("#prb03-md2", { scale: 0, opacity: 0, rotation: 12 }, { scale: 1, opacity: 1, rotation: 4, duration: 0.4, ease: "back.out(1.8)" }, 4.6);
      tl.fromTo("#prb03-md3", { scale: 0, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "back.out(1.8)" }, 6.4);

      window.__timelines["03-probleme"] = tl;
    })();
  </script>
