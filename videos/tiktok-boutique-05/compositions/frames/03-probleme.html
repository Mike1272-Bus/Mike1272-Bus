  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var bg = ".prb03-bg";
      var rect = "#prb03-rect";
      var star = "#prb03-star";
      var square = "#prb03-square";
      var counter = "#prb03-counter";
      var pill = "#prb03-pill";
      var hero = document.getElementById("prb03-hero");

      var HERO_ROT = 3;
      gsap.set(hero, { rotation: HERO_ROT });

      // ---- Scene 1 (0.0-0.5s): cream canvas wash zoom-through-cuts in
      // (Z-scale + blur + opacity, per the cut catalog). ----
      tl.fromTo(
        bg,
        { scale: 1.08, opacity: 0.5, filter: "blur(10px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power2.out" },
        0
      );
      tl.fromTo(rect, { scale: 0, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: -8, duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo(star, { scale: 0, opacity: 0, rotation: 12 }, { scale: 1, opacity: 1, rotation: 5, duration: 0.4, ease: "power3.out" }, 0.1);
      tl.fromTo(pill, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.15);

      // ---- Scene 2 (0.3-1.0s): probleme-occupee-dm.jpg spring-pops in,
      // tilted +3deg, ~72% of frame, centered. ----
      tl.fromTo(
        hero,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, rotation: HERO_ROT, duration: 0.55, ease: "power3.out" },
        0.3
      );

      // lower-corner trinkets trickle through the tail of the hero's beat,
      // never front-loaded alongside it at t=0.
      tl.fromTo(counter, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.9);
      tl.fromTo(square, { scale: 0, opacity: 0, rotation: 10 }, { scale: 1, opacity: 1, rotation: 6, duration: 0.4, ease: "power3.out" }, 1.05);

      // ---- Scene 3 (1.0-1.8s): brief idle on the real photo before it hands
      // off to three big explainer beats (see below) -- keeps the real photo
      // as the establishing shot without holding it statically for 7s. ----
      var HOLD_START = 1.0;
      var HOLD_DUR = 0.8;
      var holdPhase = { p: 0 };
      tl.to(
        holdPhase,
        {
          p: Math.PI,
          duration: HOLD_DUR,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(holdPhase.p);
            hero.style.transform = "translateY(" + s * 1.5 + "px) rotate(" + HERO_ROT + "deg)";
          },
        },
        HOLD_START
      );

      // ---- Scene 4 (1.8-7.4s): three big, full-scale explainer cards
      // succeed each other -- each a distinct, explicit beat of "occupe,
      // le temps file, il s'en va" -- rather than one static photo held
      // the whole time. Real photo fades/scales out as the first card
      // lands so nothing overlaps. ----
      var big1 = "#prb03-big1";
      var big2 = "#prb03-big2";
      var big3 = "#prb03-big3";

      tl.to(hero, { scale: 0.85, opacity: 0, duration: 0.35, ease: "power2.in" }, 1.75);

      tl.fromTo(big1, { scale: 0.7, opacity: 0, rotation: -3 }, { scale: 1, opacity: 1, rotation: -1.5, duration: 0.45, ease: "back.out(1.6)" }, 1.9);
      tl.to(big1, { scale: 0.85, opacity: 0, duration: 0.3, ease: "power2.in" }, 3.55);

      tl.fromTo(big2, { scale: 0.7, opacity: 0, rotation: 3 }, { scale: 1, opacity: 1, rotation: 1.5, duration: 0.45, ease: "back.out(1.6)" }, 3.85);
      tl.to(big2, { scale: 0.85, opacity: 0, duration: 0.3, ease: "power2.in" }, 5.5);

      tl.fromTo(big3, { scale: 0.7, opacity: 0, rotation: -3 }, { scale: 1, opacity: 1, rotation: -1.5, duration: 0.45, ease: "back.out(1.6)" }, 5.8);
      // big3 holds to the frame's own end (7.4-7.9) -- no exit needed, the
      // frame transition-out handles the hand-off to Frame 4.

      window.__timelines["03-probleme"] = tl;
    })();
