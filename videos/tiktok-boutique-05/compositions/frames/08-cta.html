  <div class="clip ct08-md-badge" id="ct08-md1" data-start="0" data-duration="3.2" data-track-index="7">

  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var prand = function (n) {
        var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };

      var bg = document.querySelector(".ct08-bg");
      var dotgrid = document.querySelector(".ct08-dotgrid");
      var decoRect = document.getElementById("ct08-deco-rect");
      var decoStar = document.getElementById("ct08-deco-star");
      var dotDeco = document.getElementById("ct08-dot-deco");
      var label = document.getElementById("ct08-label");
      var sticker = document.getElementById("ct08-sticker");

      // ---- deterministic initial states ----
      gsap.set([bg, dotgrid], { scale: 1.15, filter: "blur(12px)", transformOrigin: "50% 50%" });
      gsap.set(decoRect, { scale: 0, opacity: 0, rotation: 14 });
      gsap.set(decoStar, { scale: 0, opacity: 0, rotation: -16 });
      gsap.set(dotDeco, { scale: 0, opacity: 0 });
      gsap.set(label, { scale: 0.5, opacity: 0 });
      gsap.set(sticker, { scale: 0.7, opacity: 0, rotation: -14 });

      // ---------------- Scene 1 (0.0-0.5s): pink/yellow split wash zoom-through-cuts in ----------------
      tl.fromTo(
        [bg, dotgrid],
        { scale: 1.15, filter: "blur(12px)" },
        { scale: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" },
        0
      );
      tl.to(decoStar, { scale: 1, opacity: 1, rotation: -8, duration: 0.3, ease: "power3.out" }, 0.05);
      tl.to(decoRect, { scale: 1, opacity: 1, rotation: 8, duration: 0.3, ease: "power3.out" }, 0.15);
      tl.to(dotDeco, { scale: 1, opacity: 1, duration: 0.28, ease: "power3.out" }, 0.2);
      tl.to(label, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.15);

      // ---------------- Scene 2 (0.3-1.0s): CTA sticker spring-pops to center with overshoot ----------------
      var STICKER_START = 0.3;
      var STICKER_DUR = 0.55;
      tl.to(
        sticker,
        { scale: 1, opacity: 1, rotation: -2, duration: STICKER_DUR, ease: "back.out(1.8)" },
        STICKER_START
      );

      // particle-burst fires on the sticker's landing frame — deterministic dot burst,
      // fixed pool, pure ballistic function of T, z-indexed behind the sticker.
      (function () {
        var PARTICLE_COUNT = 8;
        var SIZE_MIN = 5, SIZE_MAX = 9;
        var SPEED_MIN = 230, SPEED_MAX = 420;
        var G = 40; // near-zero: radial dot drift, not confetti fall
        var FLIGHT_DUR = 0.6;
        var FADE_FRAC = 0.3;
        var BURST_AT = STICKER_START + STICKER_DUR - 0.02; // the sticker's landing frame

        var palette = ["var(--black)", "var(--pink)", "var(--blue)", "var(--green)", "var(--yellow)"];
        var field = document.getElementById("ct08-particle-field");
        var parts = [];
        for (var i = 0; i < PARTICLE_COUNT; i++) {
          var el = document.createElement("div");
          el.className = "ct08-particle";
          var size = SIZE_MIN + prand(i * 3 + 1) * (SIZE_MAX - SIZE_MIN);
          el.style.width = size + "px";
          el.style.height = size + "px";
          el.style.background = palette[i % palette.length];
          field.appendChild(el);

          var angle = prand(i * 5 + 2) * Math.PI * 2; // radial burst, all directions
          var speed = SPEED_MIN + prand(i * 7 + 3) * (SPEED_MAX - SPEED_MIN);
          parts.push({
            el: el,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
          });
        }

        var drive = { T: 0 };
        tl.fromTo(
          drive,
          { T: 0 },
          {
            T: 1,
            duration: FLIGHT_DUR,
            ease: "none",
            onUpdate: function () {
              var t = drive.T * FLIGHT_DUR;
              var fade = Math.min(1, (1 - drive.T) / FADE_FRAC);
              for (var j = 0; j < parts.length; j++) {
                var p = parts[j];
                var x = p.vx * t;
                var y = p.vy * t + 0.5 * G * t * t;
                p.el.style.transform = "translate(" + x + "px, " + y + "px)";
                p.el.style.opacity = String(drive.T === 0 ? 0 : fade);
              }
            },
          },
          BURST_AT
        );
      })();

      // ---------------- Scene 3 (1.0-3.2s): held final read — subtle micro-bob only ----------------
      // Final frame of the video: no exit tween, a quiet settle/hold is the correct close.
      (function () {
        var TOTAL = 3.2;
        var IDLE_START = 1.0;
        var IDLE_DUR = TOTAL - IDLE_START; // 2.2s
        var PERIOD = 2.1;
        var CYCLES = IDLE_DUR / PERIOD;
        var Y_AMP = 1.3;
        var ROT_AMP = 0.35;
        var BASE_ROT = -2;
        var phase = { p: 0 };

        tl.to(
          phase,
          {
            p: Math.PI * 2 * CYCLES,
            duration: IDLE_DUR,
            ease: "none",
            onUpdate: function () {
              var s = Math.sin(phase.p);
              var y = s * Y_AMP;
              var rot = BASE_ROT + Math.sin(phase.p + Math.PI / 2) * ROT_AMP;
              sticker.style.transform = "translateY(" + y + "px) rotate(" + rot + "deg) scale(1)";
            },
          },
          IDLE_START
        );
      })();

      // Extra motion-design accent (arrow pointing up toward the bio) so the
      // hold never goes more than ~1.8s without a new image landing.

        "#ct08-md1",
        { scale: 0, opacity: 0, rotation: -10 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "back.out(1.8)" },
        2.8
      );

      window.__timelines["08-cta"] = tl;
    })();
  </script>
