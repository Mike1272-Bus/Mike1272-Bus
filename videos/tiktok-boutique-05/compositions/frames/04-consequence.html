    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene 3 (1.1-BOT_START): top card idles alone while the scene holds on it --
    // the bottom card intentionally does NOT land yet (per the "second image lands
    // late" rule: images must not both arrive within the first 1-2s of the scene).
    const TOTAL = 9;
    const IDLE_START = 1.1;
    const IDLE_DUR = TOTAL - IDLE_START;

    const topPhase = { p: 0 };

      topPhase,
      {
        p: Math.PI * 2 * TOP_CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: () => {
          const t = topPhase.p / (Math.PI * 2 * TOP_CYCLES);
          const env = t < 0.85 ? 1 : Math.max(0, (1 - t) / 0.15);
          const s = Math.sin(topPhase.p);
          const card = document.querySelector(".c4-card-top");
          if (card) {
            card.style.transform = `translateY(${s * 1.5 * env}px) scale(${1 + s * 0.006 * env}) rotate(-2deg)`;

      },

        duration: BOT_IDLE_DUR,

      BOT_IDLE_START,
