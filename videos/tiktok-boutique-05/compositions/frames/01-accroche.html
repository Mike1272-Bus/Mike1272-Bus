<template>
  <style>
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --f-display: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      --black: #000000;
      --white: #ffffff;
      --offwhite: #fffdf5;
      --blue: #c0f7fe;
      --pink: #fe90e8;
      --yellow: #f7cb46;
      --cream: #ffdc8b;
      --green: #99e885;
    }
    #root * { box-sizing: border-box; }

    /* ---- full-bleed ground (own clip layer, never on #root) ---- */
    .acc01-bg {
      position: absolute;
      inset: 0;
      background-color: var(--blue);
      will-change: transform, filter, opacity;
    }
    .acc01-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0, 0, 0, 0.1) 1.2px, transparent 1.6px);
      background-size: 24px 24px;
      opacity: 0.55;
    }

    /* ---- decorations nested in the ground: no separate clip/track needed ---- */
    .acc01-star-wrap {
      position: absolute;
      top: 70px;
      right: 60px;
      width: 140px;
      height: 140px;
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .acc01-star-outer,
    .acc01-star-inner {
      position: absolute;
      clip-path: polygon(
        50% 0%, 61.8% 35.3%, 97.6% 35.3%, 68.8% 57.4%, 79.4% 91.8%,
        50% 70.5%, 20.6% 91.8%, 31.2% 57.4%, 2.4% 35.3%, 38.2% 35.3%
      );
    }
    .acc01-star-outer { inset: 0; background: var(--black); }
    .acc01-star-inner { inset: 9%; background: var(--pink); }

    .acc01-square {
      position: absolute;
      left: 70px;
      top: 1310px;
      width: 100px;
      height: 100px;
      background: var(--cream);
      border: 3px solid var(--black);
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .acc01-counter {
      position: absolute;
      left: 190px;
      top: 1300px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--white);
      border: 3px solid var(--black);
      box-shadow: 4px 4px 0 var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--f-display);
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.05em;
      color: var(--black);
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    /* ---- label-pill: opens the region ---- */
    .acc01-pill-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 90px;
    }
    .acc01-pill {
      font-family: var(--f-display);
      font-weight: 900;
      font-size: 34px;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: var(--black);
      background: var(--yellow);
      border: 4px solid var(--black);
      box-shadow: 8px 8px 0 var(--black);
      border-radius: 9999px;
      padding: 18px 40px;
      white-space: nowrap;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    /* ---- hero photo card ---- */
    .acc01-hero-card {
      position: absolute;
      left: 110px;
      top: 430px;
      width: 860px;
      height: 640px;
      background: var(--white);
      border: 4px solid var(--black);
      box-shadow: 8px 8px 0 var(--black);
      padding: 14px;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .acc01-hero-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--offwhite);
    }

    /* ---- secondary doodle accent card ---- */
    .acc01-doodle-card {
      position: absolute;
      right: 70px;
      top: 1140px;
      width: 300px;
      height: 260px;
      background: var(--white);
      border: 3px solid var(--black);
      box-shadow: 4px 4px 0 var(--black);
      padding: 10px;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .acc01-doodle-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--offwhite);
    }
  </style>

  <div id="root" data-composition-id="01-accroche" data-duration="7.5" data-width="1080" data-height="1920">
    <div class="acc01-bg clip" data-start="0" data-duration="7.5" data-track-index="0">
      <div class="acc01-star-wrap" id="acc01-star">
        <div class="acc01-star-outer"></div>
        <div class="acc01-star-inner"></div>
      </div>
      <div class="acc01-square" id="acc01-square"></div>
      <div class="acc01-counter" id="acc01-counter">01</div>
    </div>

    <div class="acc01-pill-wrap clip" data-start="0" data-duration="7.5" data-track-index="1">
      <div class="acc01-pill" id="acc01-pill">WHATSAPP</div>
    </div>

    <div class="acc01-hero-card clip" data-start="0" data-duration="7.5" data-track-index="2" id="acc01-hero">
      <img class="acc01-hero-img" src="assets/accroche-whatsapp-phone.jpg" alt="" />
    </div>

    <div class="acc01-doodle-card clip" data-start="0" data-duration="7.5" data-track-index="3" id="acc01-doodle">
      <img class="acc01-doodle-img" src="assets/accroche-business-doodle.jpg" alt="" />
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var bg = ".acc01-bg";
      var star = "#acc01-star";
      var square = "#acc01-square";
      var counter = "#acc01-counter";
      var pill = "#acc01-pill";
      var hero = document.getElementById("acc01-hero");
      var doodle = document.getElementById("acc01-doodle");

      var HERO_ROT = -2;
      var DOODLE_ROT = 5;

      gsap.set(hero, { rotation: HERO_ROT });
      gsap.set(doodle, { rotation: DOODLE_ROT });

      // ---- Scene 1 (0.0-0.5s): blue wash zoom-through-cuts in (Z-scale +
      // blur + opacity, per the cut catalog). ----
      tl.fromTo(
        bg,
        { scale: 1.08, opacity: 0.5, filter: "blur(10px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power2.out" },
        0
      );
      tl.fromTo(star, { scale: 0, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: -6, duration: 0.4, ease: "power3.out" }, 0.05);
      tl.fromTo(pill, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.12);

      // ---- Scene 2 (0.3-1.0s): accroche-whatsapp-phone.jpg spring-pops in
      // large, tilted -2deg, ~75% of frame, centered. ----
      tl.fromTo(
        hero,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, rotation: HERO_ROT, duration: 0.55, ease: "power3.out" },
        0.3
      );

      // small ground trinkets trickle through the tail of the hero's beat,
      // never front-loaded alongside it at t=0.
      tl.fromTo(square, { scale: 0, opacity: 0, rotation: 10 }, { scale: 1, opacity: 1, rotation: 6, duration: 0.4, ease: "power3.out" }, 0.65);
      tl.fromTo(counter, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.85);

      // ---- Scene 3 (1.0-1.7s): accroche-business-doodle.jpg spring-pops in
      // small, corner accent, tilted +5deg. ----
      tl.fromTo(
        doodle,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, rotation: DOODLE_ROT, duration: 0.5, ease: "power3.out" },
        1.0
      );

      // ---- Scene 4 (1.7-7.0s): continuous sine-wave-loop idle drift on both
      // for the rest of the hold. Idle window (5.3s) is ~76% of the 7.0s
      // duration -> halved amplitude, slowed period, settle-and-fade tail so
      // the frame is visibly still by the last frame. ----
      var TOTAL = 7.0;
      var IDLE_START = 1.7;
      var IDLE_DUR = TOTAL - IDLE_START; // 5.3s
      var FADE_FRAC = 0.2;

      var heroPeriod = 2.8;
      var heroCycles = IDLE_DUR / heroPeriod;
      var heroPhase = { p: 0 };
      var HERO_Y_AMP = 1.3;
      var HERO_ROT_AMP = 0.3;

      tl.to(
        heroPhase,
        {
          p: Math.PI * 2 * heroCycles,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var t = heroPhase.p / (Math.PI * 2 * heroCycles);
            var env = t < 1 - FADE_FRAC ? 1 : Math.max(0, (1 - t) / FADE_FRAC);
            var s = Math.sin(heroPhase.p);
            var y = s * HERO_Y_AMP * env;
            var rot = HERO_ROT + Math.sin(heroPhase.p + Math.PI / 2) * HERO_ROT_AMP * env;
            hero.style.transform = "translateY(" + y + "px) rotate(" + rot + "deg)";
          },
        },
        IDLE_START
      );

      var doodlePeriod = 2.5; // different from hero -> independent phase, not synced
      var doodleCycles = IDLE_DUR / doodlePeriod;
      var doodlePhase = { p: 0 };
      var DOODLE_Y_AMP = 1.6;
      var DOODLE_ROT_AMP = 0.4;

      tl.to(
        doodlePhase,
        {
          p: Math.PI * 2 * doodleCycles,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var t = doodlePhase.p / (Math.PI * 2 * doodleCycles);
            var env = t < 1 - FADE_FRAC ? 1 : Math.max(0, (1 - t) / FADE_FRAC);
            var s = Math.sin(doodlePhase.p + Math.PI / 2);
            var y = s * DOODLE_Y_AMP * env;
            var rot = DOODLE_ROT + Math.sin(doodlePhase.p) * DOODLE_ROT_AMP * env;
            doodle.style.transform = "translateY(" + y + "px) rotate(" + rot + "deg)";
          },
        },
        IDLE_START
      );

      window.__timelines["01-accroche"] = tl;
    })();
  </script>
</template>
