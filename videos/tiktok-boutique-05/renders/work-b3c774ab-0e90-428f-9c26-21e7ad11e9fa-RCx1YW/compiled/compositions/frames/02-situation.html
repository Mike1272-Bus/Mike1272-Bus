<template>
  <style>
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --f-display: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      --black: #000000;
      --white: #ffffff;
      --offwhite: #fffdf5;
      --blue: #c0f7fe;
      --pink: #fe90e8;
      --yellow: #f7cb46;
      --cream: #ffdc8b;
      --green: #99e885;
    }
    #root * { box-sizing: border-box; }

    /* ---- full-bleed ground (own clip layer, never on #root) ---- */
    .sit02-bg {
      position: absolute;
      inset: 0;
      background-color: var(--pink);
      will-change: transform;
    }
    .sit02-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0, 0, 0, 0.1) 1.2px, transparent 1.6px);
      background-size: 24px 24px;
      opacity: 0.5;
    }

    /* ---- decorations nested in the ground: no separate clip/track needed ---- */
    .sit02-rect {
      position: absolute;
      left: -36px;
      top: -18px;
      width: 150px;
      height: 96px;
      background: var(--blue);
      border: 3px solid var(--black);
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .sit02-star-wrap {
      position: absolute;
      top: 60px;
      right: 56px;
      width: 130px;
      height: 130px;
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .sit02-star-outer,
    .sit02-star-inner {
      position: absolute;
      clip-path: polygon(
        50% 0%, 61.8% 35.3%, 97.6% 35.3%, 68.8% 57.4%, 79.4% 91.8%,
        50% 70.5%, 20.6% 91.8%, 31.2% 57.4%, 2.4% 35.3%, 38.2% 35.3%
      );
    }
    .sit02-star-outer { inset: 0; background: var(--black); }
    .sit02-star-inner { inset: 9%; background: var(--yellow); }

    /* counter badge lives in the fixed gap between the two cards */
    .sit02-counter {
      position: absolute;
      left: 495px;
      top: 865px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--white);
      border: 3px solid var(--black);
      box-shadow: 4px 4px 0 var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--f-display);
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.05em;
      color: var(--black);
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    /* ---- label-pill: opens the region ---- */
    .sit02-pill-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 40px;
    }
    .sit02-pill {
      font-family: var(--f-display);
      font-weight: 900;
      font-size: 30px;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: var(--black);
      background: var(--green);
      border: 4px solid var(--black);
      box-shadow: 8px 8px 0 var(--black);
      border-radius: 9999px;
      padding: 16px 36px;
      white-space: nowrap;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    /* ---- image cards (top / bottom, never overlapping — 140px gap) ---- */
    .sit02-card {
      position: absolute;
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .sit02-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--white);
      border: 4px solid var(--black);
      box-shadow: 8px 8px 0 var(--black);
      padding: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sit02-card-inner img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--offwhite);
      display: block;
    }
    .sit02-tab {
      position: absolute;
      top: -14px;
      left: 34px;
      width: 32px;
      height: 32px;
      border: 3px solid var(--black);
      z-index: 1;
    }
    .sit02-card--top {
      left: 90px;
      top: 120px;
      width: 900px;
      height: 720px;
    }
    .sit02-card--bottom {
      left: 90px;
      top: 980px;
      width: 900px;
      height: 610px;
    }
  </style>

  <div id="root" data-composition-id="02-situation" data-duration="7.2" data-width="1080" data-height="1920">
    <div class="sit02-bg clip" data-start="0" data-duration="7.2" data-track-index="0">
      <div class="sit02-rect" id="sit02-rect"></div>
      <div class="sit02-star-wrap" id="sit02-star">
        <div class="sit02-star-outer"></div>
        <div class="sit02-star-inner"></div>
      </div>
      <div class="sit02-counter" id="sit02-counter">02</div>
    </div>

    <div class="sit02-pill-wrap clip" data-start="0" data-duration="7.2" data-track-index="1">
      <div class="sit02-pill" id="sit02-pill">LA PREUVE</div>
    </div>

    <div class="sit02-card sit02-card--top clip" data-start="0" data-duration="7.2" data-track-index="2" id="sit02-top">
      <div class="sit02-tab" style="background: var(--blue);"></div>
      <div class="sit02-card-inner">
        <img src="assets/situation-client-demande.png" alt="" />
      </div>
    </div>

    <div class="sit02-card sit02-card--bottom clip" data-start="0" data-duration="7.2" data-track-index="3" id="sit02-bottom">
      <div class="sit02-tab" style="background: var(--yellow);"></div>
      <div class="sit02-card-inner">
        <img src="assets/situation-client-parti.png" alt="" />
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var bg = ".sit02-bg";
      var rect = "#sit02-rect";
      var star = "#sit02-star";
      var counter = "#sit02-counter";
      var pill = "#sit02-pill";
      var topCard = document.getElementById("sit02-top");
      var bottomCard = document.getElementById("sit02-bottom");

      var TOP_ROT = -2;
      var BOTTOM_ROT = 2;

      // ---- Scene 1 (0.0-0.5s): pink canvas wash push-slides in from the right. ----
      tl.fromTo(bg, { xPercent: 100 }, { xPercent: 0, duration: 0.5, ease: "power2.out" }, 0);

      // ambient decorations settle in alongside the wash
      tl.fromTo(rect, { scale: 0, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: -8, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo(star, { scale: 0, opacity: 0, rotation: 12 }, { scale: 1, opacity: 1, rotation: 5, duration: 0.4, ease: "power3.out" }, 0.15);
      tl.fromTo(pill, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.15);

      // ---- Scene 2 (0.3-1.0s): situation-client-demande.png spring-pops in
      // from above, settling in the TOP half (~44% height, tilted -2deg). ----
      tl.fromTo(
        topCard,
        { scale: 0, opacity: 0, y: -460, rotation: -9 },
        { scale: 1, opacity: 1, y: 0, rotation: TOP_ROT, duration: 0.55, ease: "power3.out" },
        0.3
      );

      // ---- Scene 3 (1.0-1.7s): situation-client-parti.png spring-pops in
      // from below, settling in the BOTTOM half (~44% height, tilted +2deg) —
      // clear vertical gap preserved, neither card ever crosses the other's half. ----
      tl.fromTo(
        bottomCard,
        { scale: 0, opacity: 0, y: 460, rotation: 9 },
        { scale: 1, opacity: 1, y: 0, rotation: BOTTOM_ROT, duration: 0.55, ease: "power3.out" },
        1.0
      );

      // counter chip settles into the gap once both cards have landed
      tl.fromTo(counter, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, 1.55);

      // ---- Scene 4 (1.7-6.8s): both cards keep independent-phase
      // sine-wave-loop idle drift for the rest of the hold. Idle window
      // (5.1s) is ~75% of the 6.8s duration -> halved amplitude, slowed
      // period, settle-and-fade tail, and the two cards run different
      // periods with a quarter-cycle phase offset so they never move in
      // lockstep and never approach each other's half. ----
      var TOTAL = 6.8;
      var IDLE_START = 1.7;
      var IDLE_DUR = TOTAL - IDLE_START; // 5.1s
      var FADE_FRAC = 0.2;

      var topPeriod = 2.9;
      var topCycles = IDLE_DUR / topPeriod;
      var topPhase = { p: 0 };
      var TOP_Y_AMP = 1.2;
      var TOP_ROT_AMP = 0.3;

      tl.to(
        topPhase,
        {
          p: Math.PI * 2 * topCycles,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var t = topPhase.p / (Math.PI * 2 * topCycles);
            var env = t < 1 - FADE_FRAC ? 1 : Math.max(0, (1 - t) / FADE_FRAC);
            var s = Math.sin(topPhase.p);
            var y = s * TOP_Y_AMP * env;
            var rot = TOP_ROT + Math.sin(topPhase.p + Math.PI / 2) * TOP_ROT_AMP * env;
            topCard.style.transform = "translateY(" + y + "px) rotate(" + rot + "deg)";
          },
        },
        IDLE_START
      );

      var bottomPeriod = 2.6; // independent from the top card's period
      var bottomCycles = IDLE_DUR / bottomPeriod;
      var bottomPhase = { p: 0 };
      var BOTTOM_Y_AMP = 1.0;
      var BOTTOM_ROT_AMP = 0.3;

      tl.to(
        bottomPhase,
        {
          p: Math.PI * 2 * bottomCycles,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var t = bottomPhase.p / (Math.PI * 2 * bottomCycles);
            var env = t < 1 - FADE_FRAC ? 1 : Math.max(0, (1 - t) / FADE_FRAC);
            var s = Math.sin(bottomPhase.p + Math.PI / 2); // offset phase vs top card
            var y = s * BOTTOM_Y_AMP * env;
            var rot = BOTTOM_ROT + Math.sin(bottomPhase.p) * BOTTOM_ROT_AMP * env;
            bottomCard.style.transform = "translateY(" + y + "px) rotate(" + rot + "deg)";
          },
        },
        IDLE_START
      );

      window.__timelines["02-situation"] = tl;
    })();
  </script>
</template>
