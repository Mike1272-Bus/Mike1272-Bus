    <div class="c6-dotgrid clip" data-start="0" data-duration="9.2" data-track-index="1"></div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene 1 (0-0.5s): blue canvas wash push-slides in from the right.
    tl.fromTo(
      ".c6-bg, .c6-dotgrid",
      { xPercent: 35, opacity: 0 },
      { xPercent: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
      0,
    );

    // ambient decorations settle in alongside the wash
    tl.fromTo(
      ".c6-star",
      { scale: 0, opacity: 0, rotation: 10 },
      { scale: 1, opacity: 1, rotation: 10, duration: 0.45, ease: "power3.out" },
      0.1,
    );
    tl.fromTo(
      ".c6-tilt",
      { scale: 0, opacity: 0, rotation: -7 },
      { scale: 1, opacity: 1, rotation: -7, duration: 0.4, ease: "power3.out" },
      0.15,
    );
    tl.fromTo(
      ".c6-stripe",
      { scale: 0, opacity: 0, rotation: -5 },
      { scale: 1, opacity: 1, rotation: -5, duration: 0.45, ease: "power3.out" },
      0.18,
    );
    tl.fromTo(
      ".c6-dot-deco",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      0.2,
    );
    tl.fromTo(
      ".c6-label",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      0.12,
    );

    // Scene 2 (0.3-1.0s): solution-boutique-illustration.jpg spring-pops in, tilted -3deg, ~72%
    // of frame, centered.
    tl.fromTo(
      ".c6-hero-wrap",
      { scale: 0, opacity: 0, rotation: -3 },
      { scale: 1, opacity: 1, rotation: -3, duration: 0.7, ease: "power3.out" },
      0.3,
    );

    // Scene 3 (1.0-8.8s): continuous sine-wave-loop idle drift for the rest of the hold. Idle
    // window (~7.7s of 8.8s) exceeds the 6s long-idle threshold -> halved amplitude, slowed
    // period, and a settle-and-fade tail so the hero is visibly still before hand-off.
    const TOTAL = 8.8;
    const IDLE_START = 1.1;
    const IDLE_DUR = TOTAL - IDLE_START; // 7.7s
    const CYCLES = 2.6; // period ~3s
    const phase = { p: 0 };
    tl.to(
      phase,
      {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: () => {
          const t = phase.p / (Math.PI * 2 * CYCLES);
          const env = t < 0.8 ? 1 : Math.max(0, (1 - t) / 0.2);
          const s = Math.sin(phase.p);
          const hero = document.querySelector(".c6-hero-wrap");
          if (hero) {
            hero.style.transform = `translateY(${s * 1.5 * env}px) scale(${1 + s * 0.006 * env}) rotate(-3deg)`;
          }
        },
      },
      IDLE_START,
    );

    window.__timelines["06-solution"] = tl;
  </script>
