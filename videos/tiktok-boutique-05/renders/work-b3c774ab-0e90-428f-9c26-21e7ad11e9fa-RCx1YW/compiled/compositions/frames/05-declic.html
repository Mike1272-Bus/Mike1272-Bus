  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene 1 (0-0.5s): green canvas wash zoom-through-cuts in (Z-scale + blur + opacity).
    tl.fromTo(
      ".c5-bg, .c5-dotgrid",
      { scale: 1.35, opacity: 0, filter: "blur(10px)" },
      { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out" },
      0,
    );

    // ambient decorations settle in alongside the wash
    tl.fromTo(
      ".c5-star",
      { scale: 0, opacity: 0, rotation: -10 },
      { scale: 1, opacity: 1, rotation: -10, duration: 0.45, ease: "power3.out" },
      0.1,
    );
    tl.fromTo(
      ".c5-stripe",
      { scale: 0, opacity: 0, rotation: 6 },
      { scale: 1, opacity: 1, rotation: 6, duration: 0.45, ease: "power3.out" },
      0.15,
    );
    tl.fromTo(
      ".c5-dot-deco",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      0.18,
    );
    tl.fromTo(
      ".c5-label",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      0.12,
    );
    tl.fromTo(
      ".c5-tilt",
      { scale: 0, opacity: 0, rotation: 8 },
      { scale: 1, opacity: 1, rotation: 8, duration: 0.4, ease: "power3.out" },
      0.2,
    );

    // Scene 2 (0.3-1.0s): declic-sablier.png spring-pops in, centered, tilted -2deg, ~68% of
    // frame -- a clean reveal beat, no collage.
    tl.fromTo(
      ".c5-hero-wrap",
      { scale: 0, opacity: 0, rotation: -2 },
      { scale: 1, opacity: 1, rotation: -2, duration: 0.7, ease: "power3.out" },
      0.3,
    );

    // Scene 3 (1.0-5.2s): continuous sine-wave-loop idle drift (small, steady) for the rest of
    // the hold. Idle window (~4.1s) is ~79% of the 5.2s duration -> halved amplitude and a
    // slowed period per the long-idle rule.
    const TOTAL = 5.2;
    const IDLE_START = 1.1;
    const IDLE_DUR = TOTAL - IDLE_START; // 4.1s
    const CYCLES = 1.5; // period ~2.7s
    const phase = { p: 0 };
    tl.to(
      phase,
      {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: () => {
          const s = Math.sin(phase.p);
          const hero = document.querySelector(".c5-hero-wrap");
          if (hero) {
            hero.style.transform = `translateY(${s * 1.5}px) scale(${1 + s * 0.006}) rotate(-2deg)`;
          }
        },
      },
      IDLE_START,
    );

    window.__timelines["05-declic"] = tl;
  </script>
