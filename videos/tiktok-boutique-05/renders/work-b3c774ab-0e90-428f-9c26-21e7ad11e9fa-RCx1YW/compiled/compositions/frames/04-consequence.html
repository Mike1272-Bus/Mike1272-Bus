  <div id="root" data-composition-id="04-consequence" data-duration="9.4" data-width="1080" data-height="1920">

    <div class="c4-stripe clip" data-start="0" data-duration="9.4" data-track-index="2"></div>
    <div class="c4-star clip" data-start="0" data-duration="9.4" data-track-index="3"></div>

    <div class="c4-card c4-card-bottom clip" data-start="0" data-duration="9.4" data-track-index="7">
      <img src="assets/consequence-femme-bureau.jpg" alt="" />
      <div class="c4-tag">Journee normale</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene 1 (0-0.5s): yellow canvas wash push-slides in from the right.
    tl.fromTo(
      ".c4-bg, .c4-dotgrid",
      { xPercent: 35, opacity: 0 },
      { xPercent: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
      0,
    );

    // ambient decorations settle in alongside the wash
    tl.fromTo(
      ".c4-stripe",
      { scale: 0, opacity: 0, rotation: -6 },
      { scale: 1, opacity: 1, rotation: -6, duration: 0.45, ease: "power3.out" },
      0.1,
    );
    tl.fromTo(
      ".c4-star",
      { scale: 0, opacity: 0, rotation: 8 },
      { scale: 1, opacity: 1, rotation: 8, duration: 0.45, ease: "power3.out" },
      0.15,
    );
    tl.fromTo(
      ".c4-dot-deco",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      0.18,
    );
    tl.fromTo(
      ".c4-label",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      0.12,
    );

    // Scene 2 (0.3-1.0s): consequence-notif-badge.jpg spring-pops in from above, settling in the
    // TOP half (~44% height), tilted -2deg.
    tl.fromTo(
      ".c4-card-top",
      { scale: 0, opacity: 0, y: -520, rotation: -2 },
      { scale: 1, opacity: 1, y: 0, rotation: -2, duration: 0.7, ease: "power3.out" },
      0.3,
    );

    // Scene 3 (1.0-1.7s): consequence-femme-bureau.jpg spring-pops in from below, settling in the
    // BOTTOM half (~44% height), tilted +2deg -- clear vertical gap preserved (top card bottom
    // 790px, bottom card top 970px -> 180px gap, both fully visible, never overlapping).
    tl.fromTo(
      ".c4-card-bottom",
      { scale: 0, opacity: 0, y: 520, rotation: 2 },
      { scale: 1, opacity: 1, y: 0, rotation: 2, duration: 0.7, ease: "power3.out" },
      1.0,
    );

    // Scene 4 (1.7-9.0s): both cards keep independent-phase sine-wave-loop idle drift for the
    // rest of the hold. Idle window (~7.2s of 9s) is a large share of the duration -> halved
    // amplitude, slowed period, settle-and-fade tail so both cards are visibly still before the
    // hand-off. Distinct CYCLES + a sin-argument offset on the bottom card keep the two phases
    // independent so they never drift toward each other's half.
    const TOTAL = 9;
    const IDLE_START = 1.8;
    const IDLE_DUR = TOTAL - IDLE_START; // 7.2s

    const topPhase = { p: 0 };
    const TOP_CYCLES = 2.4; // period ~3s
    tl.to(
      topPhase,
      {
        p: Math.PI * 2 * TOP_CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: () => {
          const t = topPhase.p / (Math.PI * 2 * TOP_CYCLES);
          const env = t < 0.8 ? 1 : Math.max(0, (1 - t) / 0.2);
          const s = Math.sin(topPhase.p);
          const card = document.querySelector(".c4-card-top");
          if (card) {
            card.style.transform = `translateY(${s * 1.5 * env}px) scale(${1 + s * 0.006 * env}) rotate(-2deg)`;
          }
        },
      },
      IDLE_START,
    );

    const botPhase = { p: 0 };
    const BOT_CYCLES = 2.1; // period ~3.4s -- independent frequency from the top card
    const BOT_OFFSET = Math.PI / 3; // independent phase -- desynced from the top card's beat
    tl.to(
      botPhase,
      {
        p: Math.PI * 2 * BOT_CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: () => {
          const t = botPhase.p / (Math.PI * 2 * BOT_CYCLES);
          const env = t < 0.8 ? 1 : Math.max(0, (1 - t) / 0.2);
          const s = Math.sin(botPhase.p + BOT_OFFSET);
          const card = document.querySelector(".c4-card-bottom");
          if (card) {
            card.style.transform = `translateY(${s * 1.5 * env}px) scale(${1 + s * 0.006 * env}) rotate(2deg)`;
          }
        },
      },
      IDLE_START,
    );

    window.__timelines["04-consequence"] = tl;
  </script>
