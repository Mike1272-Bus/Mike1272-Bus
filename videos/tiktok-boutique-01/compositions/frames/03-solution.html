  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const textEl = document.getElementById("03-solution-text");
      const cursorEl = document.getElementById("03-solution-cursor");
      const typedInner = document.getElementById("03-solution-typed-inner");
      const dotgrid = document.getElementById("03-solution-dotgrid");
      const tiltDeco = document.getElementById("03-solution-tilt");
      const card = document.getElementById("03-solution-card");
      const cardText = document.getElementById("03-solution-card-text");
      const glow = document.getElementById("03-solution-glow");

      // Scene 1 (0.0-2.2s): live type-on of the pain-point line, smooth character slice.
      const FULL_TEXT = "ET SI TA BOUTIQUE ETAIT PRETE... EN QUELQUES JOURS ?";
      const typeDriver = { i: 0 };
      tl.to(
        typeDriver,
        {
          i: FULL_TEXT.length,
          duration: 1.6,
          ease: "power1.inOut",
          onUpdate: () => {
            textEl.textContent = FULL_TEXT.substring(0, Math.floor(typeDriver.i));
          },
        },
        0
      );

      // Deterministic sin-wave cursor blink, 4 whole cycles across the 2.2s the line is on screen.
      const blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * 4,
          duration: 2.2,
          ease: "none",
          onUpdate: () => {
            cursorEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        0
      );

      // Ambient decorations settle in early (not part of the reveal narrative).
      tl.fromTo(dotgrid, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0);
      tl.fromTo(tiltDeco, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0);

      // Scene 2 (2.2-3.4s): the typed line collapses (scale-down + fade) toward the
      // point where the payoff card will appear -- transform-origin is fixed at that
      // shared point so the shrink reads as "collapsing toward center".
      tl.to(
        typedInner,
        {
          scale: 0,
          opacity: 0,
          duration: 0.5,
          ease: "power2.in",
        },
        2.2
      );

      // Scene 3 (3.4-6.0s): the payoff card spring-pops from the collapse point,
      // overlapping the tail of the collapse (scale-swap-transition pairing) and
      // landing just ahead of the Scene 3 boundary.
      tl.fromTo(
        card,
        { scale: 0.7, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.4)" },
        2.55
      );

      // Inner card copy reveals once the card has settled.
      tl.fromTo(
        cardText,
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        3.55
      );

      // Blue border-glow blooms outward and persists to the end (climax dwell).
      tl.fromTo(
        glow,
        { opacity: 0, scale: 0.85 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" },
        4.1
      );

      window.__timelines["03-solution"] = tl;
    })();
