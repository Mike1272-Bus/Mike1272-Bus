      var phase = { p: 0 };
      var IDLE_START = 11.4;

      if (IDLE_DUR > 0.3) {
        tl.to(phase, {
          p: Math.PI * 2 * (IDLE_DUR / 2.5),
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(phase.p);
            document.getElementById("sit02-img3").style.transform = "translateX(-50%) translateY(" + (s * 6).toFixed(2) + "px)";
