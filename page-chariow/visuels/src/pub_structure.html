<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Baloo 2'; font-weight: 800; src: url('Baloo2-ExtraBold.ttf'); }
@font-face { font-family: 'Work Sans'; font-weight: 400; src: url('worksans-400.ttf'); }
@font-face { font-family: 'Work Sans'; font-weight: 700; src: url('worksans-700.ttf'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --navy: #201f5b; --deep: #15144a; --gold: #f7c21b; --blue: #1f8fd1; --cyan: #6fd3f5; }
body { background: #fff; }
#root { position: relative; width: 1080px; height: 1350px; overflow: hidden; font-family: 'Baloo 2', sans-serif; font-weight: 800; color: var(--navy);
  background: radial-gradient(circle at 78% 34%, #dcecff 0%, rgba(220,236,255,0) 42%),
              radial-gradient(circle at 10% 60%, #fff4cf 0%, rgba(255,244,207,0) 38%), #f7f6fb; }
.abs { position: absolute; }
#logo { left: 58px; top: 52px; width: 250px; }
#arc { left: 540px; top: 340px; width: 700px; height: 700px; border-radius: 50%;
       background: radial-gradient(circle at 45% 40%, #2d2c7a 0%, var(--navy) 55%, var(--deep) 100%); }
#arc2 { left: 510px; top: 310px; width: 760px; height: 760px; border-radius: 50%; border: 18px solid var(--gold); opacity: .95; }
#hero { left: 470px; top: 330px; width: 680px; }
#h1 { left: 58px; top: 165px; font-size: 104px; line-height: .98; letter-spacing: -1px; }
#h1 .l2 { color: var(--blue); }
#swoosh { left: 66px; top: 372px; width: 470px; }
#panel { left: 50px; top: 440px; width: 470px; padding: 30px 32px 28px; background: rgba(255,255,255,.93); border-radius: 36px;
         box-shadow: 0 18px 40px rgba(32,31,91,.18); }
.pill { display: block; width: 300px; margin: 0 auto 14px; text-align: center; border-radius: 40px; font-size: 38px; padding: 8px 0 0; line-height: 1.2;
        box-shadow: 0 6px 0 rgba(0,0,0,.18); }
.pill.navy { background: var(--navy); color: var(--gold); }
.pill.cyan { background: var(--cyan); color: var(--navy); margin-top: 22px; }
ul { list-style: none; font-family: 'Work Sans'; font-weight: 700; font-size: 27px; line-height: 1.34; color: var(--navy); }
li { position: relative; padding-left: 38px; }
li::before { content: ''; position: absolute; left: 4px; top: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(247,194,27,.25); }
#badge { left: 420px; top: 745px; width: 200px; height: 200px; }
#badge div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
             color: #fff; font-size: 29px; line-height: .95; padding-top: 8px; }
#badge div b { color: var(--gold); font-size: 31px; margin-bottom: 4px; }
#band { left: 0; top: 960px; width: 1080px; height: 260px; }
.thumbs { left: 58px; top: 1000px; display: flex; gap: 22px; }
.thumbs div { width: 227px; height: 190px; border-radius: 22px; border: 7px solid #fff; overflow: hidden; background: #fff;
              box-shadow: 0 10px 22px rgba(0,0,0,.28); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%; }
#bar { left: 90px; top: 1232px; width: 900px; height: 92px; border-radius: 30px; background: var(--gold);
       box-shadow: 0 10px 0 var(--navy); display: flex; align-items: center; justify-content: center; gap: 50px; }
#bar::after { content: ''; position: absolute; inset: 9px; border: 3px dashed rgba(32,31,91,.45); border-radius: 22px; }
#bar .it { display: flex; align-items: center; gap: 14px; font-size: 40px; padding-top: 6px; }
#bar img { width: 54px; height: 54px; margin-top: -6px; }
#bar .sep { width: 4px; height: 44px; background: var(--navy); opacity: .35; border-radius: 2px; }
.spark { position: absolute; }
</style></head><body>
