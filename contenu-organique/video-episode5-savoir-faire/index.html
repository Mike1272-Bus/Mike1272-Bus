<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Inter'; font-weight: 400; src: url('assets/fonts/inter-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 600; src: url('assets/fonts/inter-latin-600-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 800; src: url('assets/fonts/inter-latin-800-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 900; src: url('assets/fonts/inter-latin-900-normal.woff2') format('woff2'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; }
      .ab { position: absolute; }
      .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .light { background: radial-gradient(ellipse at 50% 40%, #fbf8f3 0%, #efebe4 70%, #e4dfd7 100%); }
      .light.white { background: radial-gradient(ellipse at 50% 45%, #ffffff 0%, #f7f7f7 65%, #ececec 100%); }
      .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,0,0,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.035) 1px, transparent 1px); background-size: 60px 60px; }
      .swoosh { position: absolute; left: -300px; top: -300px; width: 1680px; height: 2520px; }
      .line { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
      .w { display: inline-block; margin: 0 0.12em; }
      .sm { font-weight: 600; font-size: 62px; letter-spacing: -0.02em; color: #141414; }
      .big { font-weight: 900; font-size: 128px; letter-spacing: -0.045em; line-height: 0.95; color: #ff3d1f; text-shadow: 0 6px 0 #8f1d0c, 0 18px 30px rgba(0,0,0,0.25); }
      .ext { font-weight: 900; font-size: 150px; letter-spacing: -0.05em; line-height: 0.95; color: #ff3d1f; text-shadow: 0 3px 0 #d93216, 0 6px 0 #b82812, 0 9px 0 #8f1d0c, 0 26px 40px rgba(0,0,0,0.22); }
      .obj { position: absolute; filter: drop-shadow(0 30px 40px rgba(0,0,0,0.3)); }

      /* cartes des métiers */
      .card { position: absolute; width: 470px; height: 300px; border-radius: 30px; overflow: hidden; border: 8px solid #fff; box-shadow: 0 22px 44px rgba(0,0,0,0.18); background: #ddd; }
      .card video { width: 100%; height: 100%; object-fit: cover; display: block; }
      .card .tag { position: absolute; left: 14px; bottom: 14px; height: 56px; padding: 0 22px; border-radius: 28px; background: #fff; color: #141414; font-weight: 800; font-size: 30px; line-height: 56px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
      #m2 .tag, #m4 .tag, #m6 .tag { left: auto; right: 14px; }
      #m1 { left: 50px; top: 640px; } #m2 { left: 560px; top: 640px; }
      #m3 { left: 50px; top: 970px; } #m4 { left: 560px; top: 970px; }
      #m5 { left: 50px; top: 1300px; } #m6 { left: 560px; top: 1300px; }
      .coin { position: absolute; left: 470px; top: 1060px; width: 140px; height: 140px; }
      #fade { left: 0; top: 0; width: 1080px; height: 1920px; background: #fff; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.2" data-width="1080" data-height="1920">

      <!-- 1. Hook : « Tu as un savoir-faire qui peut te payer. Le problème, c'est que tu ne le sais pas encore. » -->
      <div class="scene light white" id="s1"><div class="cam" id="k1"><div class="grid"></div>
        <svg class="swoosh" viewBox="0 0 1680 2520"><path d="M200 -100 C 700 700, 1000 1300, 1500 2600" fill="none" stroke="#e9e5de" stroke-width="230" stroke-linecap="round"/></svg>

        <div class="line" style="top:270px" data-layout-allow-overlap><span class="w sm" id="a1">Tu</span><span class="w sm" id="a2">as</span></div>
        <div class="line" style="top:365px" data-layout-allow-overlap><span class="w ext" id="a3">un savoir-faire</span></div>

        <div class="line" style="top:270px" data-layout-allow-overlap><span class="w sm" id="b1">qui</span><span class="w sm" id="b2">peut</span></div>
        <div class="line" style="top:375px" data-layout-allow-overlap><span class="w big" id="b3">te payer</span></div>

        <div class="line" style="top:240px" data-layout-allow-overlap><span class="w sm" id="c1">Le problème,</span><span class="w sm" id="c2">c'est que</span></div>
        <div class="line" style="top:330px" data-layout-allow-overlap><span class="w sm" id="c3">tu</span><span class="w sm" id="c4">ne</span><span class="w sm" id="c5">le</span><span class="w sm" id="c6">sais</span></div>
        <div class="line" style="top:425px" data-layout-allow-overlap><span class="w big" id="c7">pas encore</span></div>

        <div class="card" id="m1"><video id="v1" src="assets/video/cuisine.mp4" muted playsinline data-start="0" data-duration="6.2" data-media-start="0"></video><div class="tag">Cuisine</div></div>
        <div class="card" id="m2"><video id="v2" src="assets/video/menuiserie.mp4" muted playsinline data-start="0" data-duration="6.2" data-media-start="0"></video><div class="tag">Menuiserie</div></div>
        <div class="card" id="m3"><video id="v3" src="assets/video/anglais.mp4" muted playsinline data-start="0" data-duration="6.2" data-media-start="0"></video><div class="tag">Anglais</div></div>
        <div class="card" id="m4"><video id="v4" src="assets/video/couture.mp4" muted playsinline data-start="0" data-duration="6.2" data-media-start="0"></video><div class="tag">Couture</div></div>
        <div class="card" id="m5"><video id="v5" src="assets/video/electricien.mp4" muted playsinline data-start="0" data-duration="6.2" data-media-start="0"></video><div class="tag">Électricité</div></div>
        <div class="card" id="m6"><video id="v6" src="assets/video/mecanicien.mp4" muted playsinline data-start="0" data-duration="6.2" data-media-start="0"></video><div class="tag">Mécanique</div></div>

        <img class="coin" id="co1" src="assets/img/coin_3d.png" />
        <img class="coin" id="co2" src="assets/img/coin_3d.png" />
        <img class="coin" id="co3" src="assets/img/coin_3d.png" />
        <img class="coin" id="co4" src="assets/img/coin_3d.png" />
        <img class="coin" id="co5" src="assets/img/coin_3d.png" />
        <img class="coin" id="co6" src="assets/img/coin_3d.png" />
        <img class="obj" id="bag" src="assets/img/money_bag_3d.png" style="left:400px; top:990px; width:280px; height:280px" />
        <img class="obj" id="lock" src="assets/img/locked_3d.png" style="left:390px; top:980px; width:300px; height:300px" />
      </div></div>

      <div class="ab" id="fade"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const HIDE = [];
      const FT = (sel, from, to, at) => tl.fromTo(sel, from, { ...to, immediateRender: false }, at);
      const IN = (sel, from, to, at) => { HIDE.push(...[].concat(sel)); return FT(sel, { ...from, autoAlpha: 0 }, { ...to, autoAlpha: 1 }, at); };
      const OUT = (sel, at, d = 0.18) => FT(sel, { autoAlpha: 1 }, { autoAlpha: 0, y: -30, filter: "blur(10px)", duration: d, ease: "power2.in" }, at);
      const word = (sel, at, d = 0.28) => IN(sel, { y: -50, scale: 1.3, filter: "blur(12px)" }, { y: 0, scale: 1, filter: "blur(0px)", duration: d, ease: "power3.out" }, at);
      const words = (list, at, gap = 0.14) => list.forEach((s, i) => word(s, at + i * gap));

      // caméra : zoom punch d'entrée + légère dérive, petit punch sur chaque temps fort
      FT("#k1", { scale: 1.14 }, { scale: 1.0, duration: 0.45, ease: "expo.out" }, 0);
      FT("#k1", { rotation: 0, x: 0 }, { rotation: -0.8, x: 20, duration: 6.2, ease: "sine.inOut" }, 0);
      [1.9, 3.95].forEach(t => FT("#k1", { scale: 1.0 }, { scale: 1.05, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, t));

      // « Tu as un savoir-faire » + les métiers qui arrivent un par un
      words(["#a1", "#a2"], 0.2);
      IN("#a3", { y: -300, scale: 1.4 }, { y: 0, scale: 1, duration: 0.45, ease: "bounce.out" }, 0.5);
      ["#m1", "#m2", "#m3", "#m4", "#m5", "#m6"].forEach((m, i) => IN(m, { scale: 0.4, rotation: i % 2 ? 8 : -8, y: 120 }, { scale: 1, rotation: i % 2 ? 1.5 : -1.5, y: 0, duration: 0.35, ease: "back.out(1.8)" }, 0.35 + i * 0.17));

      // « qui peut te payer » : le sac d'argent et les pièces qui jaillissent
      OUT(["#a1", "#a2", "#a3"], 1.5);
      words(["#b1", "#b2"], 1.55, 0.13); IN("#b3", { scale: 2.2, filter: "blur(16px)" }, { scale: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, 1.85);
      IN("#bag", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.2)" }, 1.9);
      [[-380, -330], [380, -330], [-430, 60], [430, 60], [-300, 380], [300, 380]].forEach(([x, y], i) => {
        IN("#co" + (i + 1), { x: 0, y: 0, scale: 0.3, rotation: 0 }, { x: x, y: y, scale: 1, rotation: i % 2 ? 200 : -200, duration: 0.55, ease: "power3.out" }, 2.0 + i * 0.04);
        FT("#co" + (i + 1), { autoAlpha: 1 }, { autoAlpha: 0, scale: 0.6, duration: 0.25 }, 2.7 + i * 0.03);
      });

      // « Le problème, c'est que tu ne le sais pas encore » : tout s'éteint, cadenas
      OUT(["#b1", "#b2", "#b3"], 3.0);
      FT("#bag", { autoAlpha: 1 }, { autoAlpha: 0, scale: 0.3, duration: 0.25, ease: "power2.in" }, 3.0);
      words(["#c1", "#c2"], 3.05, 0.25);
      FT(["#m1", "#m2", "#m3", "#m4", "#m5", "#m6"], { filter: "grayscale(0) blur(0px) brightness(1)" }, { filter: "grayscale(1) blur(4px) brightness(0.85)", duration: 0.5, ease: "power2.out" }, 3.4);
      words(["#c3", "#c4", "#c5", "#c6"], 3.75, 0.1);
      IN("#lock", { scale: 2.4, y: -200 }, { scale: 1, y: 0, duration: 0.35, ease: "power4.in" }, 3.95);
      word("#c7", 4.3, 0.35);
      FT("#lock", { rotation: 0 }, { rotation: 10, duration: 0.07, yoyo: true, repeat: 5, ease: "sine.inOut" }, 4.75);
      FT("#fade", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 5.85);

      gsap.set(HIDE, { autoAlpha: 0 });
      gsap.set("#fade", { opacity: 0 });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
