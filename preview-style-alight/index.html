<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Baloo 2'; font-weight: 800; src: url('assets/Baloo2-ExtraBold.ttf') format('truetype'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fbf6ee; }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        color: #111;
        background:
          repeating-linear-gradient(0deg, rgba(0,0,0,0.055) 0 2px, transparent 2px 54px),
          repeating-linear-gradient(90deg, rgba(0,0,0,0.055) 0 2px, transparent 2px 54px),
          radial-gradient(circle at 50% 38%, #fde3c8 0%, #fbf6ee 62%);
      }

      .brand {
        position: absolute; top: 80px; left: 80px;
        background: #111; color: #fff;
        font-size: 30px; letter-spacing: 0.04em;
        padding: 14px 32px 8px; border-radius: 40px;
      }

      .stage { position: absolute; inset: 0; perspective: 1600px; }

      .card { position: absolute; width: 330px; height: 430px; }
      .flip { position: absolute; inset: 0; transform-style: preserve-3d; }
      .face {
        position: absolute; inset: 0;
        border-radius: 30px; border: 10px solid #fff;
        overflow: hidden; backface-visibility: hidden;
        box-shadow: 0 34px 60px rgba(60, 30, 0, 0.28);
      }
      .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .back {
        background: #111; transform: rotateY(180deg);
        display: flex; align-items: center; justify-content: center;
        color: #ff5c00; font-size: 240px; line-height: 1;
      }
      .tag {
        position: absolute; left: 18px; bottom: 18px;
        background: #111; color: #fff; font-size: 30px;
        padding: 8px 22px 2px; border-radius: 30px;
      }
      #c1 { left: 90px; top: 430px; }
      #c2 { left: 375px; top: 350px; z-index: 2; }
      #c3 { left: 660px; top: 450px; }

      .badge {
        position: absolute; left: 230px; top: 900px; z-index: 5;
        width: 620px; text-align: center;
        background: #ff5c00; color: #fff; font-size: 64px;
        padding: 26px 0 14px; border-radius: 70px;
        border: 5px solid #111; box-shadow: 12px 12px 0 #111;
      }

      .cover {
        position: absolute; left: 250px; top: 330px; width: 580px; height: 580px;
        border-radius: 30px; border: 12px solid #fff; overflow: hidden;
        box-shadow: 0 40px 80px rgba(60, 30, 0, 0.32);
      }
      .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .timer {
        position: absolute; left: 740px; top: 250px; width: 190px; height: 190px; z-index: 6;
        background: #fff; border: 5px solid #111; border-radius: 50%;
        box-shadow: 10px 10px 0 #111;
      }
      .timer svg { width: 100%; height: 100%; }

      .spark { position: absolute; width: 70px; height: 70px; }
      .spark svg { width: 100%; height: 100%; fill: #111; }

      .caps { position: absolute; left: 70px; right: 70px; top: 1430px; height: 360px; }
      .sent {
        position: absolute; inset: 0; opacity: 0;
        display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start;
        column-gap: 18px; row-gap: 6px;
        font-size: 74px; line-height: 1.25; text-align: center;
      }
      .w { position: relative; display: inline-block; opacity: 0.28; }
      .w .hl {
        position: absolute; left: -10px; right: -10px; top: 6px; bottom: 2px;
        background: #ffd60a; border-radius: 14px; transform: scaleX(0); z-index: 0;
      }
      .w .t { position: relative; z-index: 1; }
      .w.acc .t { color: #c94200; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div class="brand" id="brand">DIGITALMIKAELSON</div>

      <div class="stage" id="stage">
        <div class="card" id="c1" data-layout-allow-overflow><div class="flip" id="f1">
          <div class="face" id="fr1"><img src="assets/img/ch3_cuisine.jpg" /><div class="tag">Cuisine</div></div>
          <div class="face back" id="bk1">?</div>
        </div></div>
        <div class="card" id="c2" data-layout-allow-overflow><div class="flip" id="f2">
          <div class="face" id="fr2"><img src="assets/img/ebook_couture.jpg" /><div class="tag">Couture</div></div>
          <div class="face back" id="bk2">?</div>
        </div></div>
        <div class="card" id="c3" data-layout-allow-overflow><div class="flip" id="f3">
          <div class="face" id="fr3"><img src="assets/img/ebook_anglais.jpg" /><div class="tag">Langues</div></div>
          <div class="face back" id="bk3">?</div>
        </div></div>

        <div class="cover" id="cover"><img src="assets/img/ebook_cover.png" /></div>
      </div>

      <div class="badge" id="badge">VAUT DE L'ARGENT</div>

      <div class="timer" id="timer">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="34" fill="none" stroke="#eee" stroke-width="9" />
          <circle id="ring" cx="50" cy="50" r="34" fill="none" stroke="#ff5c00" stroke-width="9"
            stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6" transform="rotate(-90 50 50)" />
          <line id="hand" x1="50" y1="50" x2="50" y2="26" stroke="#111" stroke-width="6" stroke-linecap="round" />
          <circle cx="50" cy="50" r="5" fill="#111" />
        </svg>
      </div>

      <div class="spark" id="s1" style="left:70px;top:330px"><svg viewBox="0 0 100 100"><path d="M50 0 C54 38 62 46 100 50 C62 54 54 62 50 100 C46 62 38 54 0 50 C38 46 46 38 50 0Z"/></svg></div>
      <div class="spark" id="s2" style="left:930px;top:380px"><svg viewBox="0 0 100 100"><path d="M50 0 C54 38 62 46 100 50 C62 54 54 62 50 100 C46 62 38 54 0 50 C38 46 46 38 50 0Z"/></svg></div>
      <div class="spark" id="s3" style="left:120px;top:960px;width:50px;height:50px"><svg viewBox="0 0 100 100"><path d="M50 0 C54 38 62 46 100 50 C62 54 54 62 50 100 C46 62 38 54 0 50 C38 46 46 38 50 0Z"/></svg></div>
      <div class="spark" id="s4" style="left:900px;top:1080px;width:56px;height:56px"><svg viewBox="0 0 100 100"><path d="M50 0 C54 38 62 46 100 50 C62 54 54 62 50 100 C46 62 38 54 0 50 C38 46 46 38 50 0Z"/></svg></div>

      <div class="caps" id="caps"></div>

      <audio id="sfx-open" src="assets/sfx/whoosh-short.mp3" data-start="0" data-duration="0.57" data-track-index="10" data-volume="0.6"></audio>
      <audio id="sfx-pop1" src="assets/sfx/pop.mp3" data-start="0.35" data-duration="0.72" data-track-index="11" data-volume="0.7"></audio>
      <audio id="sfx-pop2" src="assets/sfx/pop.mp3" data-start="0.6" data-duration="0.72" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-pop3" src="assets/sfx/pop.mp3" data-start="0.85" data-duration="0.72" data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-badge" src="assets/sfx/sparkle.mp3" data-start="2.1" data-duration="1.8" data-track-index="14" data-volume="0.55"></audio>
      <audio id="sfx-flip" src="assets/sfx/whoosh.mp3" data-start="3.55" data-duration="0.57" data-track-index="15" data-volume="0.6"></audio>
      <audio id="sfx-out" src="assets/sfx/whoosh-short.mp3" data-start="5.95" data-duration="0.57" data-track-index="16" data-volume="0.7"></audio>
      <audio id="sfx-riser" src="assets/sfx/riser.mp3" data-start="6.3" data-media-start="6.8" data-duration="3.2" data-track-index="17" data-volume="0.45"></audio>
      <audio id="sfx-land" src="assets/sfx/pop.mp3" data-start="6.75" data-duration="0.72" data-track-index="18" data-volume="0.7"></audio>
      <audio id="sfx-end" src="assets/sfx/ping.mp3" data-start="9.4" data-duration="0.6" data-track-index="19" data-volume="0.6"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const sentences = [
        { start: 0.3, end: 3.3, words: ["Vous", "avez", "déjà", "un", "savoir-faire", "qui", "vaut", "de", "l'argent."], acc: [8] },
        { start: 3.5, end: 5.9, words: ["Vous", "ne", "le", "savez", "juste", "pas", "encore."], acc: [6] },
        { start: 6.2, end: 9.7, words: ["Je", "vais", "vous", "expliquer", "exactement", "pourquoi,", "dans", "quelques", "secondes."], acc: [8] },
      ];

      const caps = document.getElementById("caps");
      sentences.forEach((s, si) => {
        const box = document.createElement("div");
        box.className = "sent";
        box.id = "sent" + si;
        s.els = s.words.map((word, wi) => {
          const w = document.createElement("span");
          w.className = "w" + (s.acc.includes(wi) ? " acc" : "");
          w.innerHTML = '<span class="hl"></span><span class="t"></span>';
          w.querySelector(".t").textContent = word;
          box.appendChild(w);
          return w;
        });
        caps.appendChild(box);
      });

      sentences.forEach((s) => {
        const box = s.els[0].parentNode;
        tl.fromTo(box, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, s.start - 0.1);
        const weights = s.words.map((w) => w.length + 2);
        const total = weights.reduce((a, b) => a + b, 0);
        const speak = s.end - s.start - 0.25;
        let t = s.start;
        s.els.forEach((el, i) => {
          const d = (speak * weights[i]) / total;
          const hl = el.querySelector(".hl");
          tl.to(el, { opacity: 1, duration: 0.08 }, t);
          tl.set(hl, { transformOrigin: "left center" }, t);
          tl.to(hl, { scaleX: 1, duration: 0.1, ease: "power1.out" }, t);
          if (i < s.els.length - 1) {
            tl.set(hl, { transformOrigin: "right center" }, t + d - 0.08);
            tl.to(hl, { scaleX: 0, duration: 0.1, ease: "power1.in" }, t + d - 0.08);
          }
          t += d;
        });
        tl.to(box, { opacity: 0, y: -16, duration: 0.15, ease: "power1.in" }, s.end - 0.05);
      });

      // brand pill
      tl.fromTo("#brand", { x: -420 }, { x: 0, duration: 0.45, ease: "power3.out" }, 0);

      // cards pop in with 3D entrance
      [["#c1", -9, 0.3], ["#c2", 3, 0.55], ["#c3", 10, 0.8]].forEach(([sel, rot, at]) => {
        tl.fromTo(sel,
          { opacity: 0, y: 380, scale: 0.55, rotation: rot * -2, rotationX: -55, transformPerspective: 1400 },
          { opacity: 1, y: 0, scale: 1, rotation: rot, rotationX: 0, duration: 0.6, ease: "back.out(1.5)" }, at);
      });
      // idle float
      tl.to("#c1", { y: -14, duration: 2.6, ease: "sine.inOut" }, 0.95);
      tl.to("#c2", { y: 12, duration: 2.6, ease: "sine.inOut" }, 1.1);
      tl.to("#c3", { y: -10, duration: 2.6, ease: "sine.inOut" }, 1.4);

      // sparkles
      ["#s1", "#s2", "#s3", "#s4"].forEach((sel, i) => {
        tl.fromTo(sel, { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.5)" }, 0.9 + i * 0.15);
        tl.to(sel, { rotation: 180, duration: 5, ease: "none" }, 1.32 + i * 0.15);
      });

      // value badge
      tl.fromTo("#badge", { scale: 0, rotation: 12 }, { scale: 1, rotation: -4, duration: 0.45, ease: "back.out(2.2)" }, 2.1);
      tl.to("#badge", { scale: 0, rotation: 10, duration: 0.25, ease: "back.in(2)" }, 3.35);

      // "vous ne le savez pas encore": 3D flip to the hidden side
      tl.set(["#bk1", "#bk2", "#bk3"], { autoAlpha: 0 }, 0);
      [1, 2, 3].forEach((n, i) => {
        const at = 3.6 + i * 0.14;
        tl.fromTo("#f" + n, { rotationY: 0 }, { rotationY: 180, duration: 0.6, ease: "power2.inOut" }, at);
        tl.set("#bk" + n, { autoAlpha: 1 }, at + 0.3);
        tl.set("#fr" + n, { autoAlpha: 0 }, at + 0.3);
      });

      // cards fly out
      tl.to("#c1", { x: -900, rotation: -35, duration: 0.45, ease: "power3.in" }, 5.95);
      tl.to("#c3", { x: 900, rotation: 35, duration: 0.45, ease: "power3.in" }, 5.95);
      tl.to("#c2", { y: -1300, rotation: 15, duration: 0.45, ease: "power3.in" }, 6.0);
      tl.to(["#s1", "#s2", "#s3", "#s4"], { scale: 0, duration: 0.25 }, 5.95);

      // ebook cover swings in, in 3D
      tl.fromTo("#cover",
        { opacity: 0, y: 900, rotationY: 75, rotationX: 20, scale: 0.7, transformPerspective: 1400 },
        { opacity: 1, y: 0, rotationY: -12, rotationX: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 6.2);
      tl.to("#cover", { rotationY: 8, rotation: -2, duration: 2.6, ease: "sine.inOut" }, 6.8);
      tl.fromTo(["#s1", "#s4"], { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.5)" }, 6.7);

      // countdown timer: "dans quelques secondes"
      tl.fromTo("#timer", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.4)" }, 6.8);
      tl.fromTo("#ring", { attr: { "stroke-dashoffset": 213.6 } }, { attr: { "stroke-dashoffset": 0 }, duration: 2.5, ease: "none" }, 7.0);
      tl.fromTo("#hand", { rotation: 0, svgOrigin: "50 50" }, { rotation: 360, svgOrigin: "50 50", duration: 2.5, ease: "none" }, 7.0);
      tl.to("#timer", { scale: 1.12, duration: 0.12, yoyo: true, repeat: 1 }, 9.45);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
