<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Work Sans";
        src: url("fonts/work-sans-variable.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Archivo Black";
        src: url("fonts/archivo-black-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --yellow: #F7CB46;
        --ink: #0A0A05;
        --cream: #FFFDF5;
      }

      html, body { width: 1640px; height: 624px; overflow: hidden; background: var(--cream); font-family: "Work Sans", sans-serif; }

      .stage { position: relative; width: 1640px; height: 624px; overflow: hidden; }

      .bg-grid {
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(10,10,5,0.14) 2px, transparent 2px);
        background-size: 34px 34px;
      }

      /* decorative shapes, kept out of the FB-safe zone (avoid bottom-left profile overlap + edge crop on mobile) */
      .shape-square {
        position: absolute; top: -46px; right: 220px; width: 220px; height: 220px;
        background: var(--yellow); border: 6px solid var(--ink); transform: rotate(-9deg);
      }
      .shape-ring {
        position: absolute; bottom: -70px; right: 70px; width: 190px; height: 190px;
        border-radius: 50%; border: 10px solid var(--ink); background: transparent;
      }
      .shape-dot {
        position: absolute; top: 60px; left: 1160px; width: 26px; height: 26px;
        border-radius: 50%; background: var(--ink);
      }

      /* main content block — shifted right of the FB profile-picture zone (bottom-left ~340x340px)
         and clear of the mobile-crop margin (~180px each side), top-anchored so nothing sits low */
      .content {
        position: absolute; left: 340px; top: 70px; width: 980px;
        display: flex; flex-direction: column; gap: 20px;
      }
      .eyebrow {
        display: inline-flex; align-self: flex-start;
        font-family: "Work Sans", sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--ink); background: var(--yellow); border: 4px solid var(--ink); border-radius: 999px; padding: 12px 26px;
        box-shadow: 6px 6px 0 var(--ink);
      }
      .wordmark {
        font-family: "Archivo Black", sans-serif; font-weight: 400; text-transform: uppercase;
        font-size: 104px; line-height: 0.98; color: var(--ink); letter-spacing: -0.01em;
      }
      .tagline {
        font-family: "Work Sans", sans-serif; font-weight: 600; font-size: 30px; line-height: 1.3;
        color: var(--ink); max-width: 720px;
      }

      /* VENDRE roadmap signature */
      .roadmap { display: flex; align-items: center; gap: 0; margin-top: 6px; }
      .node {
        width: 64px; height: 64px; border-radius: 50%; background: var(--cream); border: 5px solid var(--ink);
        display: flex; align-items: center; justify-content: center; font-family: "Archivo Black", sans-serif;
        font-size: 30px; color: var(--ink); flex: none;
      }
      .node.hot { background: var(--yellow); }
      .node-line { width: 22px; height: 5px; background: var(--ink); flex: none; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="bg-grid"></div>
      <div class="shape-square"></div>
      <div class="shape-ring"></div>
      <div class="shape-dot"></div>

      <div class="content">
        <div class="eyebrow">Michaelson Digital Academy</div>
        <div class="wordmark">DigitalMikaelson</div>
        <div class="tagline">Apprends à transformer tes compétences en produits digitaux — la stratégie VENDRE, un épisode à la fois.</div>

        <div class="roadmap">
          <div class="node hot">V</div>
          <div class="node-line"></div>
          <div class="node hot">E</div>
          <div class="node-line"></div>
          <div class="node hot">N</div>
          <div class="node-line"></div>
          <div class="node">D</div>
          <div class="node-line"></div>
          <div class="node">R</div>
          <div class="node-line"></div>
          <div class="node">E</div>
        </div>
      </div>
    </div>
  </body>
</html>
