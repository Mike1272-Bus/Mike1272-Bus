<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Bricolage'; font-weight: 800; src: url('assets/fonts/bricolage-800.ttf') format('truetype'); }
      @font-face { font-family: 'Bricolage'; font-weight: 700; src: url('assets/fonts/bricolage-700.ttf') format('truetype'); }
      @font-face { font-family: 'Work Sans'; font-weight: 400; src: url('assets/fonts/worksans-400.ttf') format('truetype'); }
      @font-face { font-family: 'Work Sans'; font-weight: 700; src: url('assets/fonts/worksans-700.ttf') format('truetype'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #071434; }
      #root { position: relative; width: 1080px; height: 1080px; overflow: hidden; color: #fff; font-family: 'Bricolage', sans-serif;
        background: radial-gradient(circle at 30% 20%, #2a5bc4 0%, #123077 45%, #071434 100%); }
      .ab { position: absolute; }
      .center { left: 0; width: 1080px; text-align: center; }
      .big { font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -0.02em; }
      .big span, .mid span { display: inline-block; }
      .mid { font-weight: 800; font-size: 76px; line-height: 1.08; letter-spacing: -0.01em; }
      .y { color: #ffd60a; }
      .eyebrow { font-family: 'Work Sans'; font-weight: 700; font-size: 26px; letter-spacing: 0.3em; text-transform: uppercase; color: #9fb8f0; }
      #grid { left: 0; top: 0; width: 1080px; height: 1080px; opacity: 0.18;
        background-image: linear-gradient(rgba(255,255,255,0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px);
        background-size: 60px 60px; }
      #orb { left: 640px; top: 620px; width: 700px; height: 700px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,214,10,0.28) 0%, rgba(255,214,10,0) 65%); }
      #strike { left: 150px; top: 497px; width: 800px; height: 14px; background: #ffd60a; border-radius: 7px; transform-origin: left center; }
      #logo { left: 0; top: 380px; width: 1080px; display: flex; align-items: center; justify-content: center; gap: 30px; }
      #logo .wm { font-weight: 800; font-size: 96px; line-height: 0.95; letter-spacing: -0.01em; text-transform: uppercase; text-shadow: 6px 7px 0 #ffd60a; }
      #logo .tg { font-family: 'Work Sans'; font-weight: 700; font-size: 22px; letter-spacing: 0.24em; color: #cfdcff; margin-top: 14px; }
      .card { width: 270px; height: 360px; border-radius: 28px; background: #fff; color: #0b1e4a; box-shadow: 10px 12px 0 #ffd60a;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
      .card .ic { width: 110px; height: 110px; border-radius: 30px; background: #1f4aa0; display: flex; align-items: center; justify-content: center; }
      .card .lb { font-weight: 800; font-size: 36px; }
      #btn { left: 190px; top: 620px; width: 700px; height: 130px; border-radius: 65px; background: #ffd60a; color: #0b1e4a;
        display: flex; align-items: center; justify-content: center; gap: 22px; font-weight: 800; font-size: 54px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1080">
      <div id="grid" class="ab"></div>
      <div id="orb" class="ab"></div>

      <!-- S1 : le constat -->
      <div id="s1" class="clip ab center" data-start="0" data-duration="2.8" data-track-index="0" style="top:0;height:1080px">
        <div class="ab center eyebrow" style="top:330px" id="s1e">Commerçants de Kinshasa</div>
        <div class="ab center big" style="top:420px" id="s1t"><span>Vos</span> <span>produits</span><br /><span>sont</span> <span class="y">beaux.</span></div>
      </div>

      <!-- S2 : le problème -->
      <div id="s2" class="clip ab center" data-start="2.8" data-duration="2.8" data-track-index="1" style="top:0;height:1080px">
        <div class="ab center mid" style="top:380px" id="s2t"><span>Mais</span> <span>en</span> <span>ligne,</span><br /><span>personne</span> <span>ne</span> <span>les</span> <span>voit.</span></div>
        <div id="strike" class="ab"></div>
      </div>

      <!-- S3 : la marque -->
      <div id="s3" class="clip ab" data-start="5.6" data-duration="2.6" data-track-index="2" style="left:0;top:0;width:1080px;height:1080px">
        <div id="logo" class="ab">
          <svg width="150" height="170" viewBox="0 0 60 68" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" style="filter: drop-shadow(5px 6px 0 #ffd60a)"><path d="M20 20v-6a10 10 0 0 1 20 0v6"/><path d="M6 20h48l-4 44H10z"/><circle cx="21" cy="35" r="4" fill="#fff" stroke="none"/><path d="M15 55l11-10 7 6 13-14"/><path d="M38 37h8v8"/></svg>
          <div><div class="wm">Allegra<br />Digital</div><div class="tg">BOUTIQUES · PUBLICITÉ · IA</div></div>
        </div>
        <div class="ab center eyebrow" style="top:720px" id="s3e">On s'en occupe</div>
      </div>

      <!-- S4 : l'offre -->
      <div id="s4" class="clip ab" data-start="8.2" data-duration="2.6" data-track-index="3" style="left:0;top:0;width:1080px;height:1080px">
        <div class="ab center mid" style="top:150px;font-size:64px" id="s4t">Des vidéos animées<br /><span class="y">avec vos photos</span></div>
        <div class="ab card" id="c1" style="left:95px;top:500px">
          <div class="ic"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-dasharray="4 3"/><circle cx="12" cy="12" r="4"/></svg></div>
          <div class="lb">Statuts</div>
        </div>
        <div class="ab card" id="c2" style="left:405px;top:500px">
          <div class="ic"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M10 9l5 3-5 3z" fill="#fff"/></svg></div>
          <div class="lb">Reels</div>
        </div>
        <div class="ab card" id="c3" style="left:715px;top:500px">
          <div class="ic"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 14h8"/></svg></div>
          <div class="lb">Pages</div>
        </div>
      </div>

      <!-- S5 : l'appel -->
      <div id="s5" class="clip ab" data-start="10.8" data-duration="2.2" data-track-index="4" style="left:0;top:0;width:1080px;height:1080px">
        <div class="ab center mid" style="top:330px" id="s5t">Parlons de<br /><span class="y">votre marque.</span></div>
        <div id="btn" class="ab">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="#0b1e4a"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.2 1.5z"/></svg>
          <span>+243 831 710 181</span>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";
      // fond vivant
      tl.fromTo("#orb", { x: 0, y: 0, scale: 0.9 }, { x: -520, y: -460, scale: 1.25, duration: 13, ease: "sine.inOut" }, 0);
      tl.fromTo("#grid", { backgroundPosition: "0px 0px" }, { backgroundPosition: "0px 240px", duration: 13, ease: "none" }, 0);

      // S1
      tl.from("#s1e", { opacity: 0, y: 20, duration: 0.5, ease: E }, 0.15);
      tl.from("#s1t span", { opacity: 0, y: 70, rotation: 4, duration: 0.6, ease: "back.out(1.6)", stagger: 0.12 }, 0.3);
      tl.to("#s1t .y", { scale: 1.12, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.inOut" }, 1.4);
      tl.to("#s1", { opacity: 0, y: -40, duration: 0.35, ease: "power2.in" }, 2.45);

      // S2
      tl.from("#s2t span", { opacity: 0, y: 50, duration: 0.5, ease: E, stagger: 0.08 }, 2.9);
      tl.fromTo("#strike", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, 4.0);
      tl.to("#s2t", { opacity: 0.35, duration: 0.4 }, 4.2);
      tl.to("#s2", { opacity: 0, scale: 0.94, duration: 0.35, ease: "power2.in" }, 5.25);

      // S3
      tl.fromTo("#logo", { opacity: 0, scale: 0.6, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, scale: 1, clipPath: "inset(0 0% 0 0)", duration: 0.8, ease: E }, 5.7);
      tl.from("#s3e", { opacity: 0, y: 24, duration: 0.6, ease: E }, 6.3);
      tl.to("#s3", { opacity: 0, y: -40, duration: 0.35, ease: "power2.in" }, 7.85);

      // S4
      tl.from("#s4t", { opacity: 0, y: 40, duration: 0.5, ease: E }, 8.3);
      tl.from(["#c1", "#c2", "#c3"], { opacity: 0, y: 160, rotation: -6, duration: 0.6, ease: "back.out(1.5)", stagger: 0.14 }, 8.6);
      tl.to(["#c1", "#c2", "#c3"], { y: -12, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.12 }, 9.6);
      tl.to("#s4", { opacity: 0, duration: 0.3 }, 10.5);

      // S5
      tl.from("#s5t", { opacity: 0, y: 50, duration: 0.5, ease: E }, 10.9);
      tl.from("#btn", { opacity: 0, scale: 0.5, duration: 0.55, ease: "back.out(1.8)" }, 11.25);
      tl.to("#btn", { scale: 1.05, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 12.0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
