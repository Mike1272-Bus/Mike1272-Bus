<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Baloo 2'; font-weight: 800; src: url('Baloo2-ExtraBold.ttf'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; background: #fbf6ee; position: relative; overflow: hidden; }
.bg { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 3px, transparent 3px 72px), repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 3px, transparent 3px 72px), radial-gradient(circle at 50% 50%, #fde3c8 0%, #fbf6ee 60%); }
.c { position: absolute; left: 190px; top: 610px; width: 700px; height: 700px; border-radius: 50%; border: 14px solid #111; box-shadow: 26px 26px 0 #111; display: flex; align-items: center; justify-content: center; }
.c svg { width: 380px; height: 380px; }
</style></head><body><div class="bg"></div><div class="c" id="c"></div></body></html>
