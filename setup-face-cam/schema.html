<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Baloo'; font-weight: 800; src: url('Baloo2-ExtraBold.ttf'); }
  @font-face { font-family: 'Work Sans'; font-weight: 400; src: url('worksans-400.ttf'); }
  @font-face { font-family: 'Work Sans'; font-weight: 700; src: url('worksans-700.ttf'); }
  * { margin: 0; padding: 0; }
  body { width: 1080px; height: 1920px; background: #f7f4ee; }
  svg text { font-family: 'Work Sans', sans-serif; }
  .h { font-family: 'Baloo', sans-serif; font-weight: 800; }
  .lab { font-size: 25px; fill: #1b1f5e; }
  .labb { font-size: 25px; fill: #1b1f5e; font-weight: 700; }
  .lead { stroke: #e8553d; stroke-width: 3; fill: none; }
  .dot { fill: #e8553d; }
</style></head><body>
<svg width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e2d3bd"/><stop offset="70%" stop-color="#eadfcd"/><stop offset="100%" stop-color="#f3e2c4"/></linearGradient>
    <clipPath id="screen"><rect x="312" y="262" width="456" height="829" rx="34"/></clipPath>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/></linearGradient>
  </defs>

  <!-- titre -->
  <text class="h" x="540" y="105" text-anchor="middle" font-size="68" fill="#1b1f5e">Ton coin tournage</text>
  <text x="540" y="160" text-anchor="middle" font-size="30" fill="#55526a" font-weight="700">Petit budget, rendu pro · format vertical 9:16</text>
  <text class="h" x="540" y="228" text-anchor="middle" font-size="34" fill="#e8553d">① Ce que voit la caméra</text>

  <!-- téléphone et scène -->
  <rect x="300" y="250" width="480" height="853" rx="46" fill="#111"/>
  <g clip-path="url(#screen)">
    <rect x="312" y="262" width="456" height="829" fill="url(#wall)"/>
    <!-- lampe chaude derrière -->
    <circle cx="715" cy="560" r="150" fill="url(#glow)"/>
    <rect x="708" y="575" width="10" height="330" fill="#3a2a1c"/>
    <path d="M680 520 h70 l-12 55 h-46 z" fill="#f6dfae" stroke="#c9a46a" stroke-width="3"/>
    <!-- affiche aux couleurs de la marque -->
    <rect x="575" y="318" width="150" height="150" rx="8" fill="#1b1f5e" stroke="#f5f5f5" stroke-width="8"/>
    <rect x="595" y="420" width="110" height="14" rx="7" fill="#f5c518"/>
    <text class="h" x="650" y="400" text-anchor="middle" font-size="46" fill="#f5c518">DM</text>
    <!-- étagère -->
    <rect x="330" y="440" width="190" height="12" fill="#8b5e3c"/>
    <rect x="342" y="372" width="20" height="68" fill="#e8553d"/><rect x="364" y="380" width="16" height="60" fill="#1b1f5e"/><rect x="382" y="368" width="22" height="72" fill="#f5c518"/>
    <rect x="410" y="392" width="44" height="48" rx="6" fill="#d9d9d9"/><rect x="414" y="396" width="36" height="28" fill="#2f4fb3"/>
    <path d="M478 440 h28 l-4 -28 h-20 z" fill="#c76b3c"/>
    <ellipse cx="483" cy="398" rx="10" ry="22" fill="#3d8b4f" transform="rotate(-25 483 398)"/><ellipse cx="500" cy="396" rx="10" ry="22" fill="#4fa25f" transform="rotate(25 500 396)"/>
    <!-- plante dans le coin -->
    <path d="M325 1091 h80 l-8 -110 h-64 z" fill="#c76b3c"/>
    <ellipse cx="345" cy="930" rx="22" ry="70" fill="#3d8b4f" transform="rotate(-20 345 930)"/>
    <ellipse cx="380" cy="915" rx="22" ry="80" fill="#4fa25f" transform="rotate(12 380 915)"/>
    <ellipse cx="360" cy="960" rx="20" ry="60" fill="#2f7a42" transform="rotate(-50 360 960)"/>
    <!-- toi -->
    <path d="M380 1091 C 385 900, 430 820, 540 815 C 650 820, 695 900, 700 1091 Z" fill="#2f4fb3"/>
    <rect x="512" y="740" width="56" height="80" rx="20" fill="#6b4226"/>
    <ellipse cx="540" cy="640" rx="78" ry="100" fill="#6b4226"/>
    <path d="M462 610 C 470 540, 610 540, 618 610 C 600 575, 480 575, 462 610 Z" fill="#1d120b"/>
    <circle cx="512" cy="645" r="7" fill="#1d120b"/><circle cx="568" cy="645" r="7" fill="#1d120b"/>
    <path d="M515 690 Q 540 708 565 690" stroke="#1d120b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M500 822 L540 880 L580 822" fill="#f7f4ee" opacity=".9"/>
    <circle cx="560" cy="905" r="9" fill="#111"/><circle cx="560" cy="905" r="4" fill="#666"/>
    <!-- lignes des tiers -->
    <line x1="312" y1="538" x2="768" y2="538" stroke="#fff" stroke-width="2" stroke-dasharray="10 10" opacity=".9"/>
    <line x1="312" y1="814" x2="768" y2="814" stroke="#fff" stroke-width="2" stroke-dasharray="10 10" opacity=".5"/>
    <line x1="464" y1="262" x2="464" y2="1091" stroke="#fff" stroke-width="2" stroke-dasharray="10 10" opacity=".5"/>
    <line x1="616" y1="262" x2="616" y2="1091" stroke="#fff" stroke-width="2" stroke-dasharray="10 10" opacity=".5"/>
  </g>

  <!-- étiquettes gauche -->
  <g>
    <circle class="dot" cx="425" cy="446" r="7"/><path class="lead" d="M425 446 L280 446"/>
    <text class="labb" x="30" y="420">Étagère simple</text><text class="lab" x="30" y="450">livres, plante,</text><text class="lab" x="30" y="480">ordinateur</text>
    <circle class="dot" cx="370" cy="560" r="7"/><path class="lead" d="M370 560 L280 590"/>
    <text class="labb" x="30" y="580">Mur uni,</text><text class="lab" x="30" y="610">couleur douce :</text><text class="lab" x="30" y="640">beige, gris,</text><text class="lab" x="30" y="670">bleu nuit</text>
    <circle class="dot" cx="470" cy="538" r="7"/>
    <circle class="dot" cx="365" cy="930" r="7"/><path class="lead" d="M365 930 L280 930"/>
    <text class="labb" x="30" y="900">Une plante</text><text class="lab" x="30" y="930">dans le coin</text><text class="lab" x="30" y="960">(un peu de vie)</text>
    <path class="lead" d="M470 538 L280 760"/>
    <text class="labb" x="30" y="760">Tes yeux sur</text><text class="lab" x="30" y="790">la ligne du</text><text class="lab" x="30" y="820">tiers haut</text>
  </g>
  <!-- étiquettes droite -->
  <g>
    <circle class="dot" cx="725" cy="330" r="7"/><path class="lead" d="M725 330 L800 330"/>
    <text class="labb" x="810" y="320">Ton logo</text><text class="lab" x="810" y="350">ou une affiche</text><text class="lab" x="810" y="380">à tes couleurs</text>
    <circle class="dot" cx="735" cy="560" r="7"/><path class="lead" d="M735 560 L800 560"/>
    <text class="labb" x="810" y="540">Lampe chaude</text><text class="lab" x="810" y="570">derrière toi :</text><text class="lab" x="810" y="600">de la profondeur</text>
    <circle class="dot" cx="560" cy="905" r="7"/><path class="lead" d="M560 905 L800 860"/>
    <text class="labb" x="810" y="840">Micro-cravate</text><text class="lab" x="810" y="870">sur la poitrine,</text><text class="lab" x="810" y="900">à 15-20 cm</text><text class="lab" x="810" y="930">de la bouche</text>
    <text class="labb" x="810" y="1010">Haut du corps</text><text class="lab" x="810" y="1040">cadré, un peu</text><text class="lab" x="810" y="1070">d'air au-dessus</text>
  </g>

  <!-- vue de dessus -->
  <text class="h" x="540" y="1170" text-anchor="middle" font-size="34" fill="#e8553d">② Vue de dessus : où placer chaque chose</text>
  <rect x="90" y="1200" width="900" height="560" rx="18" fill="#fffdf8" stroke="#1b1f5e" stroke-width="4"/>
  <!-- mur du fond + étagère -->
  <rect x="90" y="1200" width="900" height="42" fill="#1b1f5e"/>
  <rect x="160" y="1242" width="260" height="34" fill="#c9a46a"/>
  <text class="lab" x="290" y="1266" text-anchor="middle" font-size="21">étagère</text>
  <circle cx="820" cy="1284" r="60" fill="url(#glow)"/><circle cx="820" cy="1284" r="16" fill="#f6dfae" stroke="#c9a46a" stroke-width="3"/>
  <text class="lab" x="790" y="1290" text-anchor="end" font-size="21">lampe chaude</text>
  <text class="labb" x="540" y="1230" text-anchor="middle" font-size="23" style="fill:#fff">MUR (TON FOND)</text>
  <!-- tapis -->
  <ellipse cx="540" cy="1470" rx="260" ry="110" fill="#e8553d" opacity=".12"/>
  <text class="lab" x="700" y="1600" font-size="21">tapis + rideaux :</text><text class="lab" x="700" y="1625" font-size="21">moins d'écho</text>
  <!-- toi -->
  <circle cx="540" cy="1400" r="44" fill="#6b4226"/><rect x="480" y="1430" width="120" height="34" rx="17" fill="#2f4fb3"/>
  <text class="labb" x="540" y="1407" text-anchor="middle" style="fill:#fff" font-size="24">TOI</text>
  <!-- distance mur - toi -->
  <path d="M455 1246 L455 1356" stroke="#1b1f5e" stroke-width="3"/><path d="M447 1256 L455 1246 L463 1256 M447 1346 L455 1356 L463 1346" stroke="#1b1f5e" stroke-width="3" fill="none"/>
  <text class="labb" x="440" y="1300" text-anchor="end" font-size="23">1 à 1,5 m</text>
  <!-- trépied + téléphone -->
  <path d="M540 1640 L505 1690 M540 1640 L575 1690 M540 1640 L540 1700" stroke="#333" stroke-width="5"/>
  <rect x="512" y="1610" width="56" height="30" rx="6" fill="#111"/>
  <path d="M520 1610 L470 1470 L610 1470 L560 1610 Z" fill="#2f4fb3" opacity=".12"/>
  <path d="M630 1470 L630 1606" stroke="#1b1f5e" stroke-width="3"/><path d="M622 1480 L630 1470 L638 1480 M622 1596 L630 1606 L638 1596" stroke="#1b1f5e" stroke-width="3" fill="none"/>
  <text class="labb" x="645" y="1530" font-size="23">≈ 1 m</text>
  <text class="labb" x="600" y="1676" font-size="22">Téléphone sur trépied,</text><text class="lab" x="600" y="1703" font-size="22">caméra arrière,</text><text class="lab" x="600" y="1730" font-size="22">à hauteur des yeux</text>
  <!-- lumière LED à 45° -->
  <path d="M250 1600 L470 1420 L520 1470 L300 1650 Z" fill="url(#beam)"/>
  <rect x="215" y="1590" width="70" height="52" rx="8" fill="#fff" stroke="#1b1f5e" stroke-width="4" transform="rotate(-40 250 1616)"/>
  <text class="labb" x="110" y="1690" font-size="23">Lampe LED à 45°,</text><text class="lab" x="110" y="1718" font-size="22">un peu plus haute que toi</text>
  <!-- fenêtre -->
  <rect x="980" y="1430" width="20" height="230" fill="#7fc4ef"/>
  <path d="M980 1460 L620 1400 M980 1630 L620 1460" stroke="#7fc4ef" stroke-width="3" stroke-dasharray="8 8"/>
  <text class="labb" x="970" y="1350" text-anchor="end" font-size="22">Fenêtre de côté ou de face,</text>
  <text class="lab" x="970" y="1377" text-anchor="end" font-size="22">jamais derrière toi</text>

  <!-- bas -->
  <rect x="60" y="1795" width="960" height="95" rx="22" fill="#1b1f5e"/>
  <text x="540" y="1838" text-anchor="middle" font-size="27" fill="#f5c518" font-weight="700">Ordre d'achat : 1. le son · 2. la lumière · 3. le trépied · 4. le fond</text>
  <text x="540" y="1874" text-anchor="middle" font-size="23" fill="#fff">Un son propre compte plus qu'une image parfaite.</text>
</svg>
</body></html>
